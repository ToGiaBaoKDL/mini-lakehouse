jobs:
  - name: airflow_origin
    update_every: 10
    url: http://127.0.0.1:8080/api/v2/version
    status_accepted: [200]
    response_match: '"version"\s*:'
    timeout: 2

  - name: lightdash_origin
    update_every: 10
    url: http://127.0.0.1:8081/api/v1/health
    status_accepted: [200]
    timeout: 2

  - name: arxiv_lens_origin
    update_every: 10
    url: http://127.0.0.1:8501/_stcore/health
    status_accepted: [200]
    response_match: '^ok\s*$'
    timeout: 2
