[app]
    name = airflow
    metrics = airflow.*
    private charts = no
    gaps when not collected = yes

[heartbeats]
    name = heartbeats
    title = Component heartbeat rate
    family = availability
    context = airflow.heartbeats
    units = heartbeats/s
    priority = 91000
    type = line
    dimension = airflow.scheduler_heartbeat scheduler last 1 1
    dimension = airflow.dag_processor_heartbeat dag_processor last 1 1

[scheduler_tasks]
    name = scheduler_tasks
    title = Scheduler task pressure
    family = scheduler
    context = airflow.scheduler_tasks
    units = tasks
    priority = 91010
    type = line
    dimension = airflow.scheduler.tasks.executable executable last 1 1
    dimension = airflow.scheduler.tasks.starving starving last 1 1

[running_dag_runs]
    name = running_dag_runs
    title = Active DAG runs
    family = scheduler
    context = airflow.running_dag_runs
    units = runs
    priority = 91020
    type = line
    dimension = airflow.scheduler.dagruns.running running last 1 1

[dag_file_queue]
    name = dag_file_queue
    title = Queued DAG files
    family = scheduler
    context = airflow.dag_file_queue
    units = files
    priority = 91030
    type = line
    dimension = airflow.dag_processing.file_path_queue_size queued last 1 1

[executor_tasks]
    name = executor_tasks
    title = Executor task state
    family = executor
    context = airflow.executor_tasks
    units = tasks
    priority = 91040
    type = line
    dimension = airflow.executor.running_tasks running last 1 1
    dimension = airflow.executor.queued_tasks queued last 1 1

[executor_slots]
    name = executor_slots
    title = Open executor slots
    family = executor
    context = airflow.executor_slots
    units = slots
    priority = 91050
    type = line
    dimension = airflow.executor.open_slots open last 1 1

[task_duration]
    name = task_duration
    title = Observed task duration (p95)
    family = task latency
    context = airflow.task_duration
    units = ms
    priority = 91060
    type = line
    dimension = airflow.task.duration p95 percentile 1 1

[task_queue_duration]
    name = task_queue_duration
    title = Observed task state duration (p95)
    family = task latency
    context = airflow.task_queue_duration
    units = ms
    priority = 91070
    type = line
    dimension = airflow.task.scheduled_duration scheduled percentile 1 1
    dimension = airflow.task.queued_duration queued percentile 1 1

[dag_run_duration]
    name = dag_run_duration
    title = Observed DAG run duration by outcome (p95)
    family = dag run latency
    context = airflow.dag_run_duration
    units = ms
    priority = 91080
    type = line
    dimension = airflow.dagrun.duration.success success percentile 1 1
    dimension = airflow.dagrun.duration.failed failed percentile 1 1

[dag_run_delay]
    name = dag_run_delay
    title = Observed DAG run scheduling delay (p95)
    family = dag run latency
    context = airflow.dag_run_delay
    units = ms
    priority = 91090
    type = line
    dimension = airflow.dagrun.schedule_delay schedule percentile 1 1
    dimension = airflow.dagrun.first_task_scheduling_delay first_task_scheduled percentile 1 1
    dimension = airflow.dagrun.first_task_start_delay first_task_started percentile 1 1

[scheduler_duration]
    name = scheduler_duration
    title = Observed scheduler internal duration (p95)
    family = scheduler latency
    context = airflow.scheduler_duration
    units = ms
    priority = 91100
    type = line
    dimension = airflow.scheduler.scheduler_loop_duration loop percentile 1 1
    dimension = airflow.scheduler.critical_section_duration critical_section percentile 1 1
    dimension = airflow.scheduler.critical_section_query_duration critical_section_query percentile 1 1
    dimension = airflow.scheduler.executor_heartbeat_duration executor_heartbeat percentile 1 1
