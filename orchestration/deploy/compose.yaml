x-airflow-common: &airflow-common
  image: "${AIRFLOW_IMAGE:-airflow:local}"
  user: "${LOCAL_UID}:0"
  environment: &airflow-environment
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__PARALLELISM: "4"
    AIRFLOW__CORE__RERUN_WITH_LATEST_VERSION: "true"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/auth/simple_auth_manager_passwords.json
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN_CMD: >-
      python -c "import sys; from pathlib import Path; from urllib.parse import quote_plus;
      password = quote_plus(Path('/run/secrets/airflow_database_password').read_text().strip());
      sys.stdout.write('postgresql+psycopg2://airflow:' + password + '@metadata-postgres:5432/airflow')"
    AIRFLOW__DAG_PROCESSOR__BUNDLE_REFRESH_CHECK_INTERVAL: "5"
    AIRFLOW__DAG_PROCESSOR__DAG_BUNDLE_CONFIG_LIST: >-
      [{"name":"lakehouse","classpath":"airflow.providers.git.bundles.git.GitDagBundle","kwargs":{"repo_url":"https://github.com/ToGiaBaoKDL/mini-lakehouse.git","tracking_ref":"main","subdir":"orchestration/bundle","sparse_dirs":["orchestration/bundle"],"refresh_interval":60}}]
    AIRFLOW__DAG_PROCESSOR__DAG_BUNDLE_STORAGE_PATH: /opt/airflow/dag-bundles
    AIRFLOW__DAG_PROCESSOR__DISABLE_BUNDLE_VERSIONING: "false"
    AIRFLOW__API_AUTH__JWT_SECRET_CMD: cat /run/secrets/airflow_jwt_secret
    AIRFLOW__API__BASE_URL: "${AIRFLOW_BASE_URL:-http://127.0.0.1:8080}"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__CORE__FERNET_KEY_CMD: cat /run/secrets/airflow_fernet_key
    AIRFLOW__SECRETS__BACKEND: airflow_runtime.secrets.AwsSecretsBackend
    AIRFLOW__SECRETS__BACKEND_KWARGS: '{"connections_prefix":"lakehouse/${LAKEHOUSE_ENVIRONMENT}/airflow/connections","variables_prefix":"/lakehouse/${LAKEHOUSE_ENVIRONMENT}"}'
    AIRFLOW__LOGGING__REMOTE_LOGGING: "true"
    AIRFLOW__LOGGING__REMOTE_BASE_LOG_FOLDER: "${AIRFLOW_REMOTE_LOG_URI}"
    AIRFLOW__LOGGING__DELETE_LOCAL_LOGS: "true"
    AWS_CONFIG_FILE: /run/aws/config
    AWS_EC2_METADATA_DISABLED: "true"
    LAKEHOUSE_ENVIRONMENT: "${LAKEHOUSE_ENVIRONMENT}"
    HOST_AWS_IDENTITY_DIR: "${AWS_IDENTITY_DIR}"
    PYTHONWARNINGS: "ignore:ProvidersManager.hooks is deprecated"
  secrets: &airflow-secrets
    - airflow_database_password
    - airflow_fernet_key
    - airflow_jwt_secret
    - airflow_admin_passwords
  volumes:
    - airflow-auth:/opt/airflow/auth
    - airflow-dag-bundles:/opt/airflow/dag-bundles
    - airflow-logs:/opt/airflow/logs
    - ${AWS_IDENTITY_DIR}/airflow:/run/aws:ro
  networks:
    - metadata
    - runtime
  depends_on:
    airflow-init:
      condition: service_completed_successfully
  restart: unless-stopped
  stop_grace_period: 60s

services:
  airflow-volumes-init:
    image: "${AIRFLOW_IMAGE:-airflow:local}"
    user: "0:0"
    entrypoint: ["sh", "-ec"]
    command:
      - >-
        chgrp -R 0 /opt/airflow/auth /opt/airflow/dag-bundles /opt/airflow/logs;
        chmod -R g+rwX /opt/airflow/auth /opt/airflow/dag-bundles /opt/airflow/logs
    volumes:
      - airflow-auth:/opt/airflow/auth
      - airflow-dag-bundles:/opt/airflow/dag-bundles
      - airflow-logs:/opt/airflow/logs
    restart: "no"

  airflow-init:
    image: "${AIRFLOW_IMAGE:-airflow:local}"
    user: "${LOCAL_UID}:0"
    environment:
      <<: *airflow-environment
    secrets: *airflow-secrets
    volumes:
      - airflow-auth:/opt/airflow/auth
      - airflow-logs:/opt/airflow/logs
      - ${AWS_IDENTITY_DIR}/airflow:/run/aws:ro
    networks:
      - metadata
      - runtime
    depends_on:
      airflow-volumes-init:
        condition: service_completed_successfully
    command:
      - bash
      - -ec
      - >-
        install -m 0600 /run/secrets/airflow_admin_passwords
        /opt/airflow/auth/simple_auth_manager_passwords.json;
        exec airflow db migrate
    restart: "no"

  airflow-api-server:
    <<: *airflow-common
    command: airflow api-server
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:8080:8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request as u; u.urlopen('http://localhost:8080/api/v2/version', timeout=2)",
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s

  airflow-scheduler:
    <<: *airflow-common
    command: airflow scheduler
    group_add:
      - "${DOCKER_GID}"
    volumes:
      - airflow-auth:/opt/airflow/auth
      - airflow-dag-bundles:/opt/airflow/dag-bundles
      - airflow-logs:/opt/airflow/logs
      - ${AWS_IDENTITY_DIR}/airflow:/run/aws:ro
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  airflow-dag-processor:
    <<: *airflow-common
    command: airflow dag-processor
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "airflow jobs check --job-type DagProcessorJob --hostname \"$${HOSTNAME}\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  airflow-auth:
  airflow-dag-bundles:
  airflow-logs:

networks:
  metadata:
    external: true
    name: lakehouse-metadata
  runtime:

secrets:
  airflow_database_password:
    environment: AIRFLOW_DATABASE_PASSWORD
  airflow_fernet_key:
    environment: AIRFLOW_FERNET_KEY
  airflow_jwt_secret:
    environment: AIRFLOW_JWT_SECRET
  airflow_admin_passwords:
    environment: AIRFLOW_ADMIN_PASSWORDS
