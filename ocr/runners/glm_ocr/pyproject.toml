[project]
name = "document-ocr-glm-runner"
version = "3.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "glmocr[selfhosted]==0.1.5",
    "pydantic>=2.12,<3",
    "pymupdf>=1.28,<2",
    "pyyaml>=6.0.3,<7",
    "requests>=2.32,<3",
    "typer==0.27.0",
    "vllm==0.25.1",
    "wrapt==2.2.2",
    "zstandard>=0.23,<1",
]

[project.optional-dependencies]
modal = ["huggingface-hub>=1.7,<2"]

[tool.uv]
package = false
