version: 1
name: arxiv_opendataloader_pdf
adapter: opendataloader_pdf
adapter_version: 2.5.0

limits:
  max_pdf_bytes: 104857600
  max_pages_per_document: 500
  max_output_bytes: 1073741824

# Only output-affecting choices belong here. Required adapter invariants
# (JSON + official HTML-in-Markdown, external images, one thread, hybrid off)
# are pinned in code and covered by contract tests.
options:
  reading_order: xycut
  table_method: default
  image_format: png
  include_header_footer: false
  keep_line_breaks: false
  replace_invalid_chars: "�"
  use_struct_tree: false
  sanitize: false
