version: 1
name: arxiv_glm_ocr
adapter: glm_ocr
adapter_version: 1.1.0

model:
  repository: zai-org/GLM-OCR
  revision: ca5d8b3e287e52589e37c28385d9655ee4372f9d

layout_model:
  repository: PaddlePaddle/PP-DocLayoutV3_safetensors
  revision: 97d101e6db2642e162a1d05392d1b0231c91033e

limits:
  max_pdf_bytes: 104857600
  max_pages_per_document: 500
  max_output_bytes: 1073741824

inference:
  api_port: 8080
  dtype: float16
  max_model_len: 16384
  gpu_memory_utilization: 0.80
  speculative_tokens: 3
  enforce_eager: true
  max_num_seqs: 4
  max_workers: 8
  request_timeout_seconds: 600
  layout_device: cpu

runner:
  kaggle:
    kernel_name: document-ocr-arxiv-glm-ocr
    runner_dataset_name: document-ocr-arxiv-glm-ocr-runner
    runner_dataset_version: 1
    model_source: botgia/mini-lakehouse-glm-ocr/transformers/safetensors/1
    layout_model_source: botgia/mini-lakehouse-pp-doclayout-v3/transformers/safetensors/1
    accelerator: NvidiaTeslaT4
    timeout_seconds: 14400
  modal:
    app_name: document-ocr-arxiv-glm-ocr
    function_name: run_ocr
    output_volume: document-ocr-outputs
    environment: main
    gpu: A100-40GB
    timeout_seconds: 14400
    scaledown_window_seconds: 300
