[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[project]
name = "document-ocr"
version = "3.0.0"
description = "Document extraction workflows with native CPU and remote GPU runtimes."
requires-python = ">=3.12,<3.13"
dependencies = [
    "loguru==0.7.3",
    "pydantic>=2.12,<3",
    "pymupdf>=1.28,<2",
    "pyyaml>=6.0.3,<7",
    "requests>=2.32,<3",
    "zstandard>=0.23,<1",
]

[project.optional-dependencies]
worker = [
    "boto3>=1.42,<2",
    "botocore>=1.42,<2",
    "lakehouse",
    "modal>=1.5.3,<1.6",
    "opendataloader-pdf==2.5.0",
    "pyarrow>=23,<26",
    "pyiceberg[glue,pyarrow]>=0.10,<0.12",
    "typer==0.25.1",
]

[project.scripts]
document-ocr = "document_ocr.cli:app"

[tool.uv.sources]
lakehouse = { workspace = true }
