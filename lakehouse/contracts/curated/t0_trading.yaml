version: 1
name: t0_trading
database: curated_t0_trading
owner: t0-trading
contact:
  name: T0 Trading
  email: baokdl2226@gmail.com
description: Deterministic point-in-time T0 research facts reproduced from certified market captures.
upstream_sources: [ssi_fastconnect_stream]

tables:
  - key: market_day_certifications
    name: market_day_certifications
    description: Current deterministic eligibility of one market day for feature publication and backtesting.
    primary_key: [trade_date, configuration_sha256]
    columns:
      - {field_id: 1, name: trade_date, data_type: date, required: true, description: Exchange-local trading date being assessed.}
      - {field_id: 2, name: configuration_version, data_type: string, required: true, description: Human-readable effective trading configuration version.}
      - {field_id: 3, name: configuration_sha256, data_type: string, required: true, description: SHA-256 of the exact effective trading configuration.}
      - {field_id: 4, name: status, data_type: string, required: true, description: Deterministic passed or failed backtest eligibility status.}
      - {field_id: 5, name: failure_reason, data_type: string, required: false, description: Stable failure reason; null only when status is passed.}
      - {field_id: 6, name: manifest_count, data_type: long, required: true, description: Terminal manifests included in the current evidence set.}
      - {field_id: 7, name: full_window_session_count, data_type: long, required: true, description: Sessions individually covering the configured market window.}
      - {field_id: 8, name: eligible_session_count, data_type: long, required: true, description: Transport segments in the selected logical capture before reconciliation.}
      - {field_id: 9, name: selected_stream_session_id, data_type: string, required: false, description: Authorized transport session for backward-compatible single-segment captures.}
      - {field_id: 10, name: evidence_sha256, data_type: string, required: true, description: SHA-256 of the sorted immutable manifest hash set.}
      - {field_id: 11, name: evaluated_at, data_type: timestamptz, required: true, description: UTC time the current evidence set was first evaluated.}
      - {field_id: 12, name: selected_stream_session_ids_json, data_type: string, required: false, description: Canonical JSON array of transport segments authorized for logical-day replay.}
      - {field_id: 13, name: gap_count, data_type: long, required: false, description: Active-market transport gaps in the authorized capture.}
      - {field_id: 14, name: gap_duration_milliseconds, data_type: long, required: false, description: Total duration of active-market transport gaps in milliseconds.}
    partitioning:
      - {field_id: 1000, field: trade_date, transform: identity}

  - key: feature_snapshots
    name: feature_snapshots
    description: One versioned feature vector for a symbol at an exact decision instant.
    primary_key: [feature_version, configuration_sha256, symbol, decision_at]
    columns:
      - {field_id: 1, name: schema_version, data_type: long, required: true, description: Feature snapshot contract version.}
      - {field_id: 2, name: feature_version, data_type: string, required: true, description: Version of the deterministic feature formulas and policies.}
      - {field_id: 3, name: configuration_version, data_type: string, required: true, description: Human-readable effective trading configuration version.}
      - {field_id: 4, name: configuration_sha256, data_type: string, required: true, description: SHA-256 of the exact effective configuration.}
      - {field_id: 5, name: symbol, data_type: string, required: true, description: Normalized security symbol.}
      - {field_id: 6, name: trade_date, data_type: date, required: true, description: Exchange-local trading date.}
      - {field_id: 7, name: decision_at, data_type: timestamptz, required: true, description: UTC point-in-time evaluation boundary.}
      - {field_id: 8, name: market_session, data_type: string, required: true, description: Configured exchange session containing the decision instant.}
      - {field_id: 9, name: stream_session_id, data_type: string, required: true, description: Certified SSI capture session used by this replay.}
      - {field_id: 10, name: last_receive_sequence, data_type: long, required: true, description: Last callback sequence available at the decision instant.}
      - {field_id: 11, name: trade_age_seconds, data_type: decimal, precision: 18, scale: 6, required: false, description: Receipt-time age of the latest trade.}
      - {field_id: 12, name: quote_age_seconds, data_type: decimal, precision: 18, scale: 6, required: false, description: Receipt-time age of the latest complete quote.}
      - {field_id: 13, name: mid_price, data_type: decimal, precision: 24, scale: 8, required: false, description: Best-bid and best-ask midpoint in VND.}
      - {field_id: 14, name: microprice, data_type: decimal, precision: 24, scale: 8, required: false, description: Opposite-depth-weighted level-one microprice in VND.}
      - {field_id: 15, name: microprice_deviation_bps, data_type: decimal, precision: 18, scale: 4, required: false, description: Microprice deviation from midpoint in basis points.}
      - {field_id: 16, name: spread, data_type: decimal, precision: 18, scale: 0, required: false, description: Best ask minus best bid in VND.}
      - {field_id: 17, name: spread_bps, data_type: decimal, precision: 18, scale: 4, required: false, description: Quoted spread relative to midpoint in basis points.}
      - {field_id: 18, name: bid_depth, data_type: long, required: false, description: Total visible bid quantity across configured quote levels.}
      - {field_id: 19, name: ask_depth, data_type: long, required: false, description: Total visible ask quantity across configured quote levels.}
      - {field_id: 20, name: level_one_imbalance, data_type: decimal, precision: 10, scale: 8, required: false, description: Normalized best-level bid versus ask depth imbalance.}
      - {field_id: 21, name: depth_imbalance, data_type: decimal, precision: 10, scale: 8, required: false, description: Normalized configured-depth bid versus ask imbalance.}
      - {field_id: 22, name: is_eligible, data_type: boolean, required: true, description: Whether all configured data-quality and warm-up gates allow this snapshot.}
      - {field_id: 23, name: eligibility_reasons_json, data_type: string, required: true, description: Canonical JSON array of structured abstention reasons.}
      - {field_id: 24, name: available_at, data_type: timestamptz, required: true, description: Earliest UTC instant at which the feature vector was available.}
      - {field_id: 25, name: processed_at, data_type: timestamptz, required: true, description: UTC time of durable replay materialization.}
      - {field_id: 26, name: manifest_sha256, data_type: string, required: true, description: SHA-256 of the selected immutable manifest set.}
      - {field_id: 27, name: snapshot_sha256, data_type: string, required: true, description: SHA-256 of the canonical complete FeatureSnapshot.}
    partitioning:
      - {field_id: 1000, field: trade_date, transform: identity}

  - key: feature_windows
    name: feature_windows
    description: One trailing-window component belonging to a deterministic feature snapshot.
    primary_key: [feature_version, configuration_sha256, symbol, decision_at, window_seconds]
    columns:
      - {field_id: 1, name: feature_version, data_type: string, required: true, description: Parent feature formula and policy version.}
      - {field_id: 2, name: configuration_sha256, data_type: string, required: true, description: SHA-256 of the exact effective configuration.}
      - {field_id: 3, name: symbol, data_type: string, required: true, description: Normalized security symbol.}
      - {field_id: 4, name: trade_date, data_type: date, required: true, description: Exchange-local trading date.}
      - {field_id: 5, name: decision_at, data_type: timestamptz, required: true, description: UTC point-in-time evaluation boundary.}
      - {field_id: 6, name: window_seconds, data_type: long, required: true, description: Trailing receipt-time window length in seconds.}
      - {field_id: 7, name: trade_count, data_type: long, required: true, description: Executable trade observations in the window.}
      - {field_id: 8, name: quote_change_count, data_type: long, required: true, description: Complete quote transitions in the window.}
      - {field_id: 9, name: trade_volume, data_type: long, required: true, description: Matched share quantity in the window.}
      - {field_id: 10, name: signed_trade_volume, data_type: long, required: true, description: Buyer-aggressed minus seller-aggressed quantity; unclassified executions contribute zero.}
      - {field_id: 11, name: trade_volume_per_second, data_type: decimal, precision: 24, scale: 8, required: false, description: Matched share quantity normalized by configured window duration.}
      - {field_id: 12, name: trade_volume_imbalance, data_type: decimal, precision: 10, scale: 8, required: false, description: "Signed classified volume divided by all matched volume, including unclassified executions."}
      - {field_id: 13, name: level_one_order_flow_imbalance, data_type: long, required: true, description: Cont-style best-level order-flow imbalance across quote transitions.}
      - {field_id: 14, name: price_return_bps, data_type: decimal, precision: 18, scale: 4, required: false, description: First-to-last matched-price return in basis points.}
      - {field_id: 15, name: realized_volatility_bps, data_type: decimal, precision: 18, scale: 4, required: false, description: Root sum of squared adjacent trade returns in basis points.}
      - {field_id: 16, name: vwap, data_type: decimal, precision: 24, scale: 8, required: false, description: Volume-weighted matched price in VND.}
      - {field_id: 17, name: last_price_to_vwap_bps, data_type: decimal, precision: 18, scale: 4, required: false, description: Last matched price deviation from window VWAP in basis points.}
      - {field_id: 18, name: snapshot_sha256, data_type: string, required: true, description: Immutable parent snapshot fingerprint.}
    partitioning:
      - {field_id: 1000, field: trade_date, transform: identity}

  - key: outcome_labels
    name: outcome_labels
    description: Immutable conditional Top-3 execution markouts for one feature snapshot, action, and horizon.
    primary_key: [outcome_configuration_sha256, feature_snapshot_sha256, action, horizon_seconds]
    columns:
      - {field_id: 1, name: schema_version, data_type: long, required: true, description: Outcome label contract version.}
      - {field_id: 2, name: outcome_version, data_type: string, required: true, description: Version of the deterministic execution and markout policy.}
      - {field_id: 3, name: outcome_configuration_sha256, data_type: string, required: true, description: SHA-256 of the exact effective outcome policy.}
      - {field_id: 4, name: feature_version, data_type: string, required: true, description: Version of the parent deterministic feature formulas and policies.}
      - {field_id: 5, name: feature_configuration_sha256, data_type: string, required: true, description: SHA-256 of the exact parent feature configuration.}
      - {field_id: 6, name: feature_snapshot_sha256, data_type: string, required: true, description: Immutable parent feature snapshot fingerprint.}
      - {field_id: 7, name: stream_session_id, data_type: string, required: true, description: Certified SSI capture session used for both features and markouts.}
      - {field_id: 8, name: symbol, data_type: string, required: true, description: Normalized security symbol.}
      - {field_id: 9, name: trade_date, data_type: date, required: true, description: Exchange-local trading date.}
      - {field_id: 10, name: decision_at, data_type: timestamptz, required: true, description: UTC point-in-time feature evaluation boundary.}
      - {field_id: 11, name: action, data_type: string, required: true, description: Conditional BUY or SELL action evaluated by the simulator.}
      - {field_id: 12, name: horizon_seconds, data_type: long, required: true, description: Markout horizon measured from the feature decision instant.}
      - {field_id: 13, name: order_quantity, data_type: long, required: true, description: Shares walked through the visible Top-3 book.}
      - {field_id: 14, name: entry_at, data_type: timestamptz, required: true, description: UTC simulated entry instant after configured latency.}
      - {field_id: 15, name: horizon_at, data_type: timestamptz, required: true, description: UTC markout instant.}
      - {field_id: 16, name: entry_quote_received_at, data_type: timestamptz, required: false, description: Receipt time of the quote selected for entry.}
      - {field_id: 17, name: entry_receive_sequence, data_type: long, required: false, description: Capture sequence of the quote selected for entry.}
      - {field_id: 18, name: entry_vwap, data_type: decimal, precision: 24, scale: 8, required: false, description: Simulated entry VWAP across visible book levels in VND.}
      - {field_id: 19, name: horizon_quote_received_at, data_type: timestamptz, required: false, description: Receipt time of the quote selected for exit markout.}
      - {field_id: 20, name: horizon_receive_sequence, data_type: long, required: false, description: Capture sequence of the quote selected for exit markout.}
      - {field_id: 21, name: horizon_vwap, data_type: decimal, precision: 24, scale: 8, required: false, description: Simulated opposing-side VWAP at the horizon in VND.}
      - {field_id: 22, name: gross_return_bps, data_type: decimal, precision: 18, scale: 4, required: false, description: Gross directional markout return before fees and taxes in basis points.}
      - {field_id: 23, name: is_eligible, data_type: boolean, required: true, description: Whether every feature and execution-quality gate passed.}
      - {field_id: 24, name: outcome_reasons_json, data_type: string, required: true, description: Canonical JSON array of structured outcome abstention reasons.}
      - {field_id: 25, name: processed_at, data_type: timestamptz, required: true, description: UTC time of durable outcome materialization.}
      - {field_id: 26, name: outcome_sha256, data_type: string, required: true, description: SHA-256 of the canonical complete OutcomeLabel.}
    partitioning:
      - {field_id: 1000, field: trade_date, transform: identity}

  - key: decision_contexts
    name: decision_contexts
    description: Versioned point-in-time zone, broad-market confirmation, and regime context for each feature clock.
    primary_key: [context_configuration_sha256, feature_configuration_sha256, decision_at, data_mode]
    columns:
      - {field_id: 1, name: schema_version, data_type: long, required: true, description: Decision-context contract version.}
      - {field_id: 2, name: context_version, data_type: string, required: true, description: Version of the deterministic context policy.}
      - {field_id: 3, name: context_configuration_sha256, data_type: string, required: true, description: SHA-256 of the exact context policy.}
      - {field_id: 4, name: feature_configuration_sha256, data_type: string, required: true, description: SHA-256 of the parent feature configuration.}
      - {field_id: 5, name: trade_date, data_type: date, required: true, description: Exchange-local trading date.}
      - {field_id: 6, name: decision_at, data_type: timestamptz, required: true, description: UTC point-in-time evaluation boundary.}
      - {field_id: 7, name: data_mode, data_type: string, required: true, description: LIVE or explicit HISTORICAL_PROXY context mode.}
      - {field_id: 8, name: market_confirmation_strength, data_type: decimal, precision: 10, scale: 8, required: false, description: Conservative cross-index upward confirmation strength.}
      - {field_id: 9, name: regime, data_type: string, required: true, description: Deterministic broad-market regime or UNKNOWN.}
      - {field_id: 10, name: reasons_json, data_type: string, required: true, description: Canonical JSON context failure reasons.}
      - {field_id: 11, name: zones_json, data_type: string, required: true, description: Canonical JSON symbol-zone facts and feature lineage.}
      - {field_id: 12, name: indices_json, data_type: string, required: true, description: Canonical JSON index windows and explicit source lineage.}
      - {field_id: 13, name: processed_at, data_type: timestamptz, required: true, description: UTC materialization time.}
      - {field_id: 14, name: context_sha256, data_type: string, required: true, description: SHA-256 of the canonical complete DecisionContext.}
      - {field_id: 15, name: market_statuses_json, data_type: string, required: true, description: "Canonical JSON point-in-time market status, tradability gate, and source lineage."}
    partitioning:
      - {field_id: 1000, field: trade_date, transform: identity}

  - key: strategy_candidates
    name: strategy_candidates
    description: Complete buy-first baseline candidate and abstention matrix with feature and context lineage; never an order intent.
    primary_key: [baseline_version, strategy, symbol, decision_at, context_snapshot_sha256, context_data_mode]
    columns:
      - {field_id: 1, name: schema_version, data_type: long, required: true, description: Baseline-candidate contract version.}
      - {field_id: 2, name: baseline_version, data_type: string, required: true, description: Version of the deterministic buy-first baseline formulas.}
      - {field_id: 3, name: strategy, data_type: string, required: true, description: Baseline strategy name.}
      - {field_id: 4, name: symbol, data_type: string, required: true, description: Security symbol.}
      - {field_id: 5, name: trade_date, data_type: date, required: true, description: Exchange-local trading date.}
      - {field_id: 6, name: decision_at, data_type: timestamptz, required: true, description: UTC point-in-time feature clock.}
      - {field_id: 7, name: feature_snapshot_sha256, data_type: string, required: true, description: Immutable parent feature fingerprint.}
      - {field_id: 8, name: peer_feature_snapshot_sha256, data_type: string, required: false, description: Immutable peer feature fingerprint for relative-value research.}
      - {field_id: 9, name: context_snapshot_sha256, data_type: string, required: true, description: Immutable point-in-time context fingerprint.}
      - {field_id: 10, name: context_version, data_type: string, required: true, description: Context policy version.}
      - {field_id: 11, name: context_configuration_sha256, data_type: string, required: true, description: Exact context-policy fingerprint.}
      - {field_id: 12, name: market_regime, data_type: string, required: true, description: Regime carried from the linked context.}
      - {field_id: 13, name: groups_json, data_type: string, required: true, description: Canonical JSON evidence-group strengths and statuses.}
      - {field_id: 14, name: strength, data_type: decimal, precision: 10, scale: 8, required: true, description: Deterministic candidate strength; zero when blocked.}
      - {field_id: 15, name: is_candidate, data_type: boolean, required: true, description: Whether all required baseline gates passed.}
      - {field_id: 16, name: block_reasons_json, data_type: string, required: true, description: Canonical JSON abstention reasons.}
      - {field_id: 17, name: processed_at, data_type: timestamptz, required: true, description: UTC materialization time.}
      - {field_id: 18, name: candidate_sha256, data_type: string, required: true, description: SHA-256 of the canonical complete BaselineCandidate.}
      - {field_id: 19, name: context_data_mode, data_type: string, required: true, description: LIVE or HISTORICAL_PROXY source mode inherited from the linked context.}
    partitioning:
      - {field_id: 1000, field: trade_date, transform: identity}

  - key: candidate_arbitrations
    name: candidate_arbitrations
    description: Prospective outcome-blind selection or rejection of every immutable buy-first candidate; never an order intent.
    primary_key: [arbitration_configuration_sha256, candidate_sha256]
    columns:
      - {field_id: 1, name: schema_version, data_type: long, required: true, description: Candidate-arbitration contract version.}
      - {field_id: 2, name: arbitration_version, data_type: string, required: true, description: Effective arbitration policy version.}
      - {field_id: 3, name: arbitration_configuration_sha256, data_type: string, required: true, description: SHA-256 of the exact arbitration policy.}
      - {field_id: 4, name: candidate_version, data_type: string, required: true, description: Version of the candidate formulas being arbitrated.}
      - {field_id: 5, name: candidate_sha256, data_type: string, required: true, description: Immutable strategy-candidate fingerprint.}
      - {field_id: 6, name: strategy, data_type: string, required: true, description: Candidate strategy name.}
      - {field_id: 7, name: symbol, data_type: string, required: true, description: Security symbol.}
      - {field_id: 8, name: trade_date, data_type: date, required: true, description: Exchange-local trading date.}
      - {field_id: 9, name: decision_at, data_type: timestamptz, required: true, description: UTC point-in-time arbitration clock.}
      - {field_id: 10, name: action, data_type: string, required: true, description: BUY action owned by the current buy-first candidate family.}
      - {field_id: 11, name: horizon_seconds, data_type: long, required: true, description: Configured holding horizon selected without reading outcomes.}
      - {field_id: 12, name: strength, data_type: decimal, precision: 10, scale: 8, required: true, description: Candidate strength visible at the arbitration clock.}
      - {field_id: 13, name: status, data_type: string, required: true, description: SELECTED or REJECTED policy result.}
      - {field_id: 14, name: rejection_reason, data_type: string, required: false, description: Structured fail-closed reason for a rejected candidate.}
      - {field_id: 15, name: priority, data_type: long, required: false, description: Deterministic within-clock execution priority for selected candidates.}
      - {field_id: 16, name: selected_candidate_sha256, data_type: string, required: false, description: Selected candidate itself or the selected conflict that caused rejection.}
      - {field_id: 17, name: processed_at, data_type: timestamptz, required: true, description: UTC materialization time excluded from decision identity.}
      - {field_id: 18, name: arbitration_sha256, data_type: string, required: true, description: SHA-256 of the canonical complete CandidateArbitration.}
    partitioning:
      - {field_id: 1000, field: trade_date, transform: identity}

  - key: strategy_evaluations
    name: strategy_evaluations
    description: Gross and public-fee-adjusted conditional baseline results, including explicit regime slices.
    primary_key: [baseline_version, trade_date, evaluation_scope, regime, strategy, symbol, horizon_seconds, feature_configuration_sha256, context_configuration_sha256, context_data_mode, outcome_configuration_sha256, cost_policy_sha256]
    columns:
      - {field_id: 1, name: baseline_version, data_type: string, required: true, description: Evaluated buy-first baseline version.}
      - {field_id: 2, name: trade_date, data_type: date, required: true, description: Exchange-local trading date.}
      - {field_id: 3, name: evaluation_scope, data_type: string, required: true, description: OVERALL or REGIME evaluation grain.}
      - {field_id: 4, name: regime, data_type: string, required: true, description: ALL for overall facts or the classified market regime.}
      - {field_id: 5, name: strategy, data_type: string, required: true, description: Baseline strategy name.}
      - {field_id: 6, name: symbol, data_type: string, required: true, description: Security symbol.}
      - {field_id: 7, name: horizon_seconds, data_type: long, required: true, description: Conditional BUY-to-SELL markout horizon.}
      - {field_id: 8, name: observed_count, data_type: long, required: false, description: Baseline observations at overall grain.}
      - {field_id: 9, name: raw_candidate_count, data_type: long, required: false, description: Candidates before non-overlap selection at overall grain.}
      - {field_id: 10, name: candidate_count, data_type: long, required: true, description: Non-overlapping selected candidates.}
      - {field_id: 11, name: eligible_outcome_count, data_type: long, required: true, description: Selected candidates with eligible priced outcomes.}
      - {field_id: 12, name: positive_gross_count, data_type: long, required: false, description: Positive gross outcomes at overall grain.}
      - {field_id: 13, name: positive_net_count, data_type: long, required: true, description: "Positive outcomes after configured fees, tax, and slippage."}
      - {field_id: 14, name: candidate_rate, data_type: decimal, precision: 10, scale: 8, required: false, description: Selected candidates divided by observations.}
      - {field_id: 15, name: outcome_coverage_rate, data_type: decimal, precision: 10, scale: 8, required: false, description: Eligible outcomes divided by selected candidates.}
      - {field_id: 16, name: average_gross_return_bps, data_type: decimal, precision: 18, scale: 4, required: false, description: Mean gross conditional markout.}
      - {field_id: 17, name: average_conditional_net_return_bps, data_type: decimal, precision: 18, scale: 4, required: false, description: Mean conditional return after configured public DTA costs.}
      - {field_id: 18, name: capture_evidence_sha256, data_type: string, required: false, description: Certified immutable stream evidence set.}
      - {field_id: 19, name: feature_configuration_sha256, data_type: string, required: true, description: Exact feature-configuration fingerprint.}
      - {field_id: 20, name: context_configuration_sha256, data_type: string, required: true, description: Exact context-policy fingerprint.}
      - {field_id: 21, name: outcome_configuration_sha256, data_type: string, required: true, description: Exact outcome-policy fingerprint.}
      - {field_id: 22, name: cost_policy_sha256, data_type: string, required: true, description: "Exact fee, tax, and slippage assumption fingerprint."}
      - {field_id: 23, name: cost_policy_json, data_type: string, required: true, description: Canonical JSON public-cost assumption.}
      - {field_id: 24, name: processed_at, data_type: timestamptz, required: true, description: UTC materialization time.}
      - {field_id: 25, name: audit_sha256, data_type: string, required: true, description: SHA-256 of the complete baseline audit report.}
      - {field_id: 26, name: context_data_mode, data_type: string, required: true, description: LIVE or HISTORICAL_PROXY mode shared by the evaluated contexts.}
    partitioning:
      - {field_id: 1000, field: trade_date, transform: identity}
