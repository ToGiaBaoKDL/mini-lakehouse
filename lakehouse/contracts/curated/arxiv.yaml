version: 1
name: arxiv
database: curated_arxiv
owner: data-platform
contact:
  name: Data Platform
  email: baokdl2226@gmail.com
description: Canonical current ArXiv metadata and OCR results.
upstream_sources: [arxiv]

tables:
  - key: papers
    name: papers
    description: Latest canonical metadata at one row per ArXiv article.
    primary_key: [arxiv_id]
    columns:
      - {field_id: 1, name: arxiv_id, data_type: string, required: true, description: Stable ArXiv article identifier.}
      - {field_id: 2, name: oai_identifier, data_type: string, required: true, description: Stable OAI identifier.}
      - {field_id: 3, name: title, data_type: string, required: false, description: Current normalized title.}
      - {field_id: 4, name: abstract, data_type: string, required: false, description: Current normalized abstract.}
      - {field_id: 5, name: license_uri, data_type: string, required: false, description: Current license URI.}
      - {field_id: 6, name: doi, data_type: string, required: false, description: Current DOI.}
      - {field_id: 7, name: journal_ref, data_type: string, required: false, description: Current journal reference.}
      - {field_id: 8, name: comments, data_type: string, required: false, description: Current author comments.}
      - {field_id: 9, name: created_date, data_type: date, required: false, description: Original submission date.}
      - {field_id: 10, name: updated_date, data_type: date, required: false, description: Latest revision date.}
      - {field_id: 11, name: oai_datestamp, data_type: date, required: true, description: Latest observed OAI modification date.}
      - {field_id: 12, name: pdf_url, data_type: string, required: true, description: Canonical PDF download URL.}
      - {field_id: 13, name: is_deleted, data_type: boolean, required: true, description: Current OAI tombstone state.}
      - {field_id: 14, name: source_record_sha256, data_type: string, required: true, description: Winning landing mutation hash.}
      - {field_id: 15, name: curated_at, data_type: timestamptz, required: true, description: Latest curation timestamp.}

  - key: paper_authors
    name: paper_authors
    description: Ordered author occurrences for current paper metadata.
    primary_key: [arxiv_id, author_position]
    columns:
      - {field_id: 1, name: arxiv_id, data_type: string, required: true, description: Parent paper identifier.}
      - {field_id: 2, name: author_position, data_type: long, required: true, description: One-based source author order.}
      - {field_id: 3, name: keyname, data_type: string, required: true, description: Author family/key name.}
      - {field_id: 4, name: forenames, data_type: string, required: false, description: Author forenames.}
      - {field_id: 5, name: suffix, data_type: string, required: false, description: Author suffix.}
      - {field_id: 6, name: affiliation, data_type: string, required: false, description: Source affiliation when present.}
      - {field_id: 7, name: oai_datestamp, data_type: date, required: true, description: Parent metadata mutation date.}
      - {field_id: 8, name: curated_at, data_type: timestamptz, required: true, description: Latest curation timestamp.}

  - key: paper_categories
    name: paper_categories
    description: Category memberships for current paper metadata.
    primary_key: [arxiv_id, category]
    columns:
      - {field_id: 1, name: arxiv_id, data_type: string, required: true, description: Parent paper identifier.}
      - {field_id: 2, name: category, data_type: string, required: true, description: ArXiv category code.}
      - {field_id: 3, name: is_primary, data_type: boolean, required: true, description: Whether this is the primary category.}
      - {field_id: 4, name: oai_datestamp, data_type: date, required: true, description: Parent metadata mutation date.}
      - {field_id: 5, name: curated_at, data_type: timestamptz, required: true, description: Latest curation timestamp.}

  - key: ocr_documents
    name: ocr_documents
    description: Latest successfully published OCR document for each ArXiv paper.
    primary_key: [arxiv_id]
    columns:
      - {field_id: 1, name: arxiv_id, data_type: string, required: true, description: Source paper identifier.}
      - {field_id: 2, name: oai_datestamp, data_type: date, required: true, description: Source metadata mutation date.}
      - {field_id: 3, name: source_record_sha256, data_type: string, required: true, description: Canonical source metadata hash.}
      - {field_id: 4, name: pdf_url, data_type: string, required: true, description: Source PDF URL.}
      - {field_id: 5, name: pdf_sha256, data_type: string, required: true, description: Observed source PDF hash.}
      - {field_id: 6, name: pdf_size_bytes, data_type: long, required: true, description: Observed source PDF size.}
      - {field_id: 7, name: page_count, data_type: long, required: true, description: Source PDF page count.}
      - {field_id: 8, name: processing_id, data_type: string, required: true, description: Paper/content/model/config identity.}
      - {field_id: 9, name: model_repository, data_type: string, required: true, description: Pinned OCR model repository.}
      - {field_id: 10, name: model_revision, data_type: string, required: true, description: Pinned OCR model revision.}
      - {field_id: 11, name: layout_model_repository, data_type: string, required: true, description: Pinned layout model repository.}
      - {field_id: 12, name: layout_model_revision, data_type: string, required: true, description: Pinned layout model revision.}
      - {field_id: 13, name: sdk_version, data_type: string, required: true, description: Pinned GLM-OCR SDK version.}
      - {field_id: 14, name: config_hash, data_type: string, required: true, description: Canonical OCR configuration hash.}
      - {field_id: 15, name: artifact_uri, data_type: string, required: true, description: Immutable artifact root.}
      - {field_id: 16, name: manifest_sha256, data_type: string, required: true, description: Document manifest hash.}
      - {field_id: 17, name: processed_at, data_type: timestamptz, required: true, description: Successful publication timestamp.}
