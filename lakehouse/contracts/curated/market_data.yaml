version: 1
name: market_data
database: curated_market_data
owner: market-data
contact:
  name: Market Data
  email: baokdl2226@gmail.com
description: Point-in-time market facts conformed from SSI FastConnect SDK captures.
upstream_sources: [ssi_fastconnect_rest, ssi_fastconnect_stream]

tables:
  - key: securities
    name: securities
    description: Effective-dated security attributes known at a stated availability time.
    primary_key: [symbol, effective_from]
    columns:
      - {field_id: 1, name: symbol, data_type: string, required: true, description: SSI security symbol.}
      - {field_id: 2, name: effective_from, data_type: date, required: true, description: First exchange-local date for this version.}
      - {field_id: 3, name: effective_to, data_type: date, required: false, description: Last inclusive exchange-local date for this version.}
      - {field_id: 4, name: exchange, data_type: string, required: true, description: Normalized exchange code.}
      - {field_id: 5, name: board, data_type: string, required: false, description: Provider board classification.}
      - {field_id: 6, name: security_name, data_type: string, required: false, description: Vietnamese security name.}
      - {field_id: 7, name: security_name_en, data_type: string, required: false, description: English security name.}
      - {field_id: 8, name: board_lot, data_type: long, required: false, description: Board-lot quantity when supplied.}
      - {field_id: 9, name: listed_shares, data_type: long, required: false, description: Listed share count known for this version.}
      - {field_id: 10, name: icb_code, data_type: string, required: false, description: Most specific SSI ICB classification code.}
      - {field_id: 11, name: first_trading_date, data_type: date, required: false, description: First known trading date.}
      - {field_id: 12, name: last_trading_date, data_type: date, required: false, description: Last known trading date for inactive securities.}
      - {field_id: 13, name: is_active, data_type: boolean, required: true, description: Whether the security was active for this version.}
      - {field_id: 14, name: available_at, data_type: timestamptz, required: true, description: Earliest UTC time this version was available.}
      - {field_id: 15, name: processed_at, data_type: timestamptz, required: true, description: UTC normalization completion time.}
      - {field_id: 16, name: source_record_sha256, data_type: string, required: true, description: Immutable landing record lineage.}

  - key: daily_security_summaries
    name: daily_security_summaries
    description: Revision-preserving daily security prices, limits, liquidity, and foreign flow.
    primary_key: [symbol, trade_date, revision]
    columns:
      - {field_id: 1, name: symbol, data_type: string, required: true, description: SSI security symbol.}
      - {field_id: 2, name: trade_date, data_type: date, required: true, description: Exchange-local trading date.}
      - {field_id: 3, name: revision, data_type: long, required: true, description: Zero-based revision ordered by availability.}
      - {field_id: 4, name: source_kind, data_type: string, required: true, description: SSI REST capture origin.}
      - {field_id: 5, name: open_price, data_type: decimal, precision: 18, scale: 0, required: false, description: Session open price in VND.}
      - {field_id: 6, name: high_price, data_type: decimal, precision: 18, scale: 0, required: false, description: Session high price in VND.}
      - {field_id: 7, name: low_price, data_type: decimal, precision: 18, scale: 0, required: false, description: Session low price in VND.}
      - {field_id: 8, name: close_price, data_type: decimal, precision: 18, scale: 0, required: false, description: Session close price in VND.}
      - {field_id: 9, name: reference_price, data_type: decimal, precision: 18, scale: 0, required: false, description: Point-in-time reference price in VND.}
      - {field_id: 10, name: ceiling_price, data_type: decimal, precision: 18, scale: 0, required: false, description: Point-in-time ceiling price in VND.}
      - {field_id: 11, name: floor_price, data_type: decimal, precision: 18, scale: 0, required: false, description: Point-in-time floor price in VND.}
      - {field_id: 12, name: matched_volume, data_type: long, required: false, description: Matched share quantity.}
      - {field_id: 13, name: matched_value, data_type: decimal, precision: 24, scale: 0, required: false, description: Matched turnover in VND.}
      - {field_id: 14, name: deal_volume, data_type: long, required: false, description: Put-through share quantity when supplied.}
      - {field_id: 15, name: deal_value, data_type: decimal, precision: 24, scale: 0, required: false, description: Put-through turnover in VND when supplied.}
      - {field_id: 16, name: foreign_buy_volume, data_type: long, required: false, description: Foreign buy quantity when supplied.}
      - {field_id: 17, name: foreign_sell_volume, data_type: long, required: false, description: Foreign sell quantity when supplied.}
      - {field_id: 18, name: foreign_buy_value, data_type: decimal, precision: 24, scale: 0, required: false, description: Foreign buy turnover in VND when supplied.}
      - {field_id: 19, name: foreign_sell_value, data_type: decimal, precision: 24, scale: 0, required: false, description: Foreign sell turnover in VND when supplied.}
      - {field_id: 20, name: available_at, data_type: timestamptz, required: true, description: Earliest UTC time this revision was available.}
      - {field_id: 21, name: processed_at, data_type: timestamptz, required: true, description: UTC normalization completion time.}
      - {field_id: 22, name: is_final, data_type: boolean, required: true, description: Whether this revision is session-final.}
      - {field_id: 23, name: source_record_sha256, data_type: string, required: true, description: Immutable landing record lineage.}
      - {field_id: 24, name: remaining_foreign_room, data_type: long, required: false, description: Remaining foreign ownership room after the session.}
      - {field_id: 25, name: total_foreign_room, data_type: long, required: false, description: Total foreign ownership room supplied by SSI.}
      - {field_id: 26, name: open_interest, data_type: decimal, precision: 24, scale: 0, required: false, description: Open derivative contract quantity when applicable.}
      - {field_id: 27, name: settlement_price, data_type: decimal, precision: 18, scale: 0, required: false, description: Derivative settlement price in VND when applicable.}
    partitioning:
      - {field_id: 1000, field: trade_date, transform: year, name: trade_year}

  - key: intraday_bars_1m
    name: intraday_bars_1m
    description: Conformed one-minute bars with source, finality, availability, and revision lineage.
    primary_key: [symbol, bar_start, revision]
    columns:
      - {field_id: 1, name: symbol, data_type: string, required: true, description: SSI security symbol.}
      - {field_id: 2, name: trade_date, data_type: date, required: true, description: Exchange-local trading date.}
      - {field_id: 3, name: bar_start, data_type: timestamptz, required: true, description: UTC interval start.}
      - {field_id: 4, name: revision, data_type: long, required: true, description: Zero-based revision ordered by availability.}
      - {field_id: 5, name: source_kind, data_type: string, required: true, description: "Trade-built, SSI interval, current REST, or historical REST origin."}
      - {field_id: 6, name: open_price, data_type: decimal, precision: 18, scale: 0, required: true, description: First matched price in VND.}
      - {field_id: 7, name: high_price, data_type: decimal, precision: 18, scale: 0, required: true, description: Highest matched price in VND.}
      - {field_id: 8, name: low_price, data_type: decimal, precision: 18, scale: 0, required: true, description: Lowest matched price in VND.}
      - {field_id: 9, name: close_price, data_type: decimal, precision: 18, scale: 0, required: true, description: Last matched price in VND.}
      - {field_id: 10, name: volume, data_type: long, required: true, description: Matched share quantity.}
      - {field_id: 11, name: value, data_type: decimal, precision: 24, scale: 0, required: false, description: Matched turnover in VND.}
      - {field_id: 12, name: trade_count, data_type: long, required: false, description: Captured trade count.}
      - {field_id: 13, name: vwap, data_type: decimal, precision: 24, scale: 8, required: false, description: Deterministic volume-weighted price in VND.}
      - {field_id: 14, name: buy_volume, data_type: long, required: false, description: Buyer-aggressed quantity.}
      - {field_id: 15, name: sell_volume, data_type: long, required: false, description: Seller-aggressed quantity.}
      - {field_id: 16, name: available_at, data_type: timestamptz, required: true, description: Earliest UTC consumer availability time.}
      - {field_id: 17, name: processed_at, data_type: timestamptz, required: true, description: UTC normalization completion time.}
      - {field_id: 18, name: is_final, data_type: boolean, required: true, description: Whether later events can no longer change this revision.}
      - {field_id: 19, name: source_record_sha256, data_type: string, required: true, description: Immutable landing lineage.}
    partitioning:
      - {field_id: 1000, field: trade_date, transform: identity}

  - key: trade_ticks
    name: trade_ticks
    description: Captured SSI trades retaining at-least-once receive identity and timing semantics.
    primary_key: [stream_session_id, receive_sequence]
    columns:
      - {field_id: 1, name: stream_session_id, data_type: string, required: true, description: Capture-owned SDK session identifier.}
      - {field_id: 2, name: receive_sequence, data_type: long, required: true, description: Local callback order; not a provider trade identifier.}
      - {field_id: 3, name: symbol, data_type: string, required: true, description: SSI security symbol.}
      - {field_id: 4, name: trade_date, data_type: date, required: true, description: Exchange-local trading date.}
      - {field_id: 5, name: event_time, data_type: timestamptz, required: true, description: Provider trade time normalized to UTC.}
      - {field_id: 6, name: received_at, data_type: timestamptz, required: true, description: UTC SDK callback receipt time.}
      - {field_id: 7, name: available_at, data_type: timestamptz, required: true, description: Earliest UTC consumer availability time.}
      - {field_id: 8, name: processed_at, data_type: timestamptz, required: true, description: UTC normalization completion time.}
      - {field_id: 9, name: price, data_type: decimal, precision: 18, scale: 0, required: true, description: Matched price in VND.}
      - {field_id: 10, name: quantity, data_type: long, required: true, description: Matched share quantity.}
      - {field_id: 11, name: aggressor_side, data_type: string, required: false, description: Normalized SSI aggressor side.}
      - {field_id: 12, name: cumulative_volume, data_type: long, required: false, description: Provider cumulative matched quantity.}
      - {field_id: 13, name: cumulative_value, data_type: decimal, precision: 24, scale: 0, required: false, description: Provider cumulative turnover in VND.}
      - {field_id: 14, name: message_sha256, data_type: string, required: true, description: Immutable lineage and duplicate fingerprint.}
    partitioning:
      - {field_id: 1000, field: trade_date, transform: identity}

  - key: quote_snapshots
    name: quote_snapshots
    description: One captured quote update or full book version with certified completeness semantics.
    primary_key: [stream_session_id, receive_sequence]
    columns:
      - {field_id: 1, name: stream_session_id, data_type: string, required: true, description: Capture-owned SDK session identifier.}
      - {field_id: 2, name: receive_sequence, data_type: long, required: true, description: Local callback order.}
      - {field_id: 3, name: symbol, data_type: string, required: true, description: SSI security symbol.}
      - {field_id: 4, name: trade_date, data_type: date, required: true, description: Exchange-local trading date.}
      - {field_id: 5, name: event_time, data_type: timestamptz, required: false, description: Provider quote time normalized to UTC when supplied.}
      - {field_id: 6, name: received_at, data_type: timestamptz, required: true, description: UTC SDK callback receipt time.}
      - {field_id: 7, name: available_at, data_type: timestamptz, required: true, description: Earliest UTC consumer availability time.}
      - {field_id: 8, name: processed_at, data_type: timestamptz, required: true, description: UTC normalization completion time.}
      - {field_id: 9, name: update_kind, data_type: string, required: true, description: Certified full-snapshot or delta classification.}
      - {field_id: 10, name: is_complete, data_type: boolean, required: true, description: Whether this version is safe for order-book features.}
      - {field_id: 11, name: message_sha256, data_type: string, required: true, description: Immutable lineage and duplicate fingerprint.}
    partitioning:
      - {field_id: 1000, field: trade_date, transform: identity}

  - key: quote_levels
    name: quote_levels
    description: Normalized bid and ask levels belonging to one quote snapshot.
    primary_key: [stream_session_id, receive_sequence, side, level]
    columns:
      - {field_id: 1, name: stream_session_id, data_type: string, required: true, description: Parent quote session identifier.}
      - {field_id: 2, name: receive_sequence, data_type: long, required: true, description: Parent quote receive sequence.}
      - {field_id: 3, name: side, data_type: string, required: true, description: BID or ASK.}
      - {field_id: 4, name: level, data_type: long, required: true, description: One-based level ordered best to worst.}
      - {field_id: 5, name: symbol, data_type: string, required: true, description: SSI security symbol.}
      - {field_id: 6, name: trade_date, data_type: date, required: true, description: Exchange-local trading date.}
      - {field_id: 7, name: price, data_type: decimal, precision: 18, scale: 0, required: true, description: Quoted price in VND.}
      - {field_id: 8, name: quantity, data_type: long, required: true, description: Quoted share quantity.}
      - {field_id: 9, name: order_count, data_type: long, required: false, description: Order count when supplied.}
      - {field_id: 10, name: available_at, data_type: timestamptz, required: true, description: Snapshot consumer availability time.}
    partitioning:
      - {field_id: 1000, field: trade_date, transform: identity}

  - key: index_snapshots
    name: index_snapshots
    description: Historical or live index values, breadth, and liquidity with point-in-time lineage.
    primary_key: [index_snapshot_id]
    columns:
      - {field_id: 1, name: index_snapshot_id, data_type: string, required: true, description: Deterministic identifier from immutable lineage.}
      - {field_id: 2, name: index_code, data_type: string, required: true, description: Normalized VN30 or VNINDEX identifier.}
      - {field_id: 3, name: trade_date, data_type: date, required: true, description: Exchange-local trading date.}
      - {field_id: 4, name: event_time, data_type: timestamptz, required: false, description: Provider event time normalized to UTC; absent for date-grained REST summaries.}
      - {field_id: 5, name: source_kind, data_type: string, required: true, description: Historical REST or certified stream origin.}
      - {field_id: 6, name: index_value, data_type: decimal, precision: 18, scale: 6, required: true, description: Index level.}
      - {field_id: 7, name: point_change, data_type: decimal, precision: 18, scale: 6, required: false, description: Change from the reference level.}
      - {field_id: 8, name: percent_change, data_type: decimal, precision: 18, scale: 8, required: false, description: Provider percentage change.}
      - {field_id: 9, name: advancing_count, data_type: long, required: false, description: Advancing constituent count.}
      - {field_id: 10, name: declining_count, data_type: long, required: false, description: Declining constituent count.}
      - {field_id: 11, name: unchanged_count, data_type: long, required: false, description: Unchanged constituent count.}
      - {field_id: 12, name: ceiling_count, data_type: long, required: false, description: Ceiling-price constituent count.}
      - {field_id: 13, name: floor_count, data_type: long, required: false, description: Floor-price constituent count.}
      - {field_id: 14, name: matched_volume, data_type: long, required: false, description: Aggregate matched quantity.}
      - {field_id: 15, name: matched_value, data_type: decimal, precision: 24, scale: 0, required: false, description: Aggregate matched turnover in VND.}
      - {field_id: 16, name: available_at, data_type: timestamptz, required: true, description: Earliest UTC consumer availability time.}
      - {field_id: 17, name: processed_at, data_type: timestamptz, required: true, description: UTC normalization completion time.}
      - {field_id: 18, name: source_record_sha256, data_type: string, required: true, description: Immutable landing lineage.}
    partitioning:
      - {field_id: 1000, field: trade_date, transform: identity}

  - key: market_status_events
    name: market_status_events
    description: Exchange or symbol session-state transitions used by fail-closed trading gates.
    primary_key: [market_status_event_id]
    columns:
      - {field_id: 1, name: market_status_event_id, data_type: string, required: true, description: Deterministic identifier from source lineage.}
      - {field_id: 2, name: exchange, data_type: string, required: true, description: Normalized exchange code.}
      - {field_id: 3, name: symbol, data_type: string, required: false, description: Affected symbol for symbol-scoped transitions.}
      - {field_id: 4, name: trade_date, data_type: date, required: true, description: Exchange-local trading date.}
      - {field_id: 5, name: event_time, data_type: timestamptz, required: true, description: Effective transition time in UTC.}
      - {field_id: 6, name: status, data_type: string, required: true, description: Normalized session or halt status.}
      - {field_id: 7, name: source_kind, data_type: string, required: true, description: Certified status source or versioned calendar origin.}
      - {field_id: 8, name: received_at, data_type: timestamptz, required: true, description: UTC source receipt time.}
      - {field_id: 9, name: available_at, data_type: timestamptz, required: true, description: Earliest UTC consumer availability time.}
      - {field_id: 10, name: processed_at, data_type: timestamptz, required: true, description: UTC normalization completion time.}
      - {field_id: 11, name: source_record_sha256, data_type: string, required: true, description: Immutable source lineage or calendar fingerprint.}
    partitioning:
      - {field_id: 1000, field: trade_date, transform: identity}

  - key: corporate_actions
    name: corporate_actions
    description: Structured effective-dated actions required for adjusted returns and leakage-safe replay.
    primary_key: [corporate_action_id]
    columns:
      - {field_id: 1, name: corporate_action_id, data_type: string, required: true, description: Stable source identifier or deterministic lineage hash.}
      - {field_id: 2, name: symbol, data_type: string, required: true, description: Affected security symbol.}
      - {field_id: 3, name: action_type, data_type: string, required: true, description: "Normalized dividend, right, split, bonus, or symbol-change type."}
      - {field_id: 4, name: announced_at, data_type: timestamptz, required: true, description: Earliest official announcement time in UTC.}
      - {field_id: 5, name: ex_date, data_type: date, required: true, description: Exchange-local ex-right date.}
      - {field_id: 6, name: record_date, data_type: date, required: false, description: Official record date when applicable.}
      - {field_id: 7, name: payment_date, data_type: date, required: false, description: Payment or distribution date when applicable.}
      - {field_id: 8, name: cash_amount_per_share, data_type: decimal, precision: 18, scale: 0, required: false, description: Cash amount per share in VND.}
      - {field_id: 9, name: numerator, data_type: long, required: false, description: Exact action-ratio numerator.}
      - {field_id: 10, name: denominator, data_type: long, required: false, description: Exact action-ratio denominator.}
      - {field_id: 11, name: source_kind, data_type: string, required: true, description: Official structured action source.}
      - {field_id: 12, name: available_at, data_type: timestamptz, required: true, description: Earliest UTC consumer availability time.}
      - {field_id: 13, name: processed_at, data_type: timestamptz, required: true, description: UTC normalization completion time.}
      - {field_id: 14, name: source_record_sha256, data_type: string, required: true, description: Immutable source lineage.}
    partitioning:
      - {field_id: 1000, field: ex_date, transform: year, name: ex_year}
