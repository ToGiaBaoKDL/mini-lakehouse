version: 1
name: ssi_fastconnect_stream
database: landing_ssi_fastconnect_stream
source_type: stream
owner: market-data
contact:
  name: Market Data
  email: baokdl2226@gmail.com
description: Immutable messages captured through official SSI FastConnect Stream SDK callbacks.

tables:
  - key: messages
    name: messages
    description: Source-shaped SDK callback messages in local receive order with durable batch lineage.
    primary_key: [stream_session_id, receive_sequence]
    columns:
      - {field_id: 1, name: stream_session_id, data_type: string, required: true, description: Capture-owned identifier for one SDK connection session.}
      - {field_id: 2, name: receive_sequence, data_type: long, required: true, description: Monotonic local callback order within the session; never a provider event ID.}
      - {field_id: 3, name: message_type, data_type: string, required: true, description: Exported SSI SDK message model type.}
      - {field_id: 4, name: subscription_context, data_type: string, required: false, description: SDK subscription method context owned by the capture process.}
      - {field_id: 5, name: provider_topic, data_type: string, required: false, description: Provider topic only when exposed by the SDK callback.}
      - {field_id: 6, name: symbol, data_type: string, required: false, description: Provider symbol when exposed by the SDK message.}
      - {field_id: 7, name: source_time_text, data_type: string, required: false, description: Provider timestamp text preserved without reinterpretation.}
      - {field_id: 8, name: received_at, data_type: timestamptz, required: true, description: UTC time the application callback received the SDK message.}
      - {field_id: 9, name: message_json, data_type: string, required: true, description: Canonical serialization of every field exposed by the SDK message.}
      - {field_id: 10, name: message_sha256, data_type: string, required: true, description: SHA-256 of message_json.}
      - {field_id: 11, name: api_version, data_type: string, required: true, description: SSI API version reported by the capture runtime.}
      - {field_id: 12, name: sdk_version, data_type: string, required: true, description: Pinned SSI SDK package version.}
      - {field_id: 13, name: batch_id, data_type: string, required: true, description: Immutable capture batch containing this message.}
      - {field_id: 14, name: object_key, data_type: string, required: true, description: Immutable S3 capture object containing this message.}
      - {field_id: 15, name: object_sha256, data_type: string, required: true, description: SHA-256 of the immutable capture object.}
      - {field_id: 16, name: published_at, data_type: timestamptz, required: true, description: UTC time the object publication became durable.}
    partitioning:
      - {field_id: 1000, field: received_at, transform: day, name: receive_day}

  - key: sessions
    name: sessions
    description: One immutable terminal summary for each SDK connection session.
    primary_key: [stream_session_id]
    columns:
      - {field_id: 1, name: stream_session_id, data_type: string, required: true, description: Capture-owned SDK connection session identifier.}
      - {field_id: 2, name: connected_at, data_type: timestamptz, required: true, description: UTC time the SDK connection became available.}
      - {field_id: 3, name: disconnected_at, data_type: timestamptz, required: true, description: UTC time the SDK connection ended.}
      - {field_id: 4, name: disconnect_kind, data_type: string, required: true, description: Sanitized expected or unexpected disconnect classification.}
      - {field_id: 5, name: sdk_version, data_type: string, required: true, description: Pinned SSI SDK package version.}
      - {field_id: 6, name: message_count, data_type: long, required: true, description: Total business callback messages durably captured in the session.}
      - {field_id: 7, name: first_receive_sequence, data_type: long, required: false, description: First captured local sequence when the session emitted a message.}
      - {field_id: 8, name: last_receive_sequence, data_type: long, required: false, description: Last captured local sequence when the session emitted a message.}
      - {field_id: 9, name: manifest_key, data_type: string, required: true, description: Immutable manifest for all published session batches.}
      - {field_id: 10, name: manifest_sha256, data_type: string, required: true, description: SHA-256 of the immutable session manifest.}
      - {field_id: 11, name: published_at, data_type: timestamptz, required: true, description: UTC time the terminal session summary became durable.}
    partitioning:
      - {field_id: 1000, field: connected_at, transform: day, name: connection_day}
