[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[project]
name = "lakehouse-ingest"
version = "0.1.0"
description = "Bounded external-source capture tasks for the lakehouse."
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.42,<2",
    "lakehouse",
    "loguru==0.7.3",
    "requests>=2.32,<3",
    "typer==0.25.1",
    "urllib3>=2.6,<3",
]

[project.scripts]
lakehouse-ingest = "lakehouse_ingest.cli:app"

[tool.uv.sources]
lakehouse = { workspace = true }

[tool.uv.build-backend]
module-name = "lakehouse_ingest"
