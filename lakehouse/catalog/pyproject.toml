[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[project]
name = "lakehouse"
version = "0.3.0"
description = "Contract and catalog control plane for the AWS lakehouse."
requires-python = ">=3.11,<3.13"
dependencies = [
    "boto3>=1.42,<2",
    "loguru==0.7.3",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.12,<3",
    "pyyaml>=6.0.3,<7",
]

[project.optional-dependencies]
cli = ["typer==0.25.1"]
catalog = [
    "botocore[crt]>=1.42,<2",
    "pyiceberg[glue,pyarrow]>=0.10,<0.12",
]
