apiVersion: v1alpha1
kind: Installation
metadata:
  name: signoz
spec:
  deployment:
    flavor: compose
    mode: docker
  signoz:
    spec:
      image: signoz/signoz:v0.137.1@sha256:f23caccc88dad6f7e31f429681b5cc2f5fcdef5f6dd200924f705063b288bada
  ingester:
    spec:
      image: signoz/signoz-otel-collector:v0.144.8@sha256:6d1a59bc553e041014597eff0970608948c5c7447aaa984c4d109f2bc9f4062c
  metastore:
    kind: postgres
    spec:
      image: postgres:16.10@sha256:21f6013073bc6b92830a2129570e2f5ec42a6c734b5a985a41e83aa58f54c3c1
  telemetrystore:
    spec:
      image: clickhouse/clickhouse-server:25.12.5@sha256:cacf32d6884291dc2ff5e0156a97f46fc53ff7c929a7906d114e268a929dfd3a
  telemetrykeeper:
    kind: clickhousekeeper
    spec:
      image: clickhouse/clickhouse-keeper:25.12.5@sha256:525b8b0f93ccb371131c46f22a066ea43d33d74aba314203e8044609945d8524
  patches:
    - target: "deployment/compose.yaml"
      operations:
        - op: test
          path: /services/signoz-signoz-0/ports/0
          value: "8080:8080"
        - op: replace
          path: /services/signoz-signoz-0/ports/0
          value: "8082:8080"
        - op: test
          path: /services/ingester/ports/0
          value: "4317:4317"
        - op: replace
          path: /services/ingester/ports/0
          value: "127.0.0.1:4317:4317"
        - op: test
          path: /services/ingester/ports/1
          value: "4318:4318"
        - op: replace
          path: /services/ingester/ports/1
          value: "127.0.0.1:4318:4318"
        - op: add
          path: /services/signoz-signoz-0/deploy
          value:
            resources:
              limits:
                cpus: "0.5"
                memory: 1G
        - op: add
          path: /services/ingester/deploy/resources
          value:
            limits:
              cpus: "0.25"
              memory: 512M
        - op: add
          path: /services/signoz-telemetrystore-clickhouse-0-0/deploy
          value:
            resources:
              limits:
                cpus: "2.0"
                memory: 4G
        - op: add
          path: /services/signoz-telemetrykeeper-clickhousekeeper-0/deploy
          value:
            resources:
              limits:
                cpus: "0.25"
                memory: 512M
        - op: add
          path: /services/signoz-metastore-postgres-0/deploy
          value:
            resources:
              limits:
                cpus: "0.5"
                memory: 512M
