services:
  collection-agent:
    image: "${COLLECTOR_IMAGE:?COLLECTOR_IMAGE is required}"
    container_name: signoz-collection-agent
    # Root is required to read docker JSON log files (0600) and the Docker
    # socket; every host mount stays read-only.
    user: "0:0"
    command:
      - --config=/etc/otel-collector/config.yaml
    environment:
      OTEL_RESOURCE_ATTRIBUTES: "${OTEL_RESOURCE_ATTRIBUTES:-deployment.environment=dev}"
      POSTGRES_MONITOR_ENDPOINT: "${POSTGRES_MONITOR_ENDPOINT:-metadata-postgres:5432}"
      PG_MONITOR_USER: "${PG_MONITOR_USER:-lakehouse_monitor}"
      PG_MONITOR_PASSWORD: "${PG_MONITOR_PASSWORD:?PG_MONITOR_PASSWORD is required}"
    volumes:
      - ./config.yaml:/etc/otel-collector/config.yaml:ro
      - /:/hostfs:ro
      - /var/log/lakehouse:/var/log/lakehouse:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - collection-agent-file-storage:/var/lib/otelcol/storage
    # The contrib image is distroless: the healthcheck runs the binary
    # itself, which re-validates the live configuration. The health_check
    # extension answers in-container probes on :13133 for the SigNoz stack.
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otel-collector/config.yaml"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - signoz
      - metadata
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 512M

volumes:
  collection-agent-file-storage:

networks:
  signoz:
    external: true
    name: signoz-network
  metadata:
    external: true
    name: lakehouse-metadata
