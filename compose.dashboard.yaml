# Optional presentation plane. Always combine with compose.core.yaml.

services:
  dashboard:
    image: mini-lakehouse-dashboard:local
    build:
      context: .
      target: dashboard
    depends_on:
      trino:
        condition: service_healthy
    env_file:
      - ./infra/config/lakehouse.container.env
    environment:
      LAKEHOUSE_STORAGE__ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      LAKEHOUSE_STORAGE__SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      LAKEHOUSE_POLARIS__REALM: ${POLARIS_REALM:-POLARIS}
      LAKEHOUSE_POLARIS__CREDENTIAL: ${POLARIS_ROOT_CLIENT_ID:-root}:${POLARIS_ROOT_CLIENT_SECRET:-secretpassword}
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    command: >-
      streamlit run src/mini_lakehouse/presentation/app.py
      --server.address=0.0.0.0 --server.port=8501
    ports:
      - "127.0.0.1:8501:8501"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request as u; u.urlopen('http://localhost:8501/_stcore/health', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
