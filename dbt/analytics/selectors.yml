selectors:
  - name: github_curated_freshness
    description: Canonical curated GitHub sources with a configured freshness SLA.
    definition:
      method: source
      value: github

  - name: engineering_pipeline
    description: Engineering marts and every logical upstream dependency required to build them.
    definition:
      method: fqn
      value: mini_lakehouse_analytics.marts.engineering
      parents: true

  - name: ci_modified
    description: State-modified nodes and their downstream dependants for state-aware CI.
    definition:
      method: state
      value: modified
      children: true
