name: "mini_lakehouse_analytics"
version: "0.3.0"
config-version: 2
profile: "mini_lakehouse"

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

flags:
  send_anonymous_usage_stats: false
  require_certificate_validation: true

vars:
  # dbt cannot import the platform contract at parse time. A cross-layer test
  # requires this engine projection to match the analytics metadata policy.
  iceberg_metadata_retention:
    delete_after_commit: true
    previous_versions_max: 30

models:
  mini_lakehouse_analytics:
    +persist_docs:
      relation: true
      columns: true

    staging:
      +materialized: ephemeral
      +tags: ["staging", "github"]

    intermediate:
      +materialized: ephemeral
      +tags: ["intermediate", "engineering"]

    marts:
      # A single CREATE OR REPLACE TABLE AS SELECT keeps refreshes atomic without
      # renaming an intermediate relation whose physical path contains __dbt_tmp.
      +materialized: table
      +on_table_exists: replace
      engineering:
        +schema: analytics.engineering
        +tags: ["mart", "engineering"]
