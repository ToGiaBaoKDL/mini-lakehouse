version: 2

sources:
  - name: github
    description: Canonical, source-conformed GitHub product owned by Data Platform.
    database: "{{ env_var('LAKEHOUSE_TRINO__CATALOG', 'prod') }}"
    schema: curated.github
    config:
      group: data_platform
    meta:
      owner: data-platform
      product: github
      physical_bucket: curated
    tables:
      - name: events
        description: Deduplicated and normalized GitHub events at one row per stable event ID.
        config:
          loaded_at_field: source_hour
          freshness:
            warn_after: {count: 2, period: hour}
            error_after: {count: 6, period: hour}
        columns:
          - name: event_id
            data_tests: [not_null, unique]
          - name: event_type
            data_tests: [not_null]
          - name: event_date_utc
            data_tests: [not_null]
          - name: source_hour
            data_tests: [not_null]
          - name: curated_at
            data_tests: [not_null]

      - name: actors_current
        description: Latest observed GitHub actor attributes at one row per actor ID.
        columns:
          - name: actor_id
            data_tests: [not_null, unique]

      - name: repositories_current
        description: Latest observed GitHub repository attributes at one row per repository ID.
        columns:
          - name: repository_id
            data_tests: [not_null, unique]
