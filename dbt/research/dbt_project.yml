name: "research_analytics"
version: "1.0.0"
config-version: 2
profile: "research_analytics"
require-dbt-version: [">=1.12.0", "<1.13.0"]

model-paths: ["models"]
clean-targets: ["target", "dbt_packages"]

flags:
  send_anonymous_usage_stats: false
  require_certificate_validation: true

models:
  research_analytics:
    +persist_docs:
      relation: true
      columns: true
    staging:
      +materialized: ephemeral
      +tags: [staging, arxiv, research]
      +meta:
        owner: data-platform
        contact: baokdl2226@gmail.com
    intermediate:
      +materialized: ephemeral
      +tags: [intermediate, research]
      +meta:
        owner: research-analytics
        contact: baokdl2226@gmail.com
    marts:
      +materialized: table
      +table_type: iceberg
      +tags: [mart, research]
      +meta:
        owner: research-analytics
        contact: baokdl2226@gmail.com
        business_owner: research
