version: 2

models:
  - name: fct_repository_activity_daily
    description: Daily engineering activity at the stable activity_date + repository_id grain.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [activity_date, repository_id]
    columns:
      - name: activity_date
        description: UTC date on which the repository activity occurred.
        data_type: date
        data_tests: [not_null]
      - name: repository_id
        description: Stable GitHub repository identifier.
        data_type: bigint
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: source('github', 'repositories_current')
                field: repository_id
      - name: event_count
        description: Total GitHub events observed for the repository on the activity date.
        data_type: bigint
      - name: push_event_count
        description: Push events observed for the repository on the activity date.
        data_type: bigint
      - name: pushed_commit_count
        description: Commits reported by push events for the repository on the activity date.
        data_type: bigint
      - name: pull_request_event_count
        description: Pull-request events observed for the repository on the activity date.
        data_type: bigint
      - name: unique_pull_request_count
        description: Distinct pull-request numbers observed for the repository on the activity date.
        data_type: bigint
      - name: issue_event_count
        description: Issue events observed for the repository on the activity date.
        data_type: bigint
      - name: issue_comment_event_count
        description: Issue-comment events observed for the repository on the activity date.
        data_type: bigint
      - name: active_actor_count
        description: Distinct identified actors active in the repository on the activity date.
        data_type: bigint
      - name: repository_name
        description: Latest known full repository name at model build time.
        data_type: varchar
      - name: repository_owner
        description: Latest known repository owner at model build time.
        data_type: varchar

  - name: fct_contributor_activity_daily
    description: Daily engineering activity at the stable activity_date + actor_id grain.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [activity_date, actor_id]
    columns:
      - name: activity_date
        description: UTC date on which the contributor activity occurred.
        data_type: date
        data_tests: [not_null]
      - name: actor_id
        description: Stable GitHub actor identifier.
        data_type: bigint
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: source('github', 'actors_current')
                field: actor_id
      - name: event_count
        description: Total GitHub events generated by the actor on the activity date.
        data_type: bigint
      - name: active_repository_count
        description: Distinct repositories in which the actor was active on the activity date.
        data_type: bigint
      - name: push_event_count
        description: Push events generated by the actor on the activity date.
        data_type: bigint
      - name: pushed_commit_count
        description: Commits reported by the actor's push events on the activity date.
        data_type: bigint
      - name: pull_request_event_count
        description: Pull-request events generated by the actor on the activity date.
        data_type: bigint
      - name: issue_event_count
        description: Issue events generated by the actor on the activity date.
        data_type: bigint
      - name: issue_comment_event_count
        description: Issue-comment events generated by the actor on the activity date.
        data_type: bigint
      - name: actor_login
        description: Latest known actor login at model build time.
        data_type: varchar
      - name: is_bot
        description: Latest heuristic bot classification at model build time.
        data_type: boolean
