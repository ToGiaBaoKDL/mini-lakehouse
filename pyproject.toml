[project]
name = "mini-lakehouse"
version = "0.1.0"
description = "A mini data lakehouse project using GitHub Archive, Prefect, Apache Iceberg, dbt-duckdb, and Streamlit."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "prefect>=2.19.0",
    "pyiceberg[pyarrow,s3fs]>=0.11.0",
    "pyarrow>=14.0.0",
    "duckdb>=1.0.0",
    "dbt-core>=1.8.0",
    "dbt-trino>=1.8.0",
    "streamlit>=1.35.0",
    "requests>=2.31.0",
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "pyright>=1.1.0",
    "plotly>=5.18.0",
    "trino>=0.328.0",
    "pydantic-settings>=2.0.0",
]

[tool.uv]
package = false

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"

[tool.ruff]
lint.ignore = ["E402"]


