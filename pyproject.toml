[tool.uv.workspace]
members = ["apps/arxiv_inspector", "ocr", "platform"]
exclude = ["analytics/dbt-project/runtime", "jobs/emr", "ocr/glm_ocr", "orchestration"]

[dependency-groups]
dev = [
    "pyright>=1.1.408,<2",
    "pytest>=9,<10",
    "ruff>=0.14,<0.16",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = [".", "platform/src", "ocr/src", "jobs/emr/src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["platform/src", "ocr/src", "apps", "tests"]
exclude = ["analytics/dbt-project", ".venv"]
extraPaths = [".", "platform/src", "ocr/src", "jobs/emr/src"]
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false
reportUnknownArgumentType = false
reportUnknownMemberType = false
reportUnknownParameterType = false
reportUnknownVariableType = false
