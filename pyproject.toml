[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[project]
name = "lakehouse-platform"
version = "0.3.0"
description = "A production-shaped AWS lakehouse built with S3, Glue, Iceberg, Athena, EMR Serverless, dbt, and Airflow."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "boto3>=1.42,<2",
    "loguru==0.7.3",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.12,<3",
    "pyyaml>=6.0.3,<7",
    "typer==0.27.0",
]

[project.optional-dependencies]
orchestration = [
    "apache-airflow==3.3.0",
    "apache-airflow-providers-amazon[aiobotocore]==9.32.0",
    "apache-airflow-providers-slack==9.10.2",
    "apache-airflow-providers-smtp==3.0.2",
]
analytics = [
    "dbt-athena==1.11.0",
]
catalog = [
    "pyarrow>=23,<26",
    "pyiceberg[glue,pyarrow,s3fs]>=0.10,<0.12",
]
ocr = [
    "document-ocr[providers]",
]
document-inspector = [
    "awswrangler==3.17.0",
    "document-ocr",
    "streamlit>=1.60,<1.61",
]

[tool.uv.sources]
document-ocr = { workspace = true }

[tool.uv.workspace]
members = ["ocr"]
exclude = ["jobs/emr", "ocr/runners/glm_ocr"]

[dependency-groups]
dev = [
    "pyright>=1.1.408,<2",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.14,<0.16",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = [".", "src", "ocr/src", "jobs/emr/src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "ocr/src", "orchestration", "apps", "tests"]
exclude = ["dbt", ".venv"]
extraPaths = [".", "src", "ocr/src", "jobs/emr/src"]
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false
reportUnknownArgumentType = false
reportUnknownMemberType = false
reportUnknownParameterType = false
reportUnknownVariableType = false
