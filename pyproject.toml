[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[project]
name = "mini-lakehouse"
version = "0.3.0"
description = "A small production-shaped lakehouse built with Polaris, Iceberg, Trino, dbt, and Prefect."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fsspec>=2025.12",
    "pyarrow>=23,<26",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.12,<3",
    "pyiceberg[pyarrow,s3fs]>=0.10,<0.12",
    "pyyaml>=6.0.3,<7",
    "requests>=2.32,<3",
    "trino>=0.336,<1",
    "urllib3>=2.5,<3",
    "zstandard>=0.23,<1",
]

[project.optional-dependencies]
orchestration = [
    "dbt-core>=1.10,<1.12",
    "dbt-trino>=1.10,<1.11",
    "prefect>=3.7,<4",
    "prefect-dbt>=0.7,<0.8",
    "huggingface-hub>=1.7,<2",
    "kaggle>=2,<3",
    "kagglehub>=1,<2",
]
ocr-review = [
    "streamlit>=1.60,<1.61",
]

[dependency-groups]
dev = [
    "pyright>=1.1.408,<2",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.14,<0.16",
    "types-requests>=2.32,<3",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
    "integration: requires the local Compose stack",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["src", "orchestration", "apps", "tests"]
exclude = ["dbt", ".venv"]
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false
reportUnknownArgumentType = false
reportUnknownMemberType = false
reportUnknownParameterType = false
reportUnknownVariableType = false
