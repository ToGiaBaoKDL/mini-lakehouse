[tool.uv.workspace]
members = ["arxiv-lens", "lakehouse/catalog", "lakehouse/ingest", "ocr-engine", "t0-trading"]
exclude = ["analytics/dbt-project/runtime", "automation/airflow", "lakehouse/emr", "ocr-engine/modal"]

[dependency-groups]
dev = [
    "jsonschema>=4.26,<5",
    "pyright>=1.1.408,<2",
    "pyyaml>=6.0.3,<7",
    "pytest>=9,<10",
    "ruff>=0.14,<0.16",
]

[tool.pytest.ini_options]
markers = ["integration: requires an explicitly supplied isolated external service"]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = [
    "arxiv-lens/src",
    "lakehouse/catalog/src",
    "lakehouse/emr/src",
    "ocr-engine/src",
    "t0-trading/src",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = [
    "arxiv-lens/src",
    "lakehouse/catalog/src",
    "lakehouse/ingest/src",
    "ocr-engine/src",
    "t0-trading/src",
    "templates/enterprise-data-platform/validate.py",
    "templates/enterprise-data-platform/measure.py",
    "tests",
]
exclude = ["analytics/dbt-project", ".venv"]
extraPaths = [
    "arxiv-lens/src",
    "lakehouse/catalog/src",
    "lakehouse/emr/src",
    "lakehouse/ingest/src",
    "ocr-engine/src",
    "t0-trading/src",
]
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false
reportUnknownArgumentType = false
reportUnknownMemberType = false
reportUnknownParameterType = false
reportUnknownVariableType = false
