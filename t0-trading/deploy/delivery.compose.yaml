# Opt-in overlay. Base capture remains deployable without PostgreSQL or Telegram credentials.
services:
  stream-capture:
    environment:
      T0_REALTIME_SHADOW: "true"
      T0_DELIVERY_DSN_FILE: /run/secrets/t0-delivery-dsn
    volumes:
      - ${T0_DELIVERY_DSN_HOST_FILE:?Provide a protected PostgreSQL DSN file}:/run/secrets/t0-delivery-dsn:ro
    networks:
      - default
      - metadata

  shadow-notifier:
    profiles: [notifications]
    image: "${T0_TRADING_IMAGE:-t0-trading:local}"
    user: "${LOCAL_UID}:0"
    init: true
    command: [notify-shadow]
    environment:
      T0_DELIVERY_DSN_FILE: /run/secrets/t0-delivery-dsn
      T0_TELEGRAM_SECRET_FILE: /run/secrets/t0-telegram
      T0_NOTIFICATIONS_ENABLED: ${T0_NOTIFICATIONS_ENABLED:-false}
      PTB_TIMEDELTA: "true"
    volumes:
      - ${T0_DELIVERY_DSN_HOST_FILE:?Provide a protected PostgreSQL DSN file}:/run/secrets/t0-delivery-dsn:ro
      - ${T0_TELEGRAM_HOST_FILE:?Provide a protected Telegram credentials file}:/run/secrets/t0-telegram:ro
    networks:
      - default
      - metadata
    cpus: 0.25
    mem_limit: 256m
    stop_grace_period: 15s
    restart: "on-failure:3"

networks:
  metadata:
    external: true
    name: lakehouse-metadata
