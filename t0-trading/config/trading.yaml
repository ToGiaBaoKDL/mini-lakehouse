schema_version: 1
outcomes:
  - version: top3-taker-markout-v1
    effective_from: 2026-08-27
    effective_to: null
    horizons_seconds: [30, 60, 300]
    order_quantity: 100
    # Explicit research assumption, not measured SSI order-routing latency.
    execution_latency_milliseconds: 500
versions:
  - version: market-state-v1
    effective_from: 2026-08-27
    effective_to: null
    market:
      timezone: Asia/Ho_Chi_Minh
      symbols: [VIC, VHM]
      indices: [VNINDEX, VN30]
      quote_depth: 3
      bar_interval_seconds: 60
      sessions:
        opening_auction: ["09:00:00", "09:15:00"]
        continuous_am: ["09:15:00", "11:30:00"]
        continuous_pm: ["13:00:00", "14:30:00"]
        closing_auction: ["14:30:00", "14:45:00"]
    data_quality:
      trade_stale_after_seconds: 90
      quote_stale_after_seconds: 30
    features:
      version: microstructure-v1
      cadence_seconds: 5
      windows_seconds: [30, 60, 300]
      warmup_seconds: 300
      decision_sessions: [continuous_am, continuous_pm]
