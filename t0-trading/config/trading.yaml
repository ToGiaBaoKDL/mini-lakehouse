schema_version: 1
capture:
  symbols: [VIC, VHM]
  indices: [VNINDEX, VN30, VNREAL]
  markets: [HOSE]
outcomes:
  - version: top3-taker-markout-v1
    effective_from: 2026-08-27
    effective_to: null
    horizons_seconds: [30, 60, 300]
    order_quantity: 100
    # Explicit research assumption, not measured SSI order-routing latency.
    execution_latency_milliseconds: 500
strategies:
  - version: microstructure-scores-v1
    effective_from: 2026-08-27
    effective_to: null
    momentum_window_seconds: 60
    order_flow_window_seconds: 30
    relative_value_window_seconds: 300
    relative_value_symbols: [VIC, VHM]
strategy_evaluations:
  - version: exploratory-purged-holdout-v1
    tier: EXPLORATORY
    effective_from: 2026-08-27
    effective_to: null
    score_bucket_count: 5
    minimum_training_sessions: 10
    validation_sessions: 5
    purge_sessions: 1
  - version: purged-walk-forward-v1
    tier: PROMOTION
    effective_from: 2026-08-27
    effective_to: null
    score_bucket_count: 5
    minimum_training_sessions: 20
    validation_sessions: 5
    purge_sessions: 1
baseline_evaluations:
  - version: exploratory-baseline-holdout-v1
    tier: EXPLORATORY
    effective_from: 2026-08-27
    effective_to: null
    development_sessions: 10
    purge_sessions: 1
    holdout_sessions: 5
  - version: promotion-baseline-holdout-v1
    tier: PROMOTION
    effective_from: 2026-08-27
    effective_to: null
    development_sessions: 20
    purge_sessions: 1
    holdout_sessions: 5
contexts:
  - version: decision-context-v3
    effective_from: 2026-08-27
    effective_to: null
    zone_lookback_seconds: 900
    zone_minimum_observations: 12
    zone_tolerance_bps: "20"
    market_windows_seconds: [60, 300]
    index_stale_after_seconds: 30
    # Historical bars are exposed only after one complete interval; the small grace
    # prevents scheduler jitter from classifying the latest closed bar as stale.
    historical_proxy_interval_seconds: 60
    historical_proxy_stale_after_seconds: 65
    tradable_market_statuses: [LO, OPEN, CONTINUOUS]
    trend_threshold_bps: "10"
    high_volatility_threshold_bps: "20"
decisions:
  - version: microstructure-decisions-v1
    effective_from: 2026-08-27
    effective_to: null
    strategy_version: microstructure-scores-v1
    outcome_version: top3-taker-markout-v1
    # Provisional in-sample q80 thresholds. Shadow-only until purged walk-forward validates them.
    rules:
      - strategy: momentum
        horizon_seconds: 60
        buy_minimum_strength: "0.68"
        sell_minimum_strength: "0.69"
      - strategy: order_flow
        horizon_seconds: 300
        buy_minimum_strength: "0.41"
        sell_minimum_strength: "0.43"
      - strategy: relative_value
        horizon_seconds: 300
        buy_minimum_strength: "0.37"
        sell_minimum_strength: "0.37"
    maximum_spread_bps: "25"
    maximum_trade_age_seconds: "30"
    maximum_quote_age_seconds: "5"
    cooldown_seconds: 60
versions:
  - version: market-state-v1
    effective_from: 2026-08-27
    effective_to: null
    market:
      timezone: Asia/Ho_Chi_Minh
      symbols: [VIC, VHM]
      indices: [VNINDEX, VN30]
      status_markets: [HOSE]
      quote_depth: 3
      bar_interval_seconds: 60
      sessions:
        opening_auction: ["09:00:00", "09:15:00"]
        continuous_am: ["09:15:00", "11:30:00"]
        continuous_pm: ["13:00:00", "14:30:00"]
        closing_auction: ["14:30:00", "14:45:00"]
    data_quality:
      trade_stale_after_seconds: 90
      quote_stale_after_seconds: 30
    features:
      version: microstructure-v1
      cadence_seconds: 5
      windows_seconds: [30, 60, 300]
      warmup_seconds: 300
      decision_sessions: [continuous_am, continuous_pm]
