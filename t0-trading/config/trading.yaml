schema_version: 2
capture:
  symbols: [VIC, VHM]
  indices: [VNINDEX, VN30, VNREAL]
  membership_indices: [VN30, VNREAL]
  markets: [HOSE]
outcomes:
  - version: top3-taker-markout-v1
    effective_from: 2026-08-27
    effective_to: null
    horizons_seconds: [30, 60, 300]
    order_quantity: 100
    # Explicit research assumption, not measured SSI order-routing latency.
    execution_latency_milliseconds: 500
baseline_evaluations:
  - version: exploratory-baseline-holdout-v1
    tier: EXPLORATORY
    effective_from: 2026-08-27
    effective_to: null
    development_sessions: 10
    purge_sessions: 1
    holdout_sessions: 5
  - version: promotion-baseline-holdout-v1
    tier: PROMOTION
    effective_from: 2026-08-27
    effective_to: null
    development_sessions: 20
    purge_sessions: 1
    holdout_sessions: 5
candidate_arbitrations:
  - version: buy-first-candidate-arbitration-v1
    # Declared prospectively. Never apply this outcome-informed ordering to older sessions.
    effective_from: 2026-09-28
    effective_to: null
    candidate_version: buy-first-baselines-v3
    cooldown_seconds: 300
    maximum_selections_per_clock: 2
    rules:
      - strategy: vic_vhm_relative
        priority: 0
        minimum_strength: "0"
        horizon_seconds: 300
      - strategy: momentum_pullback
        priority: 1
        minimum_strength: "0"
        horizon_seconds: 300
      - strategy: mean_reversion
        priority: 2
        minimum_strength: "0"
        horizon_seconds: 300
promotion_gates:
  - version: shadow-to-paper-v1
    # Fixed prospectively before the first arbitration session; never tune on holdout outcomes.
    effective_from: 2026-09-28
    effective_to: null
    scope: SHADOW_TO_PAPER
    evaluation_version: promotion-baseline-holdout-v1
    arbitration_version: buy-first-candidate-arbitration-v1
    minimum_selected_count: 5
    minimum_outcome_coverage_rate: "0.90"
    minimum_positive_net_rate: "0.55"
    minimum_average_net_return_bps: "0"
    minimum_worst_fold_net_return_bps: "-10"
    maximum_capture_gap_count: 0
    targets:
      - {strategy: mean_reversion, symbol: VHM, horizon_seconds: 300}
      - {strategy: mean_reversion, symbol: VIC, horizon_seconds: 300}
      - {strategy: momentum_pullback, symbol: VHM, horizon_seconds: 300}
      - {strategy: momentum_pullback, symbol: VIC, horizon_seconds: 300}
      - {strategy: vic_vhm_relative, symbol: VHM, horizon_seconds: 300}
      - {strategy: vic_vhm_relative, symbol: VIC, horizon_seconds: 300}
paper_executions:
  - version: buy-first-paper-execution-v1
    effective_from: 2026-09-28
    effective_to: null
    arbitration_version: buy-first-candidate-arbitration-v1
    promotion_gate_version: shadow-to-paper-v1
    context_version: decision-context-v3
    order_quantity: 100
    lot_size: 100
    maximum_quote_age_seconds: 5
    limit_offset_ticks: 0
    time_in_force_seconds: 5
contexts:
  - version: decision-context-v3
    effective_from: 2026-08-27
    effective_to: null
    zone_lookback_seconds: 900
    zone_minimum_observations: 12
    zone_tolerance_bps: "20"
    market_windows_seconds: [60, 300]
    index_stale_after_seconds: 30
    # Historical bars are exposed only after one complete interval; the small grace
    # prevents scheduler jitter from classifying the latest closed bar as stale.
    historical_proxy_interval_seconds: 60
    historical_proxy_stale_after_seconds: 65
    tradable_market_statuses: [LO, OPEN, CONTINUOUS]
    trend_threshold_bps: "10"
    high_volatility_threshold_bps: "20"
versions:
  - version: market-state-v1
    effective_from: 2026-08-27
    effective_to: null
    market:
      timezone: Asia/Ho_Chi_Minh
      symbols: [VIC, VHM]
      indices: [VNINDEX, VN30]
      status_markets: [HOSE]
      quote_depth: 3
      bar_interval_seconds: 60
      sessions:
        opening_auction: ["09:00:00", "09:15:00"]
        continuous_am: ["09:15:00", "11:30:00"]
        continuous_pm: ["13:00:00", "14:30:00"]
        closing_auction: ["14:30:00", "14:45:00"]
    data_quality:
      trade_stale_after_seconds: 90
      quote_stale_after_seconds: 30
    features:
      version: microstructure-v1
      cadence_seconds: 5
      windows_seconds: [30, 60, 300]
      warmup_seconds: 300
      decision_sessions: [continuous_am, continuous_pm]
