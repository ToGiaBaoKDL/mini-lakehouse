name: Release Airflow runtime

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-airflow.yml
      - orchestration/pyproject.toml
      - orchestration/uv.lock
      - orchestration/runtime/**
      - orchestration/deploy/**
      - infra/runtime/postgres/**
      - infra/runtime/identity/install-aws-signing-helper
  workflow_dispatch:

jobs:
  release:
    uses: ./.github/workflows/_release-image.yml
    permissions:
      contents: read
      id-token: write
    with:
      component: airflow
      dockerfile: orchestration/runtime/Dockerfile
      repository: tgbao-dev-airflow
