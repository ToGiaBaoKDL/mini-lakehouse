name: Deploy Lightdash project
# Manual redeploy marker: 2026-08-31.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-lightdash-project.yml
      - analytics/dbt-project/**
      - analytics/lightdash/project/**
  workflow_dispatch:

concurrency:
  group: dev-lightdash-project-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy Lakehouse Analytics
    if: github.ref == 'refs/heads/main'
    environment: dev
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "true"
      DBT_DOMAIN: all
      DBT_SCHEMA: analytics
      LIGHTDASH_CONTENT_DIR: analytics/lightdash/project/content
      LIGHTDASH_PROJECT: bde2b242-ad5d-495b-a581-7a1f74787902
      LIGHTDASH_PROJECT_NAME: Lakehouse Analytics
      LIGHTDASH_URL: ${{ vars.LIGHTDASH_URL }}
      LIGHTDASH_VERSION: 2.134.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: "0.11.30"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install dbt runtime
        run: |
          uv sync --frozen --project analytics/dbt-project/runtime
          echo "$GITHUB_WORKSPACE/analytics/dbt-project/runtime/.venv/bin" >> "$GITHUB_PATH"
      - run: npm install --global "@lightdash/cli@$LIGHTDASH_VERSION"
      - uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          aws-region: ap-southeast-1
          role-to-assume: ${{ vars.AWS_LIGHTDASH_DEPLOYER_ROLE_ARN }}
      - uses: aws-actions/aws-secretsmanager-get-secrets@2cb1a461cbd4865ac4299648312e4704c646cd53 # v3.0.1
        with:
          parse-json-secrets: true
          secret-ids: |
            LIGHTDASH, ${{ vars.LIGHTDASH_CI_SECRET_ID }}
      - uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ vars.TAILSCALE_CLIENT_ID }}
          audience: ${{ vars.TAILSCALE_AUDIENCE }}
          tags: tag:tgbao-dev-ci
          ping: tgbao-dev-services
      - name: Wait for matching Lightdash server
        run: |
          for attempt in $(seq 1 120); do
            server_version=$(curl --connect-timeout 5 --max-time 10 --silent --show-error \
              "$LIGHTDASH_URL/api/v1/health" | jq -r '.results.version // empty' || true)
            if [ "$server_version" = "$LIGHTDASH_VERSION" ]; then
              exit 0
            fi
            printf 'Waiting for Lightdash %s (server reported %s; attempt %s/120).\n' \
              "$LIGHTDASH_VERSION" "${server_version:-unavailable}" "$attempt"
            sleep 10
          done
          printf 'Lightdash server did not converge to %s.\n' "$LIGHTDASH_VERSION" >&2
          exit 1
      - name: Compile analytics semantic layer
        env:
          DBT_ANALYTICS_URI: s3://validation
          DBT_QUERY_RESULTS_URI: s3://validation/lightdash
        run: |
          env -u VIRTUAL_ENV uv run --project analytics/dbt-project/runtime dbt deps \
            --project-dir analytics/dbt-project
          env -u VIRTUAL_ENV uv run --project analytics/dbt-project/runtime dbt parse \
            --project-dir analytics/dbt-project \
            --profiles-dir analytics/dbt-project \
            --no-partial-parse \
            --show-all-deprecations
          lightdash lint --path "$LIGHTDASH_CONTENT_DIR"
      - name: Deploy analytics project
        run: |
          lightdash config get-project
          lightdash config rename-project --name "$LIGHTDASH_PROJECT_NAME"
          lightdash config get-project
          lightdash deploy \
            --project "$LIGHTDASH_PROJECT" \
            --project-dir analytics/dbt-project \
            --profiles-dir analytics/dbt-project \
            --skip-dbt-compile \
            --skip-warehouse-catalog \
            --no-partial-compilation \
            --assume-yes \
            --gzip
          lightdash upload \
            --project "$LIGHTDASH_PROJECT" \
            --path "$LIGHTDASH_CONTENT_DIR" \
            --concurrency 4 \
            --gzip
          lightdash validate \
            --project-dir analytics/dbt-project \
            --profiles-dir analytics/dbt-project \
            --skip-dbt-compile \
            --skip-warehouse-catalog \
            --only tables charts dashboards \
            --show-chart-configuration-warnings \
            --no-partial-compilation
