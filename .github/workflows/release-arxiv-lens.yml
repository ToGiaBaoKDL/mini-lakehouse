name: Release ArXiv Lens
# Manual redeploy marker: 2026-08-31.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-arxiv-lens.yml
      - arxiv-lens/**
      - ocr-engine/src/**
      - ocr-engine/pyproject.toml
      - lakehouse/catalog/**
      - lakehouse/contracts/curated/arxiv.yaml
      - lakehouse/contracts/sources/arxiv.yaml
      - pyproject.toml
      - uv.lock
      - infra/runtime/identity/install-aws-signing-helper
  workflow_dispatch:

jobs:
  release:
    uses: ./.github/workflows/_release-image.yml
    permissions:
      contents: read
      id-token: write
    with:
      component: arxiv-lens
      dockerfile: arxiv-lens/Dockerfile
      repository: tgbao-dev-arxiv-lens
