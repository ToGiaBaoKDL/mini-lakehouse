name: Release OCR worker

on:
  push:
    branches: [main]
    paths:
      - ocr/**
      - platform/contracts/**
      - platform/src/**
      - platform/pyproject.toml
      - pyproject.toml
      - uv.lock
      - infra/runtime/identity/install-aws-signing-helper
  workflow_dispatch:

jobs:
  release:
    uses: ./.github/workflows/_release-image.yml
    permissions:
      contents: read
      id-token: write
    with:
      component: ocr-worker
      dockerfile: ocr/Dockerfile
      repository: tgbao-dev-ocr-worker
