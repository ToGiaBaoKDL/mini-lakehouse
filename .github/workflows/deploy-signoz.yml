name: Deploy SigNoz stack

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-signoz.yml
      - observability/signoz/**
      - infra/runtime/postgres/bootstrap/**
      - infra/runtime/postgres/compose.yaml
      - infra/runtime/postgres/deploy
  workflow_dispatch:

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: dev
    concurrency:
      group: dev-signoz
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      TAILSCALE_CLIENT_ID: ${{ vars.TAILSCALE_CLIENT_ID }}
      TAILSCALE_AUDIENCE: ${{ vars.TAILSCALE_AUDIENCE }}
      FOUNDRY_VERSION: v0.2.17
      FOUNDRY_SHA256_LINUX_AMD64: 51f41204b8048cd1f7e278fb5d2ba5d82d2ee8fb619bfe9330e2f8ceffc0d886
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate casting with Foundry
        shell: bash
        run: |
          set -euo pipefail
          tool_dir=$(mktemp -d)
          trap 'rm -rf "$tool_dir"' EXIT
          curl -fsSL -o "$tool_dir/foundry.tar.gz" \
            "https://github.com/SigNoz/foundry/releases/download/${FOUNDRY_VERSION}/foundry_linux_amd64.tar.gz"
          printf '%s  %s/foundry.tar.gz\n' "$FOUNDRY_SHA256_LINUX_AMD64" "$tool_dir" | sha256sum -c -
          tar -xzf "$tool_dir/foundry.tar.gz" -C "$tool_dir"
          work_dir=$(mktemp -d)
          trap 'rm -rf "$tool_dir" "$work_dir"' EXIT
          cp observability/signoz/casting.yaml "$work_dir/"
          (cd "$work_dir" && "$tool_dir/foundry_linux_amd64/bin/foundryctl" forge -f casting.yaml)
          cmp "$work_dir/casting.yaml.lock" observability/signoz/casting.yaml.lock
          compose="$work_dir/pours/deployment/compose.yaml"
          docker compose -f "$compose" config --quiet
          grep -Eq '^[[:space:]]*- 127\.0\.0\.1:8082:8080$' "$compose"
          grep -Eq '^[[:space:]]*- 127\.0\.0\.1:4317:4317$' "$compose"
          grep -Eq '^[[:space:]]*- 127\.0\.0\.1:4318:4318$' "$compose"
          test "$(grep -c '^[[:space:]]*limits:$' "$compose")" -eq 5

      - name: Validate collection agent
        shell: bash
        run: |
          set -euo pipefail
          image=$(<observability/signoz/collector/image)
          [[ "$image" =~ ^otel/opentelemetry-collector-contrib:[0-9]+\.[0-9]+\.[0-9]+@sha256:[0-9a-f]{64}$ ]]
          docker pull "$image" >/dev/null
          hostfs=$(mktemp -d)
          trap 'rm -rf "$hostfs"' EXIT
          COLLECTOR_IMAGE="$image" PG_MONITOR_PASSWORD=validation \
            docker compose --project-name signoz-collection-agent \
              -f observability/signoz/collector/compose.yaml config --quiet
          docker run --rm \
            -v "$PWD/observability/signoz/collector/config.yaml:/etc/otel-collector/config.yaml:ro" \
            -v "$hostfs:/hostfs:ro" \
            -e POSTGRES_MONITOR_ENDPOINT=metadata-postgres:5432 \
            -e PG_MONITOR_USER=lakehouse_monitor \
            -e PG_MONITOR_PASSWORD=validation \
            "$image" validate --config=/etc/otel-collector/config.yaml

      - uses: ./.github/actions/reconcile-services-host

      - name: Deploy SigNoz stack through Foundry
        shell: bash
        run: |
          set -euo pipefail
          remote_dir="/tmp/lakehouse-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          remote_command="set -eu; work_dir='$remote_dir'; trap 'rm -rf \"\$work_dir\"' EXIT; install -d -m 0700 \"\$work_dir\"; tar -C \"\$work_dir\" -xf -; \"\$work_dir/observability/signoz/deploy/deploy\""
          tar -cf - \
            observability/signoz/casting.yaml \
            observability/signoz/casting.yaml.lock \
            observability/signoz/deploy/deploy \
            | tailscale ssh ubuntu@tgbao-dev-services "$remote_command"

      - name: Deploy collection agent
        shell: bash
        run: |
          set -euo pipefail
          image=$(<observability/signoz/collector/image)
          remote_dir="/tmp/lakehouse-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          remote_command="set -eu; work_dir='$remote_dir'; trap 'rm -rf \"\$work_dir\"' EXIT; install -d -m 0700 \"\$work_dir\"; tar -C \"\$work_dir\" -xf -; \"\$work_dir/observability/signoz/collector/deploy\" '$image'"
          tar -cf - \
            observability/signoz/collector/config.yaml \
            observability/signoz/collector/compose.yaml \
            observability/signoz/collector/image \
            observability/signoz/collector/deploy \
            infra/runtime/postgres/deploy \
            infra/runtime/postgres/compose.yaml \
            infra/runtime/postgres/initialize-secrets \
            infra/runtime/postgres/bootstrap \
            | tailscale ssh ubuntu@tgbao-dev-services "$remote_command"

      - uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        if: ${{ vars.AWS_SIGNOZ_DEPLOYER_ROLE_ARN != '' }}
        with:
          aws-region: ap-southeast-1
          role-to-assume: ${{ vars.AWS_SIGNOZ_DEPLOYER_ROLE_ARN }}

      - uses: aws-actions/aws-secretsmanager-get-secrets@2cb1a461cbd4865ac4299648312e4704c646cd53 # v3.0.1
        if: ${{ vars.SIGNOZ_CI_SECRET_ID != '' }}
        with:
          parse-json-secrets: true
          secret-ids: |
            SIGNOZ, ${{ vars.SIGNOZ_CI_SECRET_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.14.5"
          terraform_wrapper: false

      - name: Apply SigNoz dashboards and alert rules
        shell: bash
        env:
          SIGNOZ_ACCESS_TOKEN: ${{ env.SIGNOZ_TOKEN || env.SIGNOZ || secrets.SIGNOZ_ACCESS_TOKEN }}
          SIGNOZ_ENDPOINT: ${{ vars.SIGNOZ_URL || 'http://tgbao-dev-services:8082' }}
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET || vars.STATE_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNOZ_ACCESS_TOKEN:-}" ]; then
            printf '%s\n' "SigNoz access token is not configured in Secrets Manager or GitHub Secrets. Skipping automated dashboards/alerts apply."
            printf '%s\n' "Populate the AWS Secrets Manager secret (${vars.SIGNOZ_CI_SECRET_ID:-lakehouse/dev/signoz/ci}) or add SIGNOZ_ACCESS_TOKEN in GitHub Secrets."
            exit 0
          fi

          printf '%s\n' "Applying SigNoz dashboards and alert rules via Terraform..."
          cd observability/signoz/terraform

          STATE_BUCKET="${STATE_BUCKET:-}"
          if [ -z "${STATE_BUCKET}" ]; then
            account_id=$(aws sts get-caller-identity --query Account --output text 2>/dev/null || true)
            if [ -n "${account_id}" ]; then
              STATE_BUCKET="tgbao-terraform-state-${account_id}"
            fi
          fi

          if [ -n "${STATE_BUCKET}" ]; then
            printf '%s\n' "Initializing Terraform with S3 backend bucket: ${STATE_BUCKET}..."
            terraform init -backend-config="bucket=${STATE_BUCKET}"
          else
            printf '%s\n' "No S3 state bucket available. Initializing with local backend fallback..."
            mv backend.tf backend.tf.disabled 2>/dev/null || true
            terraform init
          fi

          terraform apply -auto-approve \
            -var="signoz_endpoint=${SIGNOZ_ENDPOINT}" \
            -var="signoz_access_token=${SIGNOZ_ACCESS_TOKEN}"
