name: Deploy SigNoz stack
# SigNoz is an on-demand diagnostics stack: pull requests validate its code,
# while only an explicit workflow dispatch may start or update the runtime.

on:
  pull_request:
    paths:
      - .github/workflows/deploy-signoz.yml
      - sysops/signoz/**
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-signoz.yml
      - sysops/signoz/**
      - infra/runtime/postgres/bootstrap/**
      - infra/runtime/postgres/compose.yaml
      - infra/runtime/postgres/deploy
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      FOUNDRY_VERSION: v0.2.17
      FOUNDRY_SHA256_LINUX_AMD64: 51f41204b8048cd1f7e278fb5d2ba5d82d2ee8fb619bfe9330e2f8ceffc0d886
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate casting with Foundry
        shell: bash
        run: |
          set -euo pipefail
          tool_dir=$(mktemp -d)
          trap 'rm -rf "$tool_dir"' EXIT
          curl -fsSL -o "$tool_dir/foundry.tar.gz" \
            "https://github.com/SigNoz/foundry/releases/download/${FOUNDRY_VERSION}/foundry_linux_amd64.tar.gz"
          printf '%s  %s/foundry.tar.gz\n' "$FOUNDRY_SHA256_LINUX_AMD64" "$tool_dir" | sha256sum -c -
          tar -xzf "$tool_dir/foundry.tar.gz" -C "$tool_dir"
          work_dir=$(mktemp -d)
          trap 'rm -rf "$tool_dir" "$work_dir"' EXIT
          cp sysops/signoz/casting.yaml "$work_dir/"
          (cd "$work_dir" && "$tool_dir/foundry_linux_amd64/bin/foundryctl" forge -f casting.yaml)
          cmp "$work_dir/casting.yaml.lock" sysops/signoz/casting.yaml.lock
          compose="$work_dir/pours/deployment/compose.yaml"
          docker compose -f "$compose" config --quiet
          grep -Eq '^[[:space:]]*- 8082:8080$' "$compose"
          grep -Eq '^[[:space:]]*- 127\.0\.0\.1:4317:4317$' "$compose"
          grep -Eq '^[[:space:]]*- 127\.0\.0\.1:4318:4318$' "$compose"
          test "$(grep -c '^[[:space:]]*limits:$' "$compose")" -eq 5

      - name: Validate collection agent
        shell: bash
        run: |
          set -euo pipefail
          image=$(<sysops/signoz/collector/image)
          [[ "$image" =~ ^otel/opentelemetry-collector-contrib:[0-9]+\.[0-9]+\.[0-9]+@sha256:[0-9a-f]{64}$ ]]
          docker pull "$image" >/dev/null
          hostfs=$(mktemp -d)
          trap 'rm -rf "$hostfs"' EXIT
          COLLECTOR_IMAGE="$image" COLLECTOR_CONFIG_SHA256=validation \
            COLLECTOR_HOSTNAME=validation-host PG_MONITOR_PASSWORD=validation \
            docker compose --project-name signoz-collection-agent \
              -f sysops/signoz/collector/compose.yaml config --quiet
          docker run --rm \
            -v "$PWD/sysops/signoz/collector/config.yaml:/etc/otel-collector/config.yaml:ro" \
            -v "$hostfs:/hostfs:ro" \
            -e POSTGRES_MONITOR_ENDPOINT=metadata-postgres:5432 \
            -e PG_MONITOR_USER=lakehouse_monitor \
            -e PG_MONITOR_PASSWORD=validation \
            "$image" validate --config=/etc/otel-collector/config.yaml \
              --feature-gates=receiver.postgresql.connectionPool

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: dev
    concurrency:
      group: dev-signoz
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      TAILSCALE_CLIENT_ID: ${{ vars.TAILSCALE_CLIENT_ID }}
      TAILSCALE_AUDIENCE: ${{ vars.TAILSCALE_AUDIENCE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate deployment configuration
        shell: bash
        env:
          AWS_SIGNOZ_DEPLOYER_ROLE_ARN: ${{ vars.AWS_SIGNOZ_DEPLOYER_ROLE_ARN }}
          SIGNOZ_CI_SECRET_ID: ${{ vars.SIGNOZ_CI_SECRET_ID }}
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          set -euo pipefail
          test -n "${TAILSCALE_CLIENT_ID:-}" || { echo "TAILSCALE_CLIENT_ID is required." >&2; exit 1; }
          test -n "${TAILSCALE_AUDIENCE:-}" || { echo "TAILSCALE_AUDIENCE is required." >&2; exit 1; }
          test -n "${AWS_SIGNOZ_DEPLOYER_ROLE_ARN:-}" || { echo "AWS_SIGNOZ_DEPLOYER_ROLE_ARN is required." >&2; exit 1; }
          test -n "${SIGNOZ_CI_SECRET_ID:-}" || { echo "SIGNOZ_CI_SECRET_ID is required." >&2; exit 1; }
          test -n "${STATE_BUCKET:-}" || { echo "TF_STATE_BUCKET is required." >&2; exit 1; }

      - uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          aws-region: ap-southeast-1
          role-to-assume: ${{ vars.AWS_SIGNOZ_DEPLOYER_ROLE_ARN }}

      - uses: aws-actions/aws-secretsmanager-get-secrets@2cb1a461cbd4865ac4299648312e4704c646cd53 # v3.0.1
        with:
          parse-json-secrets: true
          secret-ids: |
            SIGNOZ, ${{ vars.SIGNOZ_CI_SECRET_ID }}

      - name: Validate SigNoz credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SIGNOZ_TOKEN:-}" || {
            echo "The SigNoz CI secret must contain a non-empty token field." >&2
            exit 1
          }

      - uses: ./.github/actions/reconcile-services-host

      - name: Deploy SigNoz stack through Foundry
        shell: bash
        run: |
          set -euo pipefail
          remote_dir="/tmp/lakehouse-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          remote_command="set -eu; work_dir='$remote_dir'; trap 'rm -rf \"\$work_dir\"' EXIT; install -d -m 0700 \"\$work_dir\"; tar -C \"\$work_dir\" -xf -; \"\$work_dir/sysops/signoz/deploy/deploy\""
          tar -cf - \
            sysops/signoz/casting.yaml \
            sysops/signoz/casting.yaml.lock \
            sysops/signoz/deploy/deploy \
            | tailscale ssh ubuntu@tgbao-dev-services "$remote_command"

      - name: Deploy collection agent
        shell: bash
        run: |
          set -euo pipefail
          image=$(<sysops/signoz/collector/image)
          remote_dir="/tmp/lakehouse-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          remote_command="set -eu; work_dir='$remote_dir'; trap 'rm -rf \"\$work_dir\"' EXIT; install -d -m 0700 \"\$work_dir\"; tar -C \"\$work_dir\" -xf -; \"\$work_dir/sysops/signoz/collector/deploy\" '$image'"
          tar -cf - \
            sysops/signoz/collector/config.yaml \
            sysops/signoz/collector/compose.yaml \
            sysops/signoz/collector/image \
            sysops/signoz/collector/deploy \
            infra/runtime/postgres/deploy \
            infra/runtime/postgres/compose.yaml \
            infra/runtime/postgres/initialize-secrets \
            infra/runtime/postgres/bootstrap \
            | tailscale ssh ubuntu@tgbao-dev-services "$remote_command"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.14.5"
          terraform_wrapper: false

      - name: Apply SigNoz dashboards and alert rules
        shell: bash
        env:
          SIGNOZ_ACCESS_TOKEN: ${{ env.SIGNOZ_TOKEN }}
          SIGNOZ_ENDPOINT: ${{ vars.SIGNOZ_URL || 'http://tgbao-dev-services:8082' }}
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          set -euo pipefail
          printf '%s\n' "Applying SigNoz dashboards and alert rules via Terraform..."
          cd sysops/signoz/terraform

          printf '%s\n' "Initializing Terraform with S3 backend bucket: ${STATE_BUCKET}..."
          terraform init -backend-config="bucket=${STATE_BUCKET}"

          terraform apply -auto-approve \
            -var="signoz_endpoint=${SIGNOZ_ENDPOINT}"
