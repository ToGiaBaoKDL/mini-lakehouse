name: Release dbt

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-dbt.yml
      - analytics/dbt-project/**
      - infra/runtime/identity/install-aws-signing-helper
  workflow_dispatch:

jobs:
  release:
    uses: ./.github/workflows/_release-image.yml
    permissions:
      contents: read
      id-token: write
    with:
      component: dbt
      dockerfile: analytics/dbt-project/Dockerfile
      repository: tgbao-dev-analytics-dbt
