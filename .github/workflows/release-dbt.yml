name: Release dbt

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-dbt.yml
      - dbt/Dockerfile
      - dbt/deploy/**
      - dbt/runtime/**
      - dbt/dbt_project.yml
      - dbt/models/**
      - dbt/package-lock.yml
      - dbt/packages.yml
      - dbt/profiles.yml
      - dbt/selectors.yml
      - infra/runtime/identity/install-aws-signing-helper
  workflow_dispatch:

jobs:
  release:
    uses: ./.github/workflows/_release-image.yml
    permissions:
      contents: read
      id-token: write
    with:
      component: dbt
      dockerfile: dbt/Dockerfile
      repository: tgbao-dev-dbt
