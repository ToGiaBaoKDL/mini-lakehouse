name: Deploy Mini Lakehouse docs
# Manual redeploy marker: 2026-08-31.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-docs.yml
      - docs/**
      - make/docs.mk
  workflow_dispatch:

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: dev
    concurrency:
      group: dev-mini-lakehouse-docs
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.21.0 --activate
          pnpm --dir docs install --frozen-lockfile

      - name: Validate and build
        run: pnpm --dir docs check

      - name: Validate deployment configuration
        shell: bash
        env:
          AWS_DOCS_DEPLOYER_ROLE_ARN: ${{ vars.AWS_DOCS_DEPLOYER_ROLE_ARN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DOCS_CI_SECRET_ID: ${{ vars.CLOUDFLARE_DOCS_CI_SECRET_ID }}
        run: |
          set -euo pipefail
          test -n "$AWS_DOCS_DEPLOYER_ROLE_ARN" || {
            echo "AWS_DOCS_DEPLOYER_ROLE_ARN is required." >&2
            exit 1
          }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || {
            echo "CLOUDFLARE_ACCOUNT_ID is required." >&2
            exit 1
          }
          test -n "$CLOUDFLARE_DOCS_CI_SECRET_ID" || {
            echo "CLOUDFLARE_DOCS_CI_SECRET_ID is required." >&2
            exit 1
          }

      - name: Assume the documentation deployer role
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          aws-region: ap-southeast-1
          role-to-assume: ${{ vars.AWS_DOCS_DEPLOYER_ROLE_ARN }}
          role-session-name: github-docs-${{ github.run_id }}

      - name: Load the Cloudflare deployment token
        uses: aws-actions/aws-secretsmanager-get-secrets@2cb1a461cbd4865ac4299648312e4704c646cd53 # v3.0.1
        with:
          parse-json-secrets: true
          secret-ids: |
            CLOUDFLARE, ${{ vars.CLOUDFLARE_DOCS_CI_SECRET_ID }}

      - name: Validate the Cloudflare deployment token
        shell: bash
        run: |
          set -euo pipefail
          test "${CLOUDFLARE_VERSION:-}" = "1" || {
            echo "The Cloudflare docs CI secret must use version 1." >&2
            exit 1
          }
          test -n "${CLOUDFLARE_API_TOKEN:-}" || {
            echo "The Cloudflare docs CI secret must contain api_token." >&2
            exit 1
          }

      - name: Deploy static assets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --dir docs deploy
