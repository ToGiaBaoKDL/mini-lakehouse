name: Deploy Netdata

on:
  push:
    branches: [main]
    paths:
      - .github/actions/deploy-component/action.yml
      - .github/actions/reconcile-services-host/action.yml
      - .github/workflows/deploy-netdata.yml
      - infra/runtime/delivery/deploy-component
      - infra/runtime/host/netdata-statsd-firewall
      - infra/runtime/host/reconcile-docker-networks
      - infra/runtime/host/reconcile-netdata-statsd
      - infra/runtime/host/systemd/lakehouse-netdata-statsd.service
      - infra/runtime/postgres/bootstrap/pg_monitor.sql
      - sysops/netdata/**
  workflow_dispatch:

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: dev
    concurrency:
      group: dev-netdata
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      TAILSCALE_CLIENT_ID: ${{ vars.TAILSCALE_CLIENT_ID }}
      TAILSCALE_AUDIENCE: ${{ vars.TAILSCALE_AUDIENCE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Netdata runtime
        shell: bash
        run: |
          set -euo pipefail
          make netdata-validate

      - name: Resolve reviewed upstream image
        id: release
        shell: bash
        run: |
          set -euo pipefail
          image=$(<sysops/netdata/image)
          [[ "$image" =~ ^netdata/netdata:v[0-9]+\.[0-9]+\.[0-9]+@sha256:[0-9a-f]{64}$ ]]
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/deploy-component
        with:
          component: netdata
          image: ${{ steps.release.outputs.image }}
