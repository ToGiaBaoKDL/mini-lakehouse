name: Release T0 trading

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-t0-trading.yml
      - t0-trading/**
      - pyproject.toml
      - uv.lock
      - infra/runtime/identity/install-aws-signing-helper
  workflow_dispatch:

jobs:
  release:
    uses: ./.github/workflows/_release-image.yml
    permissions:
      contents: read
      id-token: write
    with:
      component: t0-trading
      dockerfile: t0-trading/Dockerfile
      repository: tgbao-dev-t0-trading
