name: Airflow Bundle CI

permissions:
  contents: read

on:
  pull_request:
    paths:
      - automation/airflow/bundle/**
      - automation/airflow/pyproject.toml
      - automation/airflow/uv.lock
      - .github/workflows/airflow-bundle.yml
  push:
    branches: [main]
    paths:
      - automation/airflow/bundle/**
      - automation/airflow/pyproject.toml
      - automation/airflow/uv.lock
      - .github/workflows/airflow-bundle.yml

concurrency:
  group: airflow-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: "0.11.30"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - run: uv sync --frozen --project automation/airflow --all-groups
      - run: uv run --project automation/airflow ruff format --check automation/airflow/bundle
      - run: uv run --project automation/airflow ruff check automation/airflow/bundle
      - run: uv run --project automation/airflow pyright --project automation/airflow
      - run: >-
          uv run --project automation/airflow pytest
          -c automation/airflow/pyproject.toml automation/airflow/bundle/tests
