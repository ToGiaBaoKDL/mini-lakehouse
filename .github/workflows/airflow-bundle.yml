name: Airflow Bundle CI

permissions:
  contents: read

on:
  pull_request:
    paths:
      - orchestration/bundle/**
      - orchestration/runtime/pyproject.toml
      - orchestration/runtime/uv.lock
      - .github/workflows/airflow-bundle.yml
  push:
    branches: [main]
    paths:
      - orchestration/bundle/**
      - orchestration/runtime/pyproject.toml
      - orchestration/runtime/uv.lock
      - .github/workflows/airflow-bundle.yml

concurrency:
  group: airflow-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: "0.11.30"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - run: uv sync --frozen --project orchestration/runtime --all-groups
      - run: uv run --project orchestration/runtime ruff format --check orchestration/bundle
      - run: uv run --project orchestration/runtime ruff check orchestration/bundle
      - run: uv run --project orchestration/runtime pyright --project orchestration/runtime
      - run: >-
          uv run --project orchestration/runtime pytest
          -c orchestration/runtime/pyproject.toml orchestration/bundle/tests
