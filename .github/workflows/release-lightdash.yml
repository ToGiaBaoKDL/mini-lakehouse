name: Release Lightdash

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-lightdash.yml
      - apps/lightdash/deploy/**
      - infra/runtime/identity/install-aws-signing-helper
      - infra/runtime/postgres/**
  workflow_dispatch:

jobs:
  release:
    uses: ./.github/workflows/_release-image.yml
    permissions:
      contents: read
      id-token: write
    with:
      build_context: https://github.com/lightdash/lightdash.git#f57276359a0ffcf38c201f95503e671bf80910cd
      component: lightdash
      dockerfile: dockerfile
      external_source_revision: f57276359a0ffcf38c201f95503e671bf80910cd
      external_source_url: https://github.com/lightdash/lightdash
      platforms: linux/arm64
      repository: tgbao-dev-lightdash
      runner: ubuntu-24.04-arm
      build_timeout_minutes: 120
