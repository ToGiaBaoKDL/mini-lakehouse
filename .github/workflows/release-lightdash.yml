name: Release Lightdash
# Manual redeploy marker: 2026-08-31.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-lightdash.yml
      - analytics/lightdash/deploy/**
      - infra/runtime/identity/install-aws-signing-helper
      - infra/runtime/postgres/**
  workflow_dispatch:

jobs:
  release:
    uses: ./.github/workflows/_release-image.yml
    permissions:
      contents: read
      id-token: write
    with:
      # Lightdash 2.134.2
      build_context: https://github.com/lightdash/lightdash.git#0d552a2945af139cd6425111acd3b63b89b7b1ae
      component: lightdash
      dockerfile: dockerfile
      external_source_revision: 0d552a2945af139cd6425111acd3b63b89b7b1ae
      external_source_url: https://github.com/lightdash/lightdash
      platforms: linux/arm64
      repository: tgbao-dev-analytics-lightdash
      runner: ubuntu-24.04-arm
      build_timeout_minutes: 120
