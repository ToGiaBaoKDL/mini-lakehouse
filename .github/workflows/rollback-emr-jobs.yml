name: Roll back EMR jobs

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Reviewed 40-character Git revision to restore
        required: true
        type: string

jobs:
  rollback:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: dev
    concurrency:
      group: dev-emr-jobs
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-southeast-1
      EMR_ARTIFACTS_URI: ${{ vars.EMR_ARTIFACTS_URI }}
      EMR_CODE_PARAMETER_NAME: ${{ vars.EMR_CODE_PARAMETER_NAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the release was reviewed on main
        shell: bash
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$REVISION" origin/main
      - name: Assume the EMR publisher role
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_EMR_PUBLISHER_ROLE_ARN }}
          role-session-name: github-rollback-${{ github.run_id }}
      - name: Restore the immutable release pointer
        shell: bash
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          release_uri="${EMR_ARTIFACTS_URI%/}/$REVISION"
          s3_path=${release_uri#s3://}
          bucket=${s3_path%%/*}
          prefix=${s3_path#*/}
          aws s3api head-object --bucket "$bucket" --key "$prefix/SHA256SUMS" >/dev/null
          aws ssm put-parameter \
            --name "$EMR_CODE_PARAMETER_NAME" \
            --type String \
            --value "$release_uri" \
            --overwrite >/dev/null
          echo "Restored $release_uri"
