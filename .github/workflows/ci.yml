name: Lakehouse CI/CD Pipeline

on:
  pull_request:
    branches:
      - master
      - main
  push:
    branches:
      - master
      - main

jobs:
  lint-and-typecheck:
    name: Lint (Ruff) & Typecheck (Pyright)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync

      - name: Run Ruff Linter
        run: uv run ruff check .

      - name: Run Pyright Type Checker
        run: uv run pyright .

  dbt-slim-ci:
    name: dbt Slim CI & Validation
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    # Chỉ chạy dbt validation trong môi trường Docker nếu service có sẵn
    # Trong môi trường Github Actions thực tế, ta thường khởi chạy ClickHouse & Catalog dưới dạng dịch vụ service containers
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:24.3
        ports:
          - 8123:8123
          - 9000:9000
        env:
          CLICKHOUSE_DB: github_lakehouse
          CLICKHOUSE_USER: dev_user
          CLICKHOUSE_PASSWORD: dev_password
        options: >-
          --health-cmd "wget --spider -q http://localhost:8123/ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv sync

      - name: Create dummy directories for dbt tests
        run: |
          mkdir -p warehouse/landing_api_github/events_raw/data
          # Copy hoặc tạo một tệp parquet giả lập để dbt view compile thành công
          # Trong môi trường CI thực tế, ta có thể sinh dữ liệu giả lập (mock data)
          touch warehouse/landing_api_github/events_raw/data/dummy.parquet

      - name: dbt Debug Connection
        run: |
          uv run dbt debug --project-dir dbt_project --profiles-dir dbt_project
        env:
          CLICKHOUSE_HOST: localhost
          CLICKHOUSE_PORT: 8123
          CLICKHOUSE_USER: dev_user
          CLICKHOUSE_PASSWORD: dev_password

      # Chạy dbt build cho tất cả các mô hình có thay đổi (Slim CI)
      # Để so sánh state, ta có thể dùng flag --select state:modified nếu có artifact từ trước
      - name: dbt Build & Test
        run: |
          uv run dbt build --project-dir dbt_project --profiles-dir dbt_project
        env:
          CLICKHOUSE_HOST: localhost
          CLICKHOUSE_PORT: 8123
          CLICKHOUSE_USER: dev_user
          CLICKHOUSE_PASSWORD: dev_password
