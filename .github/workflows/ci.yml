name: Lakehouse CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true
          version: latest
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - run: uv sync --locked --all-extras --all-groups
      - run: uv lock --check
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest -m "not integration"
      - run: uv run dbt parse --project-dir dbt_project --profiles-dir dbt_project
      - run: docker compose -f compose.core.yaml config --quiet
      - run: docker compose -f compose.core.yaml -f compose.prefect.yaml config --quiet
      - run: docker compose -f compose.core.yaml -f compose.dashboard.yaml config --quiet

  catalog-integration:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true
          version: latest
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - run: uv sync --locked --all-groups
      - name: Start Polaris and Trino dependency chain
        run: docker compose -f compose.core.yaml up -d --build trino
      - name: Wait for Trino
        run: timeout 240 bash -c 'until curl --fail --silent http://localhost:8080/v1/info; do sleep 3; done'
      - name: Read catalog contract
        run: RUN_LAKEHOUSE_INTEGRATION=1 uv run pytest -m integration
      - name: Collect service logs
        if: failure()
        run: docker compose -f compose.core.yaml logs --no-color
      - name: Stop services
        if: always()
        run: docker compose -f compose.core.yaml down --volumes
