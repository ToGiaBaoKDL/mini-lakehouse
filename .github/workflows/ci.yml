name: Lakehouse CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true
          version: "0.11.30"
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - run: uv sync --frozen --all-extras --all-groups
      - run: make check

  lakehouse-end-to-end:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-24.04
    needs: quality
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true
          version: "0.11.30"
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - run: uv sync --frozen --extra orchestration --all-groups
      - run: make setup
      - name: Install the AIStor license
        env:
          AISTOR_LICENSE: ${{ secrets.AISTOR_LICENSE }}
        run: |
          test -n "$AISTOR_LICENSE"
          install -m 600 /dev/null minio.license
          printf '%s\n' "$AISTOR_LICENSE" > minio.license
      - name: Start Polaris and Trino dependency chain
        run: make up-core
      - name: Wait for Trino
        run: timeout 240 bash -c 'until curl --fail --silent http://localhost:8080/v1/info; do sleep 3; done'
      - name: Route the Compose S3 endpoint from host-side integration tests
        run: echo "127.0.0.1 object-store" | sudo tee -a /etc/hosts
      - name: Build orchestration image
        run: make build-orchestration
      - name: Exercise landing, curation, dbt, and catalog contracts
        run: LAKEHOUSE_ENVIRONMENT=ci RUN_LAKEHOUSE_INTEGRATION=1 uv run pytest -m integration
      - name: Collect service logs
        if: failure()
        run: make logs
      - name: Stop services
        if: always()
        run: make clean
