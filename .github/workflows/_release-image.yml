name: Release component image

on:
  workflow_call:
    inputs:
      component:
        description: Component release boundary
        required: true
        type: string
      dockerfile:
        description: Component-owned Dockerfile
        required: true
        type: string
      repository:
        description: Environment-qualified ECR repository name
        required: true
        type: string
      build_args:
        description: Optional component-owned Docker build arguments
        required: false
        type: string
        default: ""
      build_context:
        description: Local or immutable remote Docker build context
        required: false
        type: string
        default: .
      external_source_revision:
        description: Optional immutable external source revision used to deduplicate builds
        required: false
        type: string
        default: ""
      external_source_url:
        description: Canonical source URL required with an external source revision
        required: false
        type: string
        default: ""
      platforms:
        description: Comma-separated target platforms
        required: false
        type: string
        default: linux/amd64,linux/arm64
      runner:
        description: GitHub-hosted runner matched to the build workload
        required: false
        type: string
        default: ubuntu-24.04
      build_timeout_minutes:
        description: Image build timeout
        required: false
        type: number
        default: 60

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.build_timeout_minutes }}
    concurrency:
      group: dev-${{ inputs.component }}-publish
      cancel-in-progress: false
      queue: max
    outputs:
      image: ${{ steps.release.outputs.image }}
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-southeast-1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate component boundary
        shell: bash
        env:
          COMPONENT: ${{ inputs.component }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          REPOSITORY: ${{ inputs.repository }}
          BUILD_ARGS: ${{ inputs.build_args }}
          BUILD_CONTEXT: ${{ inputs.build_context }}
          EXTERNAL_SOURCE_REVISION: ${{ inputs.external_source_revision }}
          EXTERNAL_SOURCE_URL: ${{ inputs.external_source_url }}
          PLATFORMS: ${{ inputs.platforms }}
          RUNNER: ${{ inputs.runner }}
        run: |
          set -euo pipefail
          case "$COMPONENT" in
            airflow|arxiv-lens|dbt|lightdash) ;;
            *) exit 2 ;;
          esac
          expected_repository=$(infra/runtime/delivery/image-repository "$COMPONENT")
          [[ "$REPOSITORY" == "$expected_repository" ]]
          [[ -z "$BUILD_ARGS" ]]
          case "$COMPONENT" in
            lightdash)
              [[ "$EXTERNAL_SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
              [[ "$EXTERNAL_SOURCE_URL" == "https://github.com/lightdash/lightdash" ]]
              [[ "$BUILD_CONTEXT" == "$EXTERNAL_SOURCE_URL.git#$EXTERNAL_SOURCE_REVISION" ]]
              [[ "$DOCKERFILE" == "dockerfile" ]]
              [[ "$PLATFORMS" == "linux/arm64" ]]
              [[ "$RUNNER" == "ubuntu-24.04-arm" ]]
              ;;
            *)
              [[ -z "$EXTERNAL_SOURCE_REVISION" ]]
              [[ -z "$EXTERNAL_SOURCE_URL" ]]
              [[ "$BUILD_CONTEXT" == "." ]]
              [[ -f "$DOCKERFILE" ]]
              [[ "$PLATFORMS" == "linux/amd64,linux/arm64" ]]
              [[ "$RUNNER" == "ubuntu-24.04" ]]
              ;;
          esac

      - name: Resolve immutable image source revision
        id: image_source
        shell: bash
        env:
          COMPONENT: ${{ inputs.component }}
          EXTERNAL_SOURCE_REVISION: ${{ inputs.external_source_revision }}
        run: |
          set -euo pipefail
          revision=$EXTERNAL_SOURCE_REVISION
          if [[ -z "$revision" && "$COMPONENT" == "airflow" ]]; then
            revision=$(git log -1 --format=%H -- \
              automation/airflow/pyproject.toml \
              automation/airflow/uv.lock \
              automation/airflow/runtime \
              infra/runtime/identity/install-aws-signing-helper)
          fi
          if [[ -n "$revision" ]]; then
            [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
            echo "tag=source-$revision" >> "$GITHUB_OUTPUT"
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Assume the image publisher role
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_IMAGE_PUBLISHER_ROLE_ARN }}
          role-session-name: github-${{ github.run_id }}

      - name: Authenticate to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      - name: Resolve an existing immutable release
        id: existing
        shell: bash
        env:
          REPOSITORY: ${{ inputs.repository }}
          SOURCE_TAG: ${{ steps.image_source.outputs.tag }}
        run: |
          set -euo pipefail
          response=$(aws ecr batch-get-image \
            --repository-name "$REPOSITORY" \
            --image-ids "imageTag=$GITHUB_SHA" \
            --output json)
          digest=$(jq -r '.images[0].imageId.imageDigest // empty' <<<"$response")
          if [[ -n "$SOURCE_TAG" ]] && [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            source_response=$(aws ecr batch-get-image \
              --repository-name "$REPOSITORY" \
              --image-ids "imageTag=$SOURCE_TAG" \
              --output json)
            source_digest=$(jq -r '.images[0].imageId.imageDigest // empty' <<<"$source_response")
            manifest=$(jq -r '.images[0].imageManifest // empty' <<<"$source_response")
            media_type=$(jq -r '.images[0].imageManifestMediaType // empty' <<<"$source_response")
            if [[ "$source_digest" =~ ^sha256:[0-9a-f]{64}$ && -n "$manifest" ]]; then
              put_image=(
                aws ecr put-image
                --repository-name "$REPOSITORY"
                --image-tag "$GITHUB_SHA"
                --image-manifest "$manifest"
              )
              if [[ -n "$media_type" ]]; then
                put_image+=(--image-manifest-media-type "$media_type")
              fi
              retagged=$("${put_image[@]}")
              digest=$(jq -r '.image.imageId.imageDigest // empty' <<<"$retagged")
              [[ "$digest" == "$source_digest" ]]
            fi
          fi
          if [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.existing.outputs.exists != 'true' && contains(inputs.platforms, ',')
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - if: steps.existing.outputs.exists != 'true'
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build and publish the immutable image
        if: steps.existing.outputs.exists != 'true'
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ${{ inputs.build_context }}
          file: ${{ inputs.dockerfile }}
          build-args: ${{ inputs.build_args }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ inputs.repository }}:${{ github.sha }}
            ${{ steps.image_source.outputs.tag != '' && format('{0}/{1}:{2}', steps.ecr.outputs.registry, inputs.repository, steps.image_source.outputs.tag) || '' }}
          cache-from: type=gha,scope=${{ inputs.component }}
          cache-to: type=gha,mode=max,scope=${{ inputs.component }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.revision=${{ steps.image_source.outputs.revision || github.sha }}
            org.opencontainers.image.source=${{ inputs.external_source_url || format('{0}/{1}', github.server_url, github.repository) }}

      - name: Resolve deployment reference
        id: release
        shell: bash
        env:
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ inputs.repository }}
        run: |
          set -euo pipefail
          digest=${BUILT_DIGEST:-$EXISTING_DIGEST}
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "image=$REGISTRY/$REPOSITORY@$digest" >> "$GITHUB_OUTPUT"

  deploy:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: dev
    concurrency:
      group: dev-${{ inputs.component }}-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      TAILSCALE_CLIENT_ID: ${{ vars.TAILSCALE_CLIENT_ID }}
      TAILSCALE_AUDIENCE: ${{ vars.TAILSCALE_AUDIENCE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Deploy the reviewed release
        uses: ./.github/actions/deploy-component
        with:
          component: ${{ inputs.component }}
          image: ${{ needs.publish.outputs.image }}
