name: Release component image

on:
  workflow_call:
    inputs:
      component:
        description: Component release boundary
        required: true
        type: string
      dockerfile:
        description: Component-owned Dockerfile
        required: true
        type: string
      repository:
        description: Environment-qualified ECR repository name
        required: true
        type: string

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: dev
    concurrency:
      group: dev-${{ inputs.component }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-southeast-1
      TAILSCALE_CLIENT_ID: ${{ vars.TAILSCALE_CLIENT_ID }}
      TAILSCALE_AUDIENCE: ${{ vars.TAILSCALE_AUDIENCE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate component boundary
        shell: bash
        env:
          COMPONENT: ${{ inputs.component }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          REPOSITORY: ${{ inputs.repository }}
        run: |
          set -euo pipefail
          case "$COMPONENT" in
            airflow|arxiv-inspector|dbt-task|ocr-worker) ;;
            *) exit 2 ;;
          esac
          [[ "$REPOSITORY" == "tgbao-dev-$COMPONENT" ]]
          [[ -f "$DOCKERFILE" ]]

      - name: Assume the image publisher role
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_IMAGE_PUBLISHER_ROLE_ARN }}
          role-session-name: github-${{ github.run_id }}

      - name: Authenticate to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      - name: Resolve an existing immutable release
        id: existing
        shell: bash
        env:
          REPOSITORY: ${{ inputs.repository }}
        run: |
          set -euo pipefail
          response=$(aws ecr batch-get-image \
            --repository-name "$REPOSITORY" \
            --image-ids "imageTag=$GITHUB_SHA" \
            --output json)
          digest=$(jq -r '.images[0].imageId.imageDigest // empty' <<<"$response")
          if [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.existing.outputs.exists != 'true'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - if: steps.existing.outputs.exists != 'true'
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build and publish the immutable image
        if: steps.existing.outputs.exists != 'true'
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ inputs.repository }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.component }}
          cache-to: type=gha,mode=max,scope=${{ inputs.component }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Resolve deployment reference
        id: release
        shell: bash
        env:
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ inputs.repository }}
        run: |
          set -euo pipefail
          digest=${BUILT_DIGEST:-$EXISTING_DIGEST}
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "image=$REGISTRY/$REPOSITORY@$digest" >> "$GITHUB_OUTPUT"

      - name: Deploy the reviewed release
        uses: ./.github/actions/deploy-component
        with:
          component: ${{ inputs.component }}
          image: ${{ steps.release.outputs.image }}
