name: Release EMR jobs

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-emr-jobs.yml
      - lakehouse/catalog/**
      - lakehouse/contracts/**
      - lakehouse/emr/**
  workflow_dispatch:

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: dev-emr-jobs-publish
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-southeast-1
      EMR_ARTIFACTS_URI: ${{ vars.EMR_ARTIFACTS_URI }}
      EMR_CODE_PARAMETER_NAME: ${{ vars.EMR_CODE_PARAMETER_NAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assume the EMR publisher role
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_EMR_PUBLISHER_ROLE_ARN }}
          role-session-name: github-${{ github.run_id }}
      - name: Package EMR jobs
        run: lakehouse/emr/release/package
      - name: Publish immutable EMR artifacts
        run: >-
          lakehouse/emr/release/publish dist/emr "$EMR_ARTIFACTS_URI"
          "$GITHUB_SHA" "$EMR_CODE_PARAMETER_NAME"
