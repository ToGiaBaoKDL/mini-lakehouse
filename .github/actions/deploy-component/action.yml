name: Deploy component
description: Deploy one reviewed container digest to the private dev services host

inputs:
  component:
    description: Component release boundary
    required: true
  image:
    description: Immutable container image reference by digest
    required: true
  source_root:
    description: Checkout containing the component-owned deployment bundle
    required: false
    default: .

runs:
  using: composite
  steps:
    - uses: ./.github/actions/reconcile-services-host

    - name: Deploy exact component release
      shell: bash
      env:
        COMPONENT: ${{ inputs.component }}
        IMAGE: ${{ inputs.image }}
        SOURCE_ROOT: ${{ inputs.source_root }}
      run: |
        set -euo pipefail
        bundle=(infra/runtime/delivery)
        case "$COMPONENT" in
          airflow)
            bundle+=(infra/runtime/postgres automation/airflow/deploy)
            ;;
          arxiv-lens)
            bundle+=(arxiv-lens/deploy)
            ;;
          cloudflare)
            bundle+=(infra/runtime/cloudflare)
            ;;
          lightdash)
            bundle+=(infra/runtime/postgres analytics/lightdash/deploy)
            ;;
          dbt)
            bundle+=(analytics/dbt-project/deploy)
            ;;
          t0-trading)
            bundle+=(t0-trading/deploy)
            ;;
          *) exit 2 ;;
        esac
        case "$COMPONENT" in
          cloudflare)
            [[ "$IMAGE" =~ ^cloudflare/cloudflared:[0-9]{4}\.[0-9]+\.[0-9]+@sha256:[0-9a-f]{64}$ ]]
            ;;
          *)
            repository=$("$SOURCE_ROOT/infra/runtime/delivery/image-repository" "$COMPONENT")
            [[ "$IMAGE" =~ ^[0-9]{12}\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com/${repository}@sha256:[0-9a-f]{64}$ ]]
            ;;
        esac
        [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
        [[ "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
        [[ -d "$SOURCE_ROOT" ]]

        for path in "${bundle[@]}"; do
          [[ -e "$SOURCE_ROOT/$path" ]]
        done

        remote_dir="/tmp/lakehouse-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        remote_command="set -eu; work_dir='$remote_dir'; trap 'rm -rf \"\$work_dir\"' EXIT; install -d -m 0700 \"\$work_dir\"; tar -C \"\$work_dir\" -xf -; \"\$work_dir/infra/runtime/delivery/deploy-component\" '$COMPONENT' '$IMAGE'"
        tar -C "$SOURCE_ROOT" -cf - "${bundle[@]}" \
          | tailscale ssh ubuntu@tgbao-dev-services "$remote_command"
