[project]
name = "arxiv-inspector"
version = "0.1.0"
description = "Read-only Streamlit application for inspecting ArXiv OCR artifacts."
requires-python = ">=3.12,<3.13"
dependencies = [
    "awswrangler==3.17.0",
    "boto3>=1.42,<2",
    "document-ocr",
    "lakehouse",
    "loguru==0.7.3",
    "pandas>=2.2,<4",
    "pydantic>=2.12,<3",
    "streamlit>=1.60,<1.61",
]

[tool.uv]
package = false

[tool.uv.sources]
document-ocr = { workspace = true }
lakehouse = { workspace = true }
