$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:enterprise-data-platform:publication:1
title: Enterprise data product publication record
type: object
additionalProperties: false
required:
  - spec_version
  - publication_id
  - product
  - logical_interval
  - status
  - inputs
  - contract_version
  - artifact
  - publisher
  - quality_results
  - started_at
  - completed_at
properties:
  spec_version:
    const: 1
  publication_id:
    type: string
    pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{7,191}$
  product:
    type: string
    pattern: ^[a-z][a-z0-9_]{2,127}$
  logical_interval:
    type: object
    additionalProperties: false
    required: [start, end]
    properties:
      start: {$ref: "#/$defs/timestamp"}
      end: {$ref: "#/$defs/timestamp"}
  status:
    enum: [certified, published, rejected, quarantined]
  inputs:
    type: array
    minItems: 1
    items: {$ref: "#/$defs/data_reference"}
  output:
    $ref: "#/$defs/data_reference"
  contract_version:
    type: string
    minLength: 1
  artifact:
    type: object
    additionalProperties: false
    required: [repository, revision]
    properties:
      repository:
        type: string
        minLength: 3
      revision:
        type: string
        minLength: 7
      image_digest:
        type: string
        pattern: ^sha256:[a-f0-9]{64}$
  publisher:
    type: object
    additionalProperties: false
    required: [identity, execution_id]
    properties:
      identity:
        type: string
        minLength: 3
      execution_id:
        type: string
        minLength: 3
  quality_results:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [gate, outcome]
      properties:
        gate:
          type: string
          minLength: 3
        outcome:
          enum: [passed, warned, failed]
        observed:
          type: [number, integer, string, boolean, "null"]
        expected:
          type: [number, integer, string, boolean, "null"]
        detail:
          type: string
  started_at:
    $ref: "#/$defs/timestamp"
  completed_at:
    $ref: "#/$defs/timestamp"
  failure:
    type: object
    additionalProperties: false
    required: [code, message]
    properties:
      code:
        type: string
        pattern: ^[a-z][a-z0-9_]{2,127}$
      message:
        type: string
        minLength: 5
      retryable:
        type: boolean
allOf:
  - if:
      properties:
        status: {enum: [certified, published]}
      required: [status]
    then:
      required: [output]
  - if:
      properties:
        status: {enum: [rejected, quarantined]}
      required: [status]
    then:
      required: [failure]
$defs:
  timestamp:
    type: string
    format: date-time
  data_reference:
    type: object
    additionalProperties: false
    required: [kind, identifier, version]
    properties:
      kind:
        enum: [source_watermark, raw_manifest, object_manifest, table_snapshot, stream_position]
      identifier:
        type: string
        minLength: 3
      version:
        type: string
        minLength: 1
      checksum:
        type: string
        pattern: ^sha256:[a-f0-9]{64}$
      record_count:
        type: integer
        minimum: 0
      byte_count:
        type: integer
        minimum: 0
