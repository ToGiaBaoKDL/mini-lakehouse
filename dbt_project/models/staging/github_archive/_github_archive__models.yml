version: 2

models:
  - name: stg_github_archive__events
    description: A typed, one-to-one projection of the GitHub Archive landing table.
    columns:
      - name: event_id
        data_tests: [not_null]
      - name: event_type
        data_tests: [not_null]
      - name: occurred_at
        data_tests: [not_null]
      - name: event_date_utc
        description: Calendar date derived explicitly in UTC.
        data_tests: [not_null]
