version: 2

sources:
  - name: github_archive
    description: Append-only GitHub Archive events ingested hourly by the Data Platform team.
    database: "{{ env_var('DBT_CATALOG', 'prod') }}"
    schema: landing.api.github_archive
    config:
      loaded_at_field: source_hour
      freshness:
        warn_after: {count: 2, period: hour}
        error_after: {count: 6, period: hour}
        filter: source_hour >= current_timestamp - interval '1' day
    meta:
      owner: data-platform
      transport: api
      physical_bucket: landing
    tables:
      - name: events_raw
        description: One row per raw public GitHub event, with the original JSON preserved.
        columns:
          - name: event_id
            data_tests: [not_null]
          - name: source_hour
            data_tests: [not_null]
          - name: ingested_at
            data_tests: [not_null]
