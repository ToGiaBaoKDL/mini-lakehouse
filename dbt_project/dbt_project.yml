# dbt_project.yml
# Cấu hình dbt project cho Mini Lakehouse (ClickHouse Engine)

name: 'github_lakehouse'
version: '1.0.0'
config-version: 2

# Profile liên kết với profiles.yml
profile: 'github_lakehouse'

# Di chuyển cấu hình config từ profiles.yml sang flags của dbt_project.yml để tránh cảnh báo deprecation
flags:
  send_anonymous_usage_stats: False

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  github_lakehouse:
    # 1. Staging layer: Tạo view trong Trino
    staging:
      +materialized: view
      +schema: landing.staging

    # 2. Curated layer: Vật chất hóa thành bảng Iceberg
    curated:
      +materialized: table
      +schema: curated.engineering

    # 3. Analytics layer: Vật chất hóa thành bảng Iceberg
    analytics:
      +materialized: table
      +schema: analytics.engineering
