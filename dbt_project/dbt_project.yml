name: "mini_lakehouse"
version: "0.2.0"
config-version: 2
profile: "mini_lakehouse"

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

flags:
  send_anonymous_usage_stats: false
  require_certificate_validation: true

models:
  mini_lakehouse:
    +persist_docs:
      relation: true
      columns: true

    staging:
      +materialized: view
      +schema: curated.github
      +group: data_platform
      +access: private
      +tags: ["staging", "github_archive"]

    intermediate:
      +materialized: ephemeral
      +group: data_platform
      +access: private
      +tags: ["intermediate", "github"]

    marts:
      core:
        +materialized: table
        +on_table_exists: replace
        +schema: curated.github
        +group: data_platform
        +access: public
        +tags: ["curated", "github"]
      engineering:
        +materialized: incremental
        +incremental_strategy: merge
        +on_schema_change: sync_all_columns
        +schema: analytics.engineering
        +group: engineering_analytics
        +access: public
        +tags: ["mart", "engineering"]
