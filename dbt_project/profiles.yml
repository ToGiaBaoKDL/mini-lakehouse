mini_lakehouse:
  target: "{{ env_var('DBT_TARGET', 'local') }}"
  outputs:
    local:
      type: trino
      method: none
      host: "{{ env_var('TRINO_HOST', 'localhost') }}"
      port: "{{ env_var('TRINO_PORT', '8080') | int }}"
      user: "{{ env_var('TRINO_USER', 'lakehouse') }}"
      catalog: "{{ env_var('DBT_CATALOG', 'prod') }}"
      schema: curated.github
      http_scheme: "{{ env_var('TRINO_HTTP_SCHEME', 'http') }}"
      cert: true
      threads: "{{ env_var('DBT_THREADS', '4') | int }}"
      timezone: UTC
      retries: 2
      prepared_statements_enabled: true
      session_properties:
        query_max_run_time: 30m
