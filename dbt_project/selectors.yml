selectors:
  - name: github_archive_freshness
    description: GitHub Archive landing sources with a configured freshness SLA.
    definition:
      method: source
      value: github_archive

  - name: engineering_pipeline
    description: Engineering marts and every upstream model/source required to build them.
    definition:
      method: fqn
      value: mini_lakehouse.marts.engineering
      parents: true

  - name: ci_modified
    description: State-modified nodes and their downstream dependants for CI.
    definition:
      method: state
      value: modified
      children: true
