version: 1
name: arxiv_glm_ocr
owner: data-platform
contact:
  name: Data Platform
  email: bao.to@timo.vn
description: GLM-OCR processing of ArXiv PDFs on a private Kaggle Script.
source: arxiv
curated_product: arxiv
adapter: glm_ocr
adapter_version: 1.0.0
output_schema_version: 1.1.0
artifact_prefix: arxiv/ocr/papers

model:
  repository: zai-org/GLM-OCR
  revision: ca5d8b3e287e52589e37c28385d9655ee4372f9d

layout_model:
  repository: PaddlePaddle/PP-DocLayoutV3_safetensors
  revision: 97d101e6db2642e162a1d05392d1b0231c91033e

batch:
  max_documents: 2
  max_pdf_bytes: 104857600
  max_pages_per_document: 500
  max_output_bytes: 1073741824

inference:
  api_port: 8080
  dtype: float16
  max_model_len: 16384
  gpu_memory_utilization: 0.80
  speculative_tokens: 3
  enforce_eager: true
  max_num_seqs: 4
  max_workers: 4
  request_timeout_seconds: 600
  layout_device: cpu

runner:
  provider: kaggle
  kernel_name: mini-lakehouse-arxiv-glm-ocr
  runner_dataset_name: mini-lakehouse-arxiv-glm-ocr-runner
  model_resources:
    model:
      name: mini-lakehouse-glm-ocr
      framework: transformers
      variation: safetensors
      license_name: MIT
    layout_model:
      name: mini-lakehouse-pp-doclayout-v3
      framework: transformers
      variation: safetensors
      license_name: Apache 2.0
  accelerator: NvidiaTeslaT4
  timeout_seconds: 14400
  minimum_gpu_quota_minutes: 60

retry:
  max_document_attempts: 3
