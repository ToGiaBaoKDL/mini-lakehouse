version: 1
name: expire-snapshots
namespace: [curated]
owner: data-platform
policy_type: system.snapshot-expiry
description: Expire Iceberg snapshots older than seven days.

content:
  version: "2025-02-03"
  enable: true
  config:
    max_snapshot_age_days: 7

targets:
  - type: namespace
    path: [landing]
  - type: namespace
    path: [curated]
  - type: namespace
    path: [analytics]
