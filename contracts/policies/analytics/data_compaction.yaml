version: 1
name: mlh-analytics-engineering-compact-data-files
namespace: [analytics]
owner: analytics-platform
policy_type: system.data-compaction
description: Compact only recent Engineering mart partitions.
content:
  version: "2025-02-03"
  enable: true
  config:
    target_file_size_bytes: 134217728
execution:
  partition_field: activity_date
  partition_type: date
  lookback_days: 30
targets:
  - type: namespace
    path: [analytics, engineering]
