version: 1
name: compact-data-files
namespace: [curated]
owner: data-platform
policy_type: system.data-compaction
description: Compact small Iceberg data files to a 128 MiB target.

content:
  version: "2025-02-03"
  enable: true
  config:
    target_file_size_bytes: 134217728

targets:
  - type: namespace
    path: [landing]
  - type: namespace
    path: [curated]
  - type: namespace
    path: [analytics]
