version: 1
name: mlh-curated-compact-metadata
namespace: [curated]
owner: data-platform
policy_type: system.metadata-compaction
description: Rewrite curated manifests to keep planning efficient.
content:
  version: "2025-02-03"
  enable: true
retention:
  delete_after_commit: true
  previous_versions_max: 30
targets:
  - type: namespace
    path: [curated]
