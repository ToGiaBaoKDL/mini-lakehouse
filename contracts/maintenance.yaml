version: 1

tiers:
  - tier: landing
    owner: data-platform
    metadata_retention:
      delete_after_commit: true
      previous_versions_max: 30
    snapshot_max_age_days: 30
    orphan_file_max_age_days: 30
    optimizations:
      - name: github-archive
        target:
          type: table-like
          path: [landing, github_archive_events_raw]
        partition_field: source_hour
        lookback_days: 2
        target_file_size_bytes: 134217728

  - tier: curated
    owner: data-platform
    metadata_retention:
      delete_after_commit: true
      previous_versions_max: 30
    snapshot_max_age_days: 14
    orphan_file_max_age_days: 30
    optimizations:
      - name: github-events
        target:
          type: table-like
          path: [curated, github, events]
        partition_field: event_date_utc
        lookback_days: 7
        target_file_size_bytes: 134217728

  - tier: analytics
    owner: analytics-platform
    metadata_retention:
      delete_after_commit: true
      previous_versions_max: 30
    snapshot_max_age_days: 14
    orphan_file_max_age_days: 30
    optimizations:
      - name: engineering
        target:
          type: namespace
          path: [analytics, engineering]
        partition_field: activity_date
        lookback_days: 30
        target_file_size_bytes: 134217728
