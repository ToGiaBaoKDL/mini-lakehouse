version: 1
name: github_archive
source_type: api
owner: data-platform
description: Public GitHub events published as immutable hourly archives.
landing_namespace: [landing]
raw_object_prefix: api/github_archive/raw

checkpoint:
  kind: hourly_partition
  field: source_hour

tables:
  - key: events_raw
    name: github_archive_events_raw
    location_prefix: api/github_archive/events_raw
    schema_contract: github_archive.events_raw.v1
    partitioning:
      - field: source_hour
        transform: hour
    write_mode: checkpoint_overwrite
