version: 1
name: github_archive
database: landing_github_archive
source_type: api
owner: data-platform
contact:
  name: Data Platform
  email: bao.to@timo.vn
description: Public GitHub events published as immutable hourly archives.

tables:
  - key: events_raw
    name: events_raw
    description: Parsed immutable GitHub Archive events with stable source lineage.
    primary_key: [event_id]
    columns:
      - {field_id: 1, name: event_id, data_type: string, required: true, description: Stable GitHub event identifier.}
      - {field_id: 2, name: event_type, data_type: string, required: true, description: GitHub event type.}
      - {field_id: 3, name: actor_id, data_type: long, required: false, description: GitHub actor identifier when present.}
      - {field_id: 4, name: actor_login, data_type: string, required: false, description: Actor login observed in the archive.}
      - {field_id: 5, name: repository_id, data_type: long, required: false, description: GitHub repository identifier when present.}
      - {field_id: 6, name: repository_name, data_type: string, required: false, description: Repository full name observed in the archive.}
      - {field_id: 7, name: payload_json, data_type: string, required: true, description: Canonical JSON serialization of the event payload.}
      - {field_id: 8, name: is_public, data_type: boolean, required: true, description: Whether GitHub marked the event public.}
      - {field_id: 9, name: occurred_at, data_type: timestamptz, required: true, description: Event occurrence timestamp.}
      - {field_id: 10, name: source_file, data_type: string, required: true, description: Immutable GitHub Archive filename.}
      - {field_id: 11, name: source_hour, data_type: timestamptz, required: true, description: UTC archive hour.}
      - {field_id: 12, name: ingested_at, data_type: timestamptz, required: true, description: Landing ingestion timestamp.}
      - {field_id: 13, name: raw_event_json, data_type: string, required: true, description: Original immutable event JSON.}
    partitioning:
      - field_id: 1000
        field: source_hour
        transform: hour
        name: archive_hour
