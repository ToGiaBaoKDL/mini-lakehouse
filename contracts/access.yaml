version: 1

service_identities:
  - name: prefect_ingestion
    catalog_roles: [prefect_ingestion]

  - name: trino_engine
    catalog_roles: [trino_engine]

catalog_roles:
  - name: prefect_ingestion
    grants:
      - type: catalog
        privileges:
          - CATALOG_READ_PROPERTIES
          - NAMESPACE_LIST
          - TABLE_LIST
          - TABLE_READ_PROPERTIES
          - POLICY_READ
      - type: namespace
        namespace: [landing]
        privileges:
          - NAMESPACE_READ_PROPERTIES
          - TABLE_LIST
          - TABLE_READ_PROPERTIES
          - TABLE_READ_DATA
          - TABLE_WRITE_DATA
          - TABLE_ADD_SNAPSHOT
          - TABLE_SET_SNAPSHOT_REF
      - type: namespace
        namespace: [curated]
        privileges:
          - NAMESPACE_READ_PROPERTIES
          - TABLE_LIST
          - TABLE_READ_PROPERTIES
          - TABLE_READ_DATA
          - TABLE_WRITE_DATA
          - TABLE_ADD_SNAPSHOT
          - TABLE_SET_SNAPSHOT_REF

  - name: trino_engine
    grants:
      - type: catalog
        privileges: [CATALOG_MANAGE_CONTENT]
