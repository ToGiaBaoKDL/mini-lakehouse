    x: 0
    y: 3
  - h: 8
    properties:
      content: |
        ## How to read this dashboard

        - **1 bp = 0.01%.** Return and spread charts use basis points.
        - Markouts are equal-weighted over distinct eligible outcome paths, so feature-window joins do not duplicate observations.
        - BUY and SELL are conditional executable Top-3 book simulations before fees and taxes—not strategy signals or realized P&L.
        - A negative two-sided mean commonly reflects crossing the spread at entry and horizon. Use the symbol, action and horizon filters to test a specific hypothesis.
      title: Metric contract
    type: markdown
    w: 12
    x: 24
    y: 3
