contentType: dashboard
config:
  dateZoomGranularities:
    - Day
    - Week
    - Month
  defaultDateZoomGranularity: Day
  isAddFilterDisabled: false
  isDateZoomDisabled: false
description: Certified shadow decisions, abstentions and conditional gross markouts before notification or execution.
filters:
  dimensions:
    - disabled: false
      label: Decision window
      operator: inThePast
      required: false
      settings:
        completed: false
        unitOfTime: days
      target:
        fieldId: fct_trading_shadow_decision_outcomes_decision_at
        tableName: fct_trading_shadow_decision_outcomes
      values: [30]
    - disabled: true
      label: Symbol
      operator: equals
      required: false
      target:
        fieldId: fct_trading_shadow_decision_outcomes_symbol
        tableName: fct_trading_shadow_decision_outcomes
      values: []
    - disabled: true
      label: Strategy
      operator: equals
      required: false
      target:
        fieldId: fct_trading_shadow_decision_outcomes_strategy
        tableName: fct_trading_shadow_decision_outcomes
      values: []
    - disabled: true
      label: Action
      operator: equals
      required: false
      target:
        fieldId: fct_trading_shadow_decision_outcomes_action
        tableName: fct_trading_shadow_decision_outcomes
      values: []
    - disabled: true
      label: Horizon (seconds)
      operator: equals
      required: false
      target:
        fieldId: fct_trading_shadow_decision_outcomes_horizon_seconds
        tableName: fct_trading_shadow_decision_outcomes
      values: []
name: Trading shadow decisions
slug: trading-shadow-decisions
spaceSlug: trading
tabs: []
tiles:
  - h: 3
    properties:
      chartName: Shadow decisions
      chartSlug: trading-shadow-decision-count
      hideTitle: false
      title: Shadow decisions
    type: saved_chart
    w: 7
    x: 0
    y: 0
  - h: 3
    properties:
      chartName: Action rate
      chartSlug: trading-shadow-action-rate
      hideTitle: false
      title: Action rate
    type: saved_chart
    w: 7
    x: 7
    y: 0
  - h: 3
    properties:
      chartName: Eligible outcome coverage
      chartSlug: trading-shadow-outcome-coverage
      hideTitle: false
      title: Eligible outcome coverage
    type: saved_chart
    w: 7
    x: 14
    y: 0
  - h: 3
    properties:
      chartName: Positive gross markouts
      chartSlug: trading-shadow-positive-markout-rate
      hideTitle: false
      title: Positive gross markouts
    type: saved_chart
    w: 7
    x: 21
    y: 0
  - h: 3
    properties:
      chartName: Mean eligible gross markout
      chartSlug: trading-shadow-average-gross-return
      hideTitle: false
      title: Mean eligible gross markout
    type: saved_chart
    w: 8
    x: 28
    y: 0
  - h: 8
    properties:
      chartName: Daily action rate
      chartSlug: trading-shadow-daily-action-rate
      hideTitle: false
      title: Daily action rate
    type: saved_chart
    w: 24
    x: 0
    y: 3
  - h: 8
    properties:
      content: |
        ## Metric contract

        - Decisions are deterministic replay from certified captures; they are not sent notifications or broker orders.
        - Action rate is BUY/SELL divided by all BUY/SELL/ABSTAIN decisions.
        - Outcome coverage is measured only over actionable decisions.
        - Return and hit-rate metrics include only eligible conditional markouts and remain gross of fees and taxes.
        - Thresholds are provisional until purged walk-forward evaluation has enough sessions.
      title: How to read this dashboard
    type: markdown
    w: 12
    x: 24
    y: 3
  - h: 7
    properties:
      chartName: Decisions by action
      chartSlug: trading-shadow-decisions-by-action
      hideTitle: false
      title: Decisions by action
    type: saved_chart
    w: 12
    x: 0
    y: 11
  - h: 7
    properties:
      chartName: Mean gross markout by strategy
      chartSlug: trading-shadow-return-by-strategy
      hideTitle: false
      title: Mean gross markout by strategy
    type: saved_chart
    w: 12
    x: 12
    y: 11
  - h: 7
    properties:
      chartName: Abstentions by reason
      chartSlug: trading-shadow-abstentions-by-reason
      hideTitle: false
      title: Abstentions by reason
    type: saved_chart
    w: 12
    x: 24
    y: 11
version: 1
