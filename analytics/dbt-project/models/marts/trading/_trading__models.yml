version: 2

models:
  - name: fct_trading_backtest_observations
    description: Leakage-safe eligible feature windows and conditional execution outcomes from currently certified market days.
    config:
      meta:
        default_time_dimension:
          field: decision_at
          interval: DAY
        group_label: Trading research
        label: Backtest observations
        metrics:
          positive_gross_markout_rate_pct:
            description: Share of distinct eligible conditional outcome paths with a gross markout above zero; before fees and taxes.
            label: Positive gross markouts (%)
            round: 1
            sql: 100.0 * COUNT(DISTINCT CASE WHEN ${TABLE}.gross_return_bps > 0 THEN ${TABLE}.outcome_sha256 END) / NULLIF(COUNT(DISTINCT ${TABLE}.outcome_sha256), 0)
            type: number
        primary_key: [outcome_configuration_sha256, feature_snapshot_sha256, action, horizon_seconds, window_seconds]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [outcome_configuration_sha256, feature_snapshot_sha256, action, horizon_seconds, window_seconds]
    columns:
      - {name: trade_date, description: Exchange-local date of the certified market session., data_type: date, data_tests: [not_null]}
      - name: symbol
        description: Normalized security symbol.
        data_type: varchar
        data_tests: [not_null]
        config:
          meta:
            dimension:
              label: Symbol
              type: string
      - name: decision_at
        description: UTC point-in-time feature evaluation boundary.
        data_type: timestamp
        data_tests: [not_null]
        config:
          meta:
            dimension:
              label: Decision time
              time_intervals: [MINUTE, HOUR, DAY, WEEK, MONTH]
              type: timestamp
      - {name: market_session, description: Exchange session containing the decision., data_type: varchar, data_tests: [not_null]}
      - name: action
        description: Conditional BUY or SELL action evaluated by the simulator.
        data_type: varchar
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [BUY, SELL]
        config:
          meta:
            dimension:
              label: Action
              type: string
      - name: horizon_seconds
        description: Markout horizon measured from decision time.
        data_type: bigint
        data_tests: [not_null]
        config:
          meta:
            dimension:
              label: Horizon (seconds)
              type: number
      - name: window_seconds
        description: Trailing feature-window duration.
        data_type: bigint
        data_tests: [not_null]
        config:
          meta:
            dimension:
              label: Feature window (seconds)
              type: number
      - {name: order_quantity, description: Shares simulated through the visible Top-3 book., data_type: bigint, data_tests: [not_null]}
      - {name: feature_version, description: Deterministic feature formula version., data_type: varchar, data_tests: [not_null]}
      - {name: configuration_version, description: Effective market and feature configuration version., data_type: varchar, data_tests: [not_null]}
      - {name: configuration_sha256, description: Exact effective market and feature configuration fingerprint., data_type: varchar, data_tests: [not_null]}
      - {name: outcome_version, description: Deterministic execution and markout policy version., data_type: varchar, data_tests: [not_null]}
      - {name: outcome_configuration_sha256, description: Exact outcome policy fingerprint., data_type: varchar, data_tests: [not_null]}
      - {name: stream_session_id, description: Source transport segment visible at the decision instant., data_type: varchar, data_tests: [not_null]}
      - {name: evidence_sha256, description: Fingerprint of the certified manifest evidence set., data_type: varchar, data_tests: [not_null]}
      - {name: manifest_sha256, description: Selected immutable manifest-set fingerprint., data_type: varchar, data_tests: [not_null]}
      - {name: feature_snapshot_sha256, description: Canonical parent feature snapshot fingerprint., data_type: varchar, data_tests: [not_null]}
      - name: outcome_sha256
        description: Canonical complete outcome label fingerprint.
        data_type: varchar
        data_tests: [not_null]
        config:
          meta:
            metrics:
              outcome_count:
                description: Distinct simulated execution and markout paths.
                label: Outcome paths
                type: count_distinct
      - {name: last_receive_sequence, description: Latest callback sequence visible at decision time., data_type: bigint, data_tests: [not_null]}
      - {name: entry_receive_sequence, description: Capture sequence used for the simulated entry., data_type: bigint, data_tests: [not_null]}
      - {name: horizon_receive_sequence, description: Capture sequence used for the simulated exit markout., data_type: bigint, data_tests: [not_null]}
      - {name: feature_available_at, description: Earliest UTC instant at which the feature was available., data_type: timestamp, data_tests: [not_null]}
      - {name: entry_at, description: UTC simulated entry instant after configured latency., data_type: timestamp, data_tests: [not_null]}
      - {name: horizon_at, description: UTC markout instant., data_type: timestamp, data_tests: [not_null]}
      - {name: entry_quote_received_at, description: Receipt time of the quote used for entry., data_type: timestamp, data_tests: [not_null]}
      - {name: horizon_quote_received_at, description: Receipt time of the quote used for exit markout., data_type: timestamp, data_tests: [not_null]}
      - {name: trade_age_seconds, description: Receipt-time age of the latest trade at decision time., data_type: "decimal(18,6)"}
      - {name: quote_age_seconds, description: Receipt-time age of the latest complete quote at decision time., data_type: "decimal(18,6)"}
      - {name: mid_price, description: Best bid and ask midpoint in VND., data_type: "decimal(24,8)"}
      - {name: microprice, description: Opposite-depth-weighted level-one microprice in VND., data_type: "decimal(24,8)"}
      - {name: microprice_deviation_bps, description: Microprice deviation from midpoint in basis points., data_type: "decimal(18,4)"}
      - {name: spread, description: Best ask minus best bid in VND., data_type: "decimal(18,0)"}
      - name: spread_bps
        description: Quoted spread relative to midpoint in basis points.
        data_type: "decimal(18,4)"
        config:
          meta:
            metrics:
              average_spread_bps:
                description: Average quoted spread across distinct eligible feature snapshots.
                distinct_keys: feature_snapshot_sha256
                label: Mean quoted spread (bps)
                round: 2
                type: average_distinct
      - {name: bid_depth, description: Visible configured-depth bid quantity., data_type: bigint}
      - {name: ask_depth, description: Visible configured-depth ask quantity., data_type: bigint}
      - {name: level_one_imbalance, description: Normalized best-level bid versus ask depth imbalance., data_type: "decimal(10,8)"}
      - {name: depth_imbalance, description: Normalized configured-depth bid versus ask imbalance., data_type: "decimal(10,8)"}
      - {name: trade_count, description: Executable trades in the trailing window., data_type: bigint, data_tests: [not_null]}
      - {name: quote_change_count, description: Complete quote transitions in the trailing window., data_type: bigint, data_tests: [not_null]}
      - {name: trade_volume, description: Matched share quantity in the trailing window., data_type: bigint, data_tests: [not_null]}
      - {name: signed_trade_volume, description: Buyer-aggressed minus seller-aggressed window quantity., data_type: bigint, data_tests: [not_null]}
      - {name: trade_volume_per_second, description: Matched quantity normalized by window duration., data_type: "decimal(24,8)"}
      - {name: trade_volume_imbalance, description: Signed divided by total matched window volume., data_type: "decimal(10,8)"}
      - {name: level_one_order_flow_imbalance, description: Best-level order-flow imbalance across quote transitions., data_type: bigint, data_tests: [not_null]}
      - {name: price_return_bps, description: First-to-last matched-price return in the window., data_type: "decimal(18,4)"}
      - {name: realized_volatility_bps, description: Root sum of squared adjacent trade returns., data_type: "decimal(18,4)"}
      - {name: vwap, description: Window matched-price VWAP in VND., data_type: "decimal(24,8)"}
      - {name: last_price_to_vwap_bps, description: Last matched-price deviation from window VWAP., data_type: "decimal(18,4)"}
      - {name: entry_vwap, description: Simulated visible-book entry VWAP in VND., data_type: "decimal(24,8)", data_tests: [not_null]}
      - {name: horizon_vwap, description: Simulated opposing-side horizon VWAP in VND., data_type: "decimal(24,8)", data_tests: [not_null]}
      - name: gross_return_bps
        description: Gross directional markout before fees and taxes in basis points.
        data_type: "decimal(18,4)"
        data_tests: [not_null]
        config:
          meta:
            metrics:
              average_gross_return_bps:
                description: Equal-weight mean gross markout across distinct eligible conditional BUY and SELL paths; before fees and taxes, not strategy P&L.
                distinct_keys: outcome_sha256
                label: Mean gross markout (bps)
                round: 2
                type: average_distinct
      - {name: certification_evaluated_at, description: UTC time the current evidence set was certified., data_type: timestamp, data_tests: [not_null]}
      - {name: feature_processed_at, description: UTC durable feature materialization time., data_type: timestamp, data_tests: [not_null]}
      - {name: outcome_processed_at, description: UTC durable outcome materialization time., data_type: timestamp, data_tests: [not_null]}

  - name: fct_trading_shadow_decision_outcomes
    description: One deterministic shadow decision with its matching conditional outcome when actionable, restricted to currently certified market days.
    config:
      meta:
        default_time_dimension:
          field: decision_at
          interval: DAY
        label: Shadow decision outcomes
        metrics:
          abstain_decision_count:
            description: Distinct deterministic decisions that abstained before notification or execution.
            label: Abstentions
            sql: |
              COUNT(DISTINCT CASE
                  WHEN NOT ${TABLE}.is_actionable THEN ${TABLE}.decision_sha256
              END)
            type: number
          action_rate_pct:
            description: Share of distinct deterministic decisions that emitted BUY or SELL rather than ABSTAIN.
            label: Action rate (%)
            round: 1
            sql: |
              100.0
              * COUNT(DISTINCT CASE
                  WHEN ${TABLE}.is_actionable THEN ${TABLE}.decision_sha256
              END)
              / NULLIF(COUNT(DISTINCT ${TABLE}.decision_sha256), 0)
            type: number
          actionable_decision_count:
            description: Distinct deterministic BUY and SELL decisions.
            label: Actionable decisions
            sql: |
              COUNT(DISTINCT CASE
                  WHEN ${TABLE}.is_actionable THEN ${TABLE}.decision_sha256
              END)
            type: number
          eligible_outcome_coverage_pct:
            description: Share of actionable decisions with a fully eligible conditional execution markout.
            label: Eligible outcome coverage (%)
            round: 1
            sql: |
              100.0
              * COUNT(DISTINCT CASE
                  WHEN ${TABLE}.is_actionable AND ${TABLE}.has_eligible_outcome
                      THEN ${TABLE}.decision_sha256
              END)
              / NULLIF(COUNT(DISTINCT CASE
                  WHEN ${TABLE}.is_actionable THEN ${TABLE}.decision_sha256
              END), 0)
            type: number
          positive_gross_markout_rate_pct:
            description: Share of eligible actionable decisions whose gross conditional markout is above zero before fees and taxes.
            label: Positive gross markouts (%)
            round: 1
            sql: |
              100.0
              * COUNT(DISTINCT CASE
                  WHEN ${TABLE}.has_positive_gross_markout THEN ${TABLE}.decision_sha256
              END)
              / NULLIF(COUNT(DISTINCT CASE
                  WHEN ${TABLE}.has_eligible_outcome THEN ${TABLE}.decision_sha256
              END), 0)
            type: number
        primary_key: [decision_configuration_sha256, feature_snapshot_sha256, strategy]
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: (is_actionable and has_outcome_label) or (not is_actionable and not has_outcome_label)
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [decision_configuration_sha256, feature_snapshot_sha256, strategy]
    columns:
      - {name: trade_date, description: Exchange-local date of the certified market session., data_type: date, data_tests: [not_null]}
      - name: symbol
        description: Normalized security symbol.
        data_type: varchar
        data_tests: [not_null]
        config:
          meta:
            dimension:
              label: Symbol
              type: string
      - name: decision_at
        description: UTC point-in-time feature evaluation boundary.
        data_type: timestamp
        data_tests: [not_null]
        config:
          meta:
            dimension:
              label: Decision time
              time_intervals: [MINUTE, HOUR, DAY, WEEK, MONTH]
              type: timestamp
      - {name: market_session, description: Exchange session containing the decision., data_type: varchar, data_tests: [not_null]}
      - name: strategy
        description: Deterministic strategy evaluated for this decision.
        data_type: varchar
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [momentum, order_flow, relative_value]
        config:
          meta:
            dimension:
              label: Strategy
              type: string
      - name: action
        description: Deterministic BUY, SELL or ABSTAIN decision.
        data_type: varchar
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [BUY, SELL, ABSTAIN]
        config:
          meta:
            dimension:
              label: Action
              type: string
      - name: horizon_seconds
        description: Conditional outcome horizon selected by the decision rule.
        data_type: bigint
        data_tests: [not_null]
        config:
          meta:
            dimension:
              label: Horizon (seconds)
              type: number
      - {name: signed_score, description: Directional score from minus one to one when available., data_type: "decimal(10,8)"}
      - {name: minimum_strength, description: Direction-specific threshold applied to a non-zero score., data_type: "decimal(10,8)"}
      - {name: is_actionable, description: Whether the decision emitted BUY or SELL rather than ABSTAIN., data_type: boolean, data_tests: [not_null]}
      - name: decision_reason_set
        description: Ordered comma-separated abstention reasons; null for actionable decisions.
        data_type: varchar
        config:
          meta:
            dimension:
              label: Abstention reasons
              type: string
      - {name: decision_version, description: Deterministic decision policy version., data_type: varchar, data_tests: [not_null]}
      - {name: decision_configuration_sha256, description: Exact decision policy fingerprint., data_type: varchar, data_tests: [not_null]}
      - {name: strategy_version, description: Deterministic score policy version., data_type: varchar, data_tests: [not_null]}
      - {name: strategy_configuration_sha256, description: Exact strategy policy fingerprint., data_type: varchar, data_tests: [not_null]}
      - {name: outcome_version, description: Referenced execution and markout policy version., data_type: varchar, data_tests: [not_null]}
      - {name: outcome_configuration_sha256, description: Exact referenced outcome policy fingerprint., data_type: varchar, data_tests: [not_null]}
      - {name: feature_version, description: Parent deterministic feature formula version., data_type: varchar, data_tests: [not_null]}
      - {name: feature_configuration_sha256, description: Exact parent feature configuration fingerprint., data_type: varchar, data_tests: [not_null]}
      - {name: feature_snapshot_sha256, description: Immutable parent feature snapshot fingerprint., data_type: varchar, data_tests: [not_null]}
      - {name: strategy_score_sha256, description: Immutable strategy score fingerprint when available., data_type: varchar}
      - name: decision_sha256
        description: Canonical complete shadow decision fingerprint.
        data_type: varchar
        data_tests: [not_null, unique]
        config:
          meta:
            metrics:
              decision_count:
                description: Distinct deterministic shadow decisions.
                label: Decisions
                type: count_distinct
      - {name: has_outcome_label, description: Whether an actionable decision found its exact immutable outcome row., data_type: boolean, data_tests: [not_null]}
      - {name: has_eligible_outcome, description: Whether the matched conditional execution markout passed every quality gate., data_type: boolean, data_tests: [not_null]}
      - {name: has_positive_gross_markout, description: Whether the eligible gross conditional markout is above zero., data_type: boolean, data_tests: [not_null]}
      - name: eligible_gross_return_bps
        description: Gross conditional markout in basis points when eligible; null otherwise.
        data_type: "decimal(18,4)"
        config:
          meta:
            metrics:
              average_eligible_gross_return_bps:
                description: Equal-weight mean gross markout for eligible actionable decisions before fees and taxes.
                label: Mean eligible gross markout (bps)
                round: 2
                type: average
      - {name: order_quantity, description: Shares simulated through the visible Top-3 book for an actionable decision., data_type: bigint}
      - {name: entry_at, description: UTC simulated entry instant after configured latency., data_type: timestamp}
      - {name: horizon_at, description: UTC conditional markout instant., data_type: timestamp}
      - {name: entry_vwap, description: Simulated visible-book entry VWAP in VND., data_type: "decimal(24,8)"}
      - {name: horizon_vwap, description: Simulated opposing-side horizon VWAP in VND., data_type: "decimal(24,8)"}
      - {name: outcome_reasons_json, description: Canonical reasons when the conditional outcome is ineligible., data_type: varchar}
      - {name: outcome_sha256, description: Canonical complete conditional outcome fingerprint for an actionable decision., data_type: varchar}
      - {name: evidence_sha256, description: Fingerprint of the certified immutable manifest evidence set., data_type: varchar, data_tests: [not_null]}
      - {name: certification_evaluated_at, description: UTC time the current evidence set was certified., data_type: timestamp, data_tests: [not_null]}
      - {name: decision_processed_at, description: UTC durable decision materialization time., data_type: timestamp, data_tests: [not_null]}
      - {name: outcome_processed_at, description: UTC durable outcome materialization time for actionable decisions., data_type: timestamp}
