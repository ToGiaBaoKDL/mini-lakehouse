version: 2

models:
  - name: dim_research_papers
    description: Current active research-paper dimension at one row per ArXiv article.
    config:
      meta:
        default_time_dimension:
          field: created_date
          interval: MONTH
        group_label: Research
        label: Research papers
        primary_key: arxiv_id
    columns:
      - name: arxiv_id
        description: Stable ArXiv article identifier.
        data_type: varchar
        data_tests: [not_null, unique]
        config:
          meta:
            metrics:
              paper_count:
                description: Distinct papers in the selected result.
                label: Paper count
                type: count_distinct
      - {name: oai_identifier, description: Stable OAI identifier., data_type: varchar}
      - {name: title, description: Current normalized title., data_type: varchar}
      - {name: abstract, description: Current normalized abstract., data_type: varchar}
      - {name: license_uri, description: Current license URI., data_type: varchar}
      - {name: doi, description: Current DOI., data_type: varchar}
      - {name: journal_ref, description: Current journal reference., data_type: varchar}
      - {name: comments, description: Current author comments., data_type: varchar}
      - name: created_date
        description: Original submission date.
        data_type: date
        config:
          meta:
            dimension:
              label: Created date
              time_intervals: [DAY, WEEK, MONTH, QUARTER, YEAR]
              type: date
      - {name: updated_date, description: Latest revision date., data_type: date}
      - {name: oai_datestamp, description: Latest observed OAI modification date., data_type: date}
      - {name: pdf_url, description: Canonical PDF download URL., data_type: varchar}
      - name: author_count
        description: Number of current author occurrences.
        data_type: bigint
        config:
          meta:
            metrics:
              average_authors_per_paper:
                label: Average authors per paper
                round: 2
                type: average
              total_author_occurrences:
                label: Total author occurrences
                type: sum
      - name: category_count
        description: Number of current category memberships.
        data_type: bigint
        config:
          meta:
            metrics:
              average_categories_per_paper:
                label: Average categories per paper
                round: 2
                type: average
      - {name: primary_category, description: Current primary ArXiv category., data_type: varchar}
      - {name: has_abstract, description: Whether a non-empty abstract is available., data_type: boolean}
      - {name: has_license, description: Whether a non-empty license URI is available., data_type: boolean}
      - {name: has_doi, description: Whether a non-empty DOI is available., data_type: boolean}
      - {name: has_journal_reference, description: Whether a non-empty journal reference is available., data_type: boolean}
      - {name: is_cross_listed, description: Whether the paper belongs to multiple categories., data_type: boolean}
      - {name: revision_lag_days, description: Days from original submission to latest revision., data_type: bigint}
      - {name: curated_at, description: Latest curation timestamp., data_type: timestamp}

  - name: fct_research_publications_daily
    description: Daily research publication measures at publication date and primary category grain.
    config:
      meta:
        default_time_dimension:
          field: publication_date
          interval: MONTH
        group_label: Research
        label: Daily research publications
        primary_key: [publication_date, primary_category]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [publication_date, primary_category]
    columns:
      - name: publication_date
        description: Original ArXiv submission date.
        data_type: date
        data_tests: [not_null]
        config:
          meta:
            dimension:
              label: Publication date
              time_intervals: [DAY, WEEK, MONTH, QUARTER, YEAR]
              type: date
      - name: primary_category
        description: Primary ArXiv category or uncategorized when unavailable.
        data_type: varchar
        data_tests: [not_null]
      - name: paper_count
        description: Papers first submitted in the date and category.
        data_type: bigint
        config:
          meta:
            metrics:
              total_papers:
                label: Total papers
                type: sum
      - name: revised_paper_count
        description: Papers with a revision after original submission.
        data_type: bigint
        config:
          meta:
            metrics:
              total_revised_papers:
                label: Total revised papers
                type: sum
      - name: cross_listed_paper_count
        description: Papers assigned to multiple categories.
        data_type: bigint
        config:
          meta:
            metrics:
              total_cross_listed_papers:
                label: Total cross-listed papers
                type: sum
      - name: papers_with_doi_count
        description: Papers carrying a DOI.
        data_type: bigint
        config:
          meta:
            metrics:
              total_papers_with_doi:
                label: Total papers with DOI
                type: sum
      - name: papers_with_journal_reference_count
        description: Papers carrying a journal reference.
        data_type: bigint
        config:
          meta:
            metrics:
              total_papers_with_journal_reference:
                label: Total papers with journal reference
                type: sum
      - name: author_occurrence_count
        description: Total paper-author occurrences across the group.
        data_type: bigint
        config:
          meta:
            metrics:
              total_author_occurrences:
                label: Total author occurrences
                type: sum
      - {name: avg_author_count, description: Average author occurrences per paper., data_type: double}
      - {name: avg_category_count, description: Average category memberships per paper., data_type: double}
      - {name: avg_revision_lag_days, description: Average days from submission to latest revision., data_type: double}
