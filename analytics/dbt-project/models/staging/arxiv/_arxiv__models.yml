version: 2

models:
  - name: stg_arxiv__papers
    description: Analytics-facing projection of current canonical ArXiv paper metadata.
    columns:
      - {name: arxiv_id, description: Stable ArXiv article identifier., data_type: varchar}
      - {name: oai_identifier, description: Stable OAI identifier., data_type: varchar}
      - {name: title, description: Current normalized title., data_type: varchar}
      - {name: abstract, description: Current normalized abstract., data_type: varchar}
      - {name: license_uri, description: Current license URI., data_type: varchar}
      - {name: doi, description: Current DOI., data_type: varchar}
      - {name: journal_ref, description: Current journal reference., data_type: varchar}
      - {name: comments, description: Current author comments., data_type: varchar}
      - {name: created_date, description: Original submission date., data_type: date}
      - {name: updated_date, description: Latest revision date., data_type: date}
      - {name: oai_datestamp, description: Latest observed OAI modification date., data_type: date}
      - {name: pdf_url, description: Canonical PDF download URL., data_type: varchar}
      - {name: is_deleted, description: Current OAI tombstone state., data_type: boolean}
      - {name: source_record_sha256, description: Winning landing mutation hash., data_type: varchar}
      - {name: curated_at, description: Latest curation timestamp., data_type: timestamp}

  - name: stg_arxiv__paper_authors
    description: Analytics-facing projection of ordered current ArXiv author occurrences.
    columns:
      - {name: arxiv_id, description: Parent paper identifier., data_type: varchar}
      - {name: author_position, description: One-based source author order., data_type: bigint}
      - {name: keyname, description: Author family or key name., data_type: varchar}
      - {name: forenames, description: Author forenames., data_type: varchar}
      - {name: suffix, description: Author suffix., data_type: varchar}
      - {name: affiliation, description: Source affiliation when present., data_type: varchar}
      - {name: oai_datestamp, description: Parent metadata mutation date., data_type: date}
      - {name: curated_at, description: Latest curation timestamp., data_type: timestamp}

  - name: stg_arxiv__paper_categories
    description: Analytics-facing projection of current ArXiv category memberships.
    columns:
      - {name: arxiv_id, description: Parent paper identifier., data_type: varchar}
      - {name: category, description: ArXiv category code., data_type: varchar}
      - {name: is_primary, description: Whether this is the primary category., data_type: boolean}
      - {name: oai_datestamp, description: Parent metadata mutation date., data_type: date}
      - {name: curated_at, description: Latest curation timestamp., data_type: timestamp}
