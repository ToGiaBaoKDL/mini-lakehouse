# Core data plane: object storage, durable Polaris catalog, and Trino.
x-polaris-database: &polaris-database
  POLARIS_PERSISTENCE_TYPE: relational-jdbc
  QUARKUS_DATASOURCE_USERNAME: ${POSTGRES_USER:-lakehouse}
  QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-lakehouse}
  QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/polaris

services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lakehouse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lakehouse}
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/00-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lakehouse} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

  object-store:
    image: quay.io/minio/aistor/minio:RELEASE.2026-06-06T02-44-06Z
    command:
      - minio
      - server
      - /mnt/data
      - --console-address
      - :9001
      - --license
      - /minio.license
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - object-store-data:/mnt/data
      - ./minio.license:/minio.license:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  object-store-provision:
    image: quay.io/minio/aistor/mc:RELEASE.2026-04-21T04-26-49Z
    depends_on:
      object-store:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      LANDING_URI: ${LAKEHOUSE_STORAGE__LANDING_URI:-s3://landing}
      CURATED_URI: ${LAKEHOUSE_STORAGE__CURATED_URI:-s3://curated}
      ANALYTICS_URI: ${LAKEHOUSE_STORAGE__ANALYTICS_URI:-s3://analytics}
    volumes:
      - ./infra/object-store/lifecycle-buckets.sh:/opt/object-store/lifecycle-buckets.sh:ro
    entrypoint: ["/bin/sh", "/opt/object-store/lifecycle-buckets.sh"]
    command: ["provision"]
    restart: "no"

  polaris-bootstrap:
    image: apache/polaris-admin-tool:1.6.0
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *polaris-database
    volumes:
      - ./infra/polaris/bootstrap.sh:/opt/polaris-bootstrap.sh:ro
    entrypoint: ["/bin/sh", "/opt/polaris-bootstrap.sh"]
    command:
      - bootstrap
      - -r
      - ${POLARIS_REALM:-POLARIS}
      - -c
      - ${POLARIS_REALM:-POLARIS},${POLARIS_ROOT_CLIENT_ID:-root},${POLARIS_ROOT_CLIENT_SECRET:-secretpassword}
    restart: "no"

  polaris:
    image: apache/polaris:1.6.0
    depends_on:
      polaris-bootstrap:
        condition: service_completed_successfully
      object-store-provision:
        condition: service_completed_successfully
    environment:
      <<: *polaris-database
      POLARIS_REALM_CONTEXT_REALMS: ${POLARIS_REALM:-POLARIS}
      AWS_REGION: ${LAKEHOUSE_STORAGE__REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_ENDPOINT_URL_S3: http://object-store:9000
      POLARIS_STORAGE_AWS_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      POLARIS_STORAGE_AWS_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      JAVA_OPTS: >-
        -Dpolaris.behavior-changes."ALLOW_NAMESPACE_CUSTOM_LOCATION"=true
    ports:
      - "127.0.0.1:8181:8181"
      - "127.0.0.1:8182:8182"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8182/q/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 24

  platform-reconcile:
    image: mini-lakehouse:local
    build:
      context: .
      target: runtime
    depends_on:
      polaris:
        condition: service_healthy
    env_file:
      - ./infra/config/platform.container.env
    environment:
      LAKEHOUSE_ENVIRONMENT: ${LAKEHOUSE_ENVIRONMENT:-local}
      LAKEHOUSE_LOG_LEVEL: ${LAKEHOUSE_LOG_LEVEL:-INFO}
      LAKEHOUSE_STORAGE__BACKEND: ${LAKEHOUSE_STORAGE__BACKEND:-s3}
      LAKEHOUSE_STORAGE__ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      LAKEHOUSE_STORAGE__SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      LAKEHOUSE_STORAGE__REGION: ${LAKEHOUSE_STORAGE__REGION:-us-east-1}
      LAKEHOUSE_STORAGE__PATH_STYLE_ACCESS: "${LAKEHOUSE_STORAGE__PATH_STYLE_ACCESS:-true}"
      LAKEHOUSE_STORAGE__ICEBERG_ACCESS_DELEGATION: ${LAKEHOUSE_STORAGE__ICEBERG_ACCESS_DELEGATION:-none}
      LAKEHOUSE_STORAGE__STS_UNAVAILABLE: "${LAKEHOUSE_STORAGE__STS_UNAVAILABLE:-true}"
      LAKEHOUSE_STORAGE__KMS_UNAVAILABLE: "${LAKEHOUSE_STORAGE__KMS_UNAVAILABLE:-true}"
      LAKEHOUSE_STORAGE__LANDING_URI: ${LAKEHOUSE_STORAGE__LANDING_URI:-s3://landing}
      LAKEHOUSE_STORAGE__CURATED_URI: ${LAKEHOUSE_STORAGE__CURATED_URI:-s3://curated}
      LAKEHOUSE_STORAGE__ANALYTICS_URI: ${LAKEHOUSE_STORAGE__ANALYTICS_URI:-s3://analytics}
      LAKEHOUSE_POLARIS__CATALOG_NAME: ${LAKEHOUSE_POLARIS__CATALOG_NAME:-prod}
      LAKEHOUSE_POLARIS__REALM: ${POLARIS_REALM:-POLARIS}
      LAKEHOUSE_POLARIS__CREDENTIAL: ${POLARIS_ROOT_CLIENT_ID:-root}:${POLARIS_ROOT_CLIENT_SECRET:-secretpassword}
      LAKEHOUSE_POLARIS__SCOPE: ${LAKEHOUSE_POLARIS__SCOPE:-PRINCIPAL_ROLE:ALL}
    command: python -m mini_lakehouse.platform.reconcile
    restart: "no"

  trino:
    image: trinodb/trino:483
    depends_on:
      platform-reconcile:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_ENDPOINT: http://object-store:9000
      S3_REGION: ${LAKEHOUSE_STORAGE__REGION:-us-east-1}
      S3_PATH_STYLE_ACCESS: ${LAKEHOUSE_STORAGE__PATH_STYLE_ACCESS:-true}
      ICEBERG_VENDED_CREDENTIALS_ENABLED: "false"
      POLARIS_CREDENTIAL: ${POLARIS_ROOT_CLIENT_ID:-root}:${POLARIS_ROOT_CLIENT_SECRET:-secretpassword}
      POLARIS_CATALOG: ${LAKEHOUSE_POLARIS__CATALOG_NAME:-prod}
      TRINO_NODE_ENVIRONMENT: local
      TRINO_NODE_ID: mini-lakehouse-coordinator
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./infra/trino/etc:/etc/trino:ro
      - trino-data:/data/trino
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/v1/info"]
      interval: 5s
      timeout: 5s
      retries: 24

volumes:
  object-store-data:
  postgres-data:
  trino-data:
