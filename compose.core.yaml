# Core data plane: object storage, durable Polaris catalog, and Trino.
x-polaris-database: &polaris-database
  POLARIS_PERSISTENCE_TYPE: relational-jdbc
  QUARKUS_DATASOURCE_USERNAME: ${POSTGRES_USER:-lakehouse}
  QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-lakehouse}
  QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/polaris

x-lakehouse-environment: &lakehouse-environment
  LAKEHOUSE_ENVIRONMENT: local
  LAKEHOUSE_STORAGE__BACKEND: s3
  LAKEHOUSE_STORAGE__ENDPOINT_URL: http://object-store:9000
  LAKEHOUSE_STORAGE__ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
  LAKEHOUSE_STORAGE__SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
  LAKEHOUSE_STORAGE__REGION: us-east-1
  LAKEHOUSE_STORAGE__LANDING_URI: s3://landing
  LAKEHOUSE_STORAGE__CURATED_URI: s3://curated
  LAKEHOUSE_STORAGE__ANALYTICS_URI: s3://analytics
  LAKEHOUSE_POLARIS__CATALOG_NAME: prod
  LAKEHOUSE_POLARIS__URI: http://polaris:8181/api/catalog
  LAKEHOUSE_POLARIS__MANAGEMENT_URI: http://polaris:8181/api/management/v1
  LAKEHOUSE_POLARIS__OAUTH2_SERVER_URI: http://polaris:8181/api/catalog/v1/oauth/tokens
  LAKEHOUSE_POLARIS__REALM: ${POLARIS_REALM:-POLARIS}
  LAKEHOUSE_POLARIS__CREDENTIAL: ${POLARIS_ROOT_CLIENT_ID:-root}:${POLARIS_ROOT_CLIENT_SECRET:-secretpassword}
  LAKEHOUSE_TRINO__HOST: trino
  LAKEHOUSE_TRINO__PORT: 8080
  LAKEHOUSE_TRINO__USER: lakehouse
  DBT_CATALOG: prod
  DBT_TARGET: local
  DBT_PROFILES_DIR: /app/dbt_project
  DBT_PROJECT_DIR: /app/dbt_project
  TRINO_HOST: trino
  TRINO_PORT: 8080
  TRINO_USER: lakehouse

services:
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lakehouse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lakehouse}
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/00-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lakehouse} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

  object-store:
    image: quay.io/minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - object-store-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  object-store-bootstrap:
    image: minio/mc:latest
    depends_on:
      object-store:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://object-store:9000
        ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
        mc mb --ignore-existing local/landing local/curated local/analytics
    restart: "no"

  polaris-admin:
    image: apache/polaris-admin-tool:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *polaris-database
    volumes:
      - ./infra/polaris/bootstrap.sh:/opt/polaris-bootstrap.sh:ro
    entrypoint: ["/bin/sh", "/opt/polaris-bootstrap.sh"]
    command:
      - bootstrap
      - -r
      - ${POLARIS_REALM:-POLARIS}
      - -c
      - ${POLARIS_REALM:-POLARIS},${POLARIS_ROOT_CLIENT_ID:-root},${POLARIS_ROOT_CLIENT_SECRET:-secretpassword}
    restart: "no"

  polaris:
    image: apache/polaris:latest
    depends_on:
      polaris-admin:
        condition: service_completed_successfully
      object-store-bootstrap:
        condition: service_completed_successfully
    environment:
      <<: *polaris-database
      POLARIS_REALM_CONTEXT_REALMS: ${POLARIS_REALM:-POLARIS}
      POLARIS_READINESS_IGNORE_SEVERE_ISSUES: "true"
      QUARKUS_CONFIG_VALIDATE_UNKNOWN: "false"
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_ENDPOINT_URL_S3: http://object-store:9000
      POLARIS_STORAGE_AWS_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      POLARIS_STORAGE_AWS_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      JAVA_OPTS: >-
        -Dpolaris.behavior-changes."ALLOW_NAMESPACE_CUSTOM_LOCATION"=true
    ports:
      - "127.0.0.1:8181:8181"
      - "127.0.0.1:8182:8182"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8182/q/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 24

  lakehouse-bootstrap:
    image: mini-lakehouse:local
    build:
      context: .
      target: runtime
    depends_on:
      polaris:
        condition: service_healthy
    environment:
      <<: *lakehouse-environment
    command: python -m mini_lakehouse.platform.bootstrap
    restart: "no"

  trino:
    image: trinodb/trino:latest
    depends_on:
      lakehouse-bootstrap:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      POLARIS_CREDENTIAL: ${POLARIS_ROOT_CLIENT_ID:-root}:${POLARIS_ROOT_CLIENT_SECRET:-secretpassword}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./infra/trino/etc:/etc/trino:ro
      - trino-data:/data/trino
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/v1/info"]
      interval: 5s
      timeout: 5s
      retries: 24

volumes:
  object-store-data:
  postgres-data:
  trino-data:
