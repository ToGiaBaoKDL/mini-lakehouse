sdk_version: 0.1.5
adapter_version: 2.0.0

limits:
  max_pdf_bytes: 104857600
  max_pages_per_document: 500
  max_output_bytes: 1073741824

model:
  repository: zai-org/GLM-OCR
  revision: ca5d8b3e287e52589e37c28385d9655ee4372f9d

layout_model:
  repository: PaddlePaddle/PP-DocLayoutV3_safetensors
  revision: 97d101e6db2642e162a1d05392d1b0231c91033e

inference:
  api_port: 8080
  max_model_len: 16384
  gpu_memory_utilization: 0.80
  speculative_tokens: 3
  max_num_seqs: 4
  max_workers: 8
  request_timeout_seconds: 600
  layout_device: cpu
  prompts:
    text: "Text Recognition:/nothink"
    table: "Table Recognition:/nothink"
    formula: "Formula Recognition:/nothink"

modal:
  app_name: ocr-engine
  output_volume: ocr-engine-results
  environment: main
  gpu: A100-40GB
  timeout_seconds: 14400
  scaledown_window_seconds: 300
