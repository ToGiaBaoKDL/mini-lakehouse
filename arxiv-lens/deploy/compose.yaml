# Self-hosted read-only ArXiv OCR inspection surface.

services:
  arxiv-lens:
    image: "${ARXIV_LENS_IMAGE:-arxiv-lens:local}"
    user: "${LOCAL_UID}:0"
    environment:
      LAKEHOUSE_ENVIRONMENT: ${LAKEHOUSE_ENVIRONMENT}
      AWS_CONFIG_FILE: /run/aws/config
      AWS_EC2_METADATA_DISABLED: "true"
      LAKEHOUSE_LOG_LEVEL: WARNING
      STREAMLIT_LOGGER_LEVEL: warning
      OTEL_SERVICE_NAME: arxiv-lens
      OTEL_EXPORTER_OTLP_ENDPOINT: http://signoz-collection-agent:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=${LAKEHOUSE_ENVIRONMENT}"
    volumes:
      - ${AWS_IDENTITY_DIR}/arxiv-lens:/run/aws:ro
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:8501:8501"
    networks:
      - telemetry
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request as u; u.urlopen('http://localhost:8501/_stcore/health', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

networks:
  telemetry:
    external: true
    name: lakehouse-observability
