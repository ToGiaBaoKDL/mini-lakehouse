# Optional orchestration control plane. Always combine with compose.core.yaml.

x-lakehouse-runtime: &lakehouse-runtime
  env_file:
    - ./infra/config/platform.container.env
    - ./infra/config/orchestration.container.env
  environment:
    LAKEHOUSE_ENVIRONMENT: ${LAKEHOUSE_ENVIRONMENT:-local}
    LAKEHOUSE_LOG_LEVEL: ${LAKEHOUSE_LOG_LEVEL:-INFO}
    LAKEHOUSE_STORAGE__ENDPOINTS__EXTERNAL_URL: ${LAKEHOUSE_STORAGE__ENDPOINTS__EXTERNAL_URL:-http://localhost:9000}
    LAKEHOUSE_STORAGE__ENDPOINTS__INTERNAL_URL: ${LAKEHOUSE_STORAGE__ENDPOINTS__INTERNAL_URL:-http://object-store:9000}
    LAKEHOUSE_STORAGE__ACCESS_KEY: ${OBJECT_STORE_PREFECT_INGESTION_ACCESS_KEY:?Set OBJECT_STORE_PREFECT_INGESTION_ACCESS_KEY in .env}
    LAKEHOUSE_STORAGE__REGION: ${LAKEHOUSE_STORAGE__REGION:-us-east-1}
    LAKEHOUSE_STORAGE__PATH_STYLE_ACCESS: "${LAKEHOUSE_STORAGE__PATH_STYLE_ACCESS:-true}"
    LAKEHOUSE_STORAGE__ICEBERG_ACCESS_DELEGATION: ${LAKEHOUSE_STORAGE__ICEBERG_ACCESS_DELEGATION:-none}
    LAKEHOUSE_STORAGE__STS_UNAVAILABLE: "${LAKEHOUSE_STORAGE__STS_UNAVAILABLE:-true}"
    LAKEHOUSE_STORAGE__KMS_UNAVAILABLE: "${LAKEHOUSE_STORAGE__KMS_UNAVAILABLE:-true}"
    LAKEHOUSE_STORAGE__LANDING_URI: ${LAKEHOUSE_STORAGE__LANDING_URI:-s3://landing}
    LAKEHOUSE_STORAGE__CURATED_URI: ${LAKEHOUSE_STORAGE__CURATED_URI:-s3://curated}
    LAKEHOUSE_STORAGE__ANALYTICS_URI: ${LAKEHOUSE_STORAGE__ANALYTICS_URI:-s3://analytics}
    LAKEHOUSE_POLARIS__CATALOG_NAME: ${LAKEHOUSE_POLARIS__CATALOG_NAME:-prod}
    LAKEHOUSE_POLARIS__REALM: ${POLARIS_REALM:-POLARIS}
    LAKEHOUSE_POLARIS__CLIENT_ID: prefect_ingestion
    LAKEHOUSE_POLARIS__SCOPE: ${LAKEHOUSE_POLARIS__SCOPE:-PRINCIPAL_ROLE:ALL}
    LAKEHOUSE_ARXIV__BASE_URL: ${LAKEHOUSE_ARXIV__BASE_URL:-https://oaipmh.arxiv.org/oai}
    LAKEHOUSE_ARXIV__METADATA_PREFIX: ${LAKEHOUSE_ARXIV__METADATA_PREFIX:-arXiv}
    LAKEHOUSE_ARXIV__REQUEST_TIMEOUT_SECONDS: "${LAKEHOUSE_ARXIV__REQUEST_TIMEOUT_SECONDS:-120}"
    LAKEHOUSE_ARXIV__MAX_PAGES_PER_DAY: "${LAKEHOUSE_ARXIV__MAX_PAGES_PER_DAY:-1000}"
    LAKEHOUSE_ARXIV__USER_AGENT: ${LAKEHOUSE_ARXIV__USER_AGENT:-mini-lakehouse}
    LAKEHOUSE_KAGGLE__USERNAME: ${LAKEHOUSE_KAGGLE__USERNAME:-}
    LAKEHOUSE_KAGGLE__API_TOKEN: ${LAKEHOUSE_KAGGLE__API_TOKEN:-}
    MODAL_TOKEN_ID: ${MODAL_TOKEN_ID:-}
    MODAL_TOKEN_SECRET: ${MODAL_TOKEN_SECRET:-}
    LAKEHOUSE_NOTIFICATIONS__PREFECT_UI_URL: ${LAKEHOUSE_NOTIFICATIONS__PREFECT_UI_URL:-http://localhost:4200}
    LAKEHOUSE_NOTIFICATIONS__SLACK_BOT_TOKEN: ${LAKEHOUSE_NOTIFICATIONS__SLACK_BOT_TOKEN:-}
    LAKEHOUSE_NOTIFICATIONS__SLACK_CHANNEL_ID: ${LAKEHOUSE_NOTIFICATIONS__SLACK_CHANNEL_ID:-}
    LAKEHOUSE_NOTIFICATIONS__GMAIL_SENDER: ${LAKEHOUSE_NOTIFICATIONS__GMAIL_SENDER:-}
    LAKEHOUSE_NOTIFICATIONS__GMAIL_APP_PASSWORD: ${LAKEHOUSE_NOTIFICATIONS__GMAIL_APP_PASSWORD:-}
    LAKEHOUSE_NOTIFICATIONS__GMAIL_RECIPIENTS: '${LAKEHOUSE_NOTIFICATIONS__GMAIL_RECIPIENTS:-[]}'
    DBT_TARGET: ${DBT_TARGET:-local}
    DBT_THREADS: "${DBT_THREADS:-4}"
    PREFECT_API_URL: http://prefect-server:4200/api
  secrets:
    - source: object_store_prefect_ingestion_secret_key
      target: LAKEHOUSE_STORAGE__SECRET_KEY
    - source: polaris_prefect_ingestion_client_secret
      target: LAKEHOUSE_POLARIS__CLIENT_SECRET

x-orchestration-image: &orchestration-image
  image: mini-lakehouse-orchestration:local

x-prefect-image: &prefect-image prefecthq/prefect:3.7.8-python3.12

x-prefect-server-environment: &prefect-server-environment
  PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://${POSTGRES_USER:-lakehouse}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/prefect
  PREFECT_MESSAGING_BROKER: prefect_redis.messaging
  PREFECT_MESSAGING_CACHE: prefect_redis.messaging
  PREFECT_REDIS_MESSAGING_HOST: redis
  PREFECT_REDIS_MESSAGING_PORT: 6379
  PREFECT_REDIS_MESSAGING_DB: 0
  PREFECT_SERVER_DOCKET_URL: redis://redis:6379/1
  PREFECT_SERVER_EVENTS_CAUSAL_ORDERING: prefect_redis.ordering
  PREFECT_SERVER_CONCURRENCY_LEASE_STORAGE: prefect_redis.lease_storage

services:
  redis:
    image: redis:8.8.0
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  prefect-server:
    image: *prefect-image
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *prefect-server-environment
      PREFECT_SERVER_API_HOST: 0.0.0.0
      PREFECT_SERVER_UI_API_URL: http://localhost:4200/api
    command: prefect server start --no-services
    ports:
      - "127.0.0.1:4200:4200"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:4200/api/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  prefect-services:
    image: *prefect-image
    depends_on:
      prefect-server:
        condition: service_healthy
    environment:
      <<: *prefect-server-environment
    command: prefect server services start
    restart: unless-stopped

  prefect-bootstrap:
    <<: [*orchestration-image, *lakehouse-runtime]
    depends_on:
      prefect-server:
        condition: service_healthy
    command: python -m orchestration.runtime bootstrap
    restart: "no"

  prefect-worker:
    <<: [*orchestration-image, *lakehouse-runtime]
    build:
      context: .
      target: orchestration
    depends_on:
      prefect-bootstrap:
        condition: service_completed_successfully
      trino:
        condition: service_healthy
    command: python -m orchestration.runtime worker
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  prefect-deploy:
    <<: [*orchestration-image, *lakehouse-runtime]
    depends_on:
      prefect-bootstrap:
        condition: service_completed_successfully
      prefect-worker:
        condition: service_started
    command: prefect deploy --all
    restart: "no"

volumes:
  redis-data:
