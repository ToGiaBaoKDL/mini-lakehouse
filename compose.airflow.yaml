x-airflow-common: &airflow-common
  image: lakehouse-platform-airflow:local
  build:
    context: .
    target: airflow
  env_file:
    - .env
  environment: &airflow-environment
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/orchestration/dags
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__PARALLELISM: "${AIRFLOW_PARALLELISM:-4}"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "${AIRFLOW_USERS:-admin:admin}"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:?Set AIRFLOW_DB_PASSWORD in .env}@airflow-postgres:5432/airflow"
    AIRFLOW__API_AUTH__JWT_SECRET: "${AIRFLOW_JWT_SECRET:?Set AIRFLOW_JWT_SECRET in .env}"
    AIRFLOW__API__BASE_URL: "http://localhost:8080"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__CORE__FERNET_KEY: "${AIRFLOW_FERNET_KEY:?Set AIRFLOW_FERNET_KEY in .env}"
    AIRFLOW__SECRETS__BACKEND: orchestration.config.aws_secrets.AwsSecretsBackend
    AIRFLOW__SECRETS__BACKEND_KWARGS: '{"connections_prefix":"${AIRFLOW_CONNECTIONS_PREFIX:-lakehouse/dev/airflow/connections}","variables_prefix":"${AIRFLOW_VARIABLES_PREFIX:-/lakehouse/dev}","profile_name":"${AIRFLOW_AWS_PROFILE:-lakehouse-dev-airflow}","region_name":"${AWS_REGION:-ap-southeast-1}"}'
    AIRFLOW_CONN_AWS_DEFAULT: "aws://?region_name=${AWS_REGION:-ap-southeast-1}"
    AWS_PROFILE: "${AIRFLOW_AWS_PROFILE:-lakehouse-dev-airflow}"
    AWS_REGION: "${AWS_REGION:-ap-southeast-1}"
  volumes:
    - airflow-logs:/opt/airflow/logs
    - ./orchestration:/opt/airflow/orchestration:ro
    - ${AWS_CONFIG_DIR:-./.aws}:/home/airflow/.aws:ro
  depends_on:
    airflow-postgres:
      condition: service_healthy
    airflow-init:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  airflow-postgres:
    image: postgres:17.10
    environment:
      POSTGRES_USER: "${AIRFLOW_DB_USER:-airflow}"
      POSTGRES_PASSWORD: "${AIRFLOW_DB_PASSWORD:?Set AIRFLOW_DB_PASSWORD in .env}"
      POSTGRES_DB: airflow
    volumes:
      - airflow-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_DB_USER:-airflow} -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  airflow-init:
    image: lakehouse-platform-airflow:local
    build:
      context: .
      target: airflow
    env_file:
      - .env
    environment:
      <<: *airflow-environment
    volumes:
      - airflow-logs:/opt/airflow/logs
    depends_on:
      airflow-postgres:
        condition: service_healthy
    command: airflow db migrate
    restart: "no"

  airflow-api-server:
    <<: *airflow-common
    command: airflow api-server
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request as u; u.urlopen('http://localhost:8080/api/v2/monitor/health', timeout=2)",
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s

  airflow-scheduler:
    <<: *airflow-common
    command: airflow scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  airflow-dag-processor:
    <<: *airflow-common
    command: airflow dag-processor

  airflow-triggerer:
    <<: *airflow-common
    command: airflow triggerer
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type TriggererJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  airflow-logs:
  airflow-postgres-data:
