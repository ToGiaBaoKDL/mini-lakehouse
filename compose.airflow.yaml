x-airflow-common: &airflow-common
  image: "${AIRFLOW_IMAGE:-airflow:local}"
  user: "${LOCAL_UID}:0"
  environment: &airflow-environment
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/orchestration/dags
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__PARALLELISM: "4"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN_CMD: >-
      python -c "from pathlib import Path; from urllib.parse import quote_plus;
      password = quote_plus(Path('/run/secrets/airflow_db_password').read_text().strip());
      print('postgresql+psycopg2://airflow:' + password + '@airflow-postgres:5432/airflow')"
    AIRFLOW__API_AUTH__JWT_SECRET_CMD: cat /run/secrets/airflow_jwt_secret
    AIRFLOW__API__BASE_URL: "http://${HOST_BIND_ADDRESS:-127.0.0.1}:8080"
    AIRFLOW__CORE__FERNET_KEY_CMD: cat /run/secrets/airflow_fernet_key
    AIRFLOW__SECRETS__BACKEND: orchestration.config.aws_secrets.AwsSecretsBackend
    AIRFLOW__SECRETS__BACKEND_KWARGS: '{"connections_prefix":"lakehouse/${LAKEHOUSE_ENVIRONMENT}/airflow/connections","variables_prefix":"/lakehouse/${LAKEHOUSE_ENVIRONMENT}"}'
    AWS_CONFIG_FILE: /run/aws/config
    AWS_EC2_METADATA_DISABLED: "true"
    LAKEHOUSE_ENVIRONMENT: "${LAKEHOUSE_ENVIRONMENT}"
    HOST_AWS_IDENTITY_DIR: "${AWS_IDENTITY_DIR}"
  secrets: &airflow-secrets
    - airflow_db_password
    - airflow_fernet_key
    - airflow_jwt_secret
  volumes:
    - airflow-logs:/opt/airflow/logs
    - ${AWS_IDENTITY_DIR}/airflow:/run/aws:ro
  depends_on:
    airflow-postgres:
      condition: service_healthy
    airflow-init:
      condition: service_completed_successfully
  restart: unless-stopped
  stop_grace_period: 60s

services:
  airflow-postgres:
    image: postgres:17.10@sha256:a426e44bac0b759c95894d68e1a0ac03ecc20b619f498a91aae373bf06d8508d
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD_FILE: /run/secrets/airflow_db_password
      POSTGRES_DB: airflow
    secrets:
      - airflow_db_password
    volumes:
      - airflow-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  airflow-init:
    image: "${AIRFLOW_IMAGE:-airflow:local}"
    user: "${LOCAL_UID}:0"
    environment:
      <<: *airflow-environment
    secrets: *airflow-secrets
    volumes:
      - airflow-logs:/opt/airflow/logs
      - ${AWS_IDENTITY_DIR}/airflow:/run/aws:ro
    depends_on:
      airflow-postgres:
        condition: service_healthy
    command: airflow db migrate
    restart: "no"

  airflow-api-server:
    <<: *airflow-common
    command: airflow api-server
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:8080:8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request as u; u.urlopen('http://localhost:8080/api/v2/version', timeout=2)",
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s

  airflow-scheduler:
    <<: *airflow-common
    command: airflow scheduler
    group_add:
      - "${DOCKER_GID}"
    volumes:
      - airflow-logs:/opt/airflow/logs
      - ${AWS_IDENTITY_DIR}/airflow:/run/aws:ro
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  airflow-dag-processor:
    <<: *airflow-common
    command: airflow dag-processor
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "airflow jobs check --job-type DagProcessorJob --hostname \"$${HOSTNAME}\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  airflow-triggerer:
    <<: *airflow-common
    command: airflow triggerer
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type TriggererJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  airflow-logs:
  airflow-postgres-data:

secrets:
  airflow_db_password:
    environment: AIRFLOW_DB_PASSWORD
  airflow_fernet_key:
    environment: AIRFLOW_FERNET_KEY
  airflow_jwt_secret:
    environment: AIRFLOW_JWT_SECRET
