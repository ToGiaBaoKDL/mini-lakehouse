name: mini-lakehouse
prefect-version: 3.7.8

build: null
push: null
pull: null

deployments:
  - name: github-archive-hourly
    description: Ingest the previous complete UTC hour, then build tested dbt marts.
    entrypoint: src/mini_lakehouse/orchestration/flows/github_archive.py:ingest_and_transform_github_archive
    parameters: {}
    schedules:
      - cron: "15 * * * *"
        timezone: UTC
        active: true
    concurrency_limit:
      limit: 1
      collision_strategy: ENQUEUE
    work_pool:
      name: lakehouse-process
      work_queue_name: default

  - name: github-archive-backfill
    description: Manually backfill an inclusive range of UTC archive hours.
    entrypoint: src/mini_lakehouse/orchestration/flows/github_archive.py:backfill_github_archive
    parameters:
      start: "2025-01-01T00:00:00Z"
      end: "2025-01-01T00:00:00Z"
    schedules: []
    concurrency_limit:
      limit: 1
      collision_strategy: ENQUEUE
    work_pool:
      name: lakehouse-process
      work_queue_name: default

  - name: iceberg-maintenance-weekly
    description: Compact data files and expire safe Iceberg metadata for owned tables.
    entrypoint: src/mini_lakehouse/orchestration/flows/maintenance.py:maintain_iceberg_tables
    parameters: {}
    schedules:
      - cron: "0 3 * * 0"
        timezone: UTC
        active: true
    concurrency_limit:
      limit: 1
      collision_strategy: ENQUEUE
    work_pool:
      name: lakehouse-process
      work_queue_name: maintenance
