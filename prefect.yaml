name: mini-lakehouse
prefect-version: 3.7.8

build: null
push: null
pull: null

definitions:
  concurrency_limits:
    singleton: &singleton
      limit: 1
      collision_strategy: ENQUEUE

  runtime:
    worker:
      concurrency_limit: 4
    work_pool:
      name: &lakehouse_work_pool lakehouse-process
      type: process
      concurrency_limit: 4
    work_queues:
      - name: &ingestion_work_queue ingestion
        priority: 2
        concurrency_limit: 2
      - name: &transformation_work_queue transformation
        priority: 3
        concurrency_limit: 1
      - name: &processing_work_queue processing
        priority: 4
        concurrency_limit: 1
      - name: &maintenance_work_queue maintenance
        priority: 5
        concurrency_limit: 1

  work_pools:
    ingestion: &ingestion_work_pool
      name: *lakehouse_work_pool
      work_queue_name: *ingestion_work_queue
    transformation: &transformation_work_pool
      name: *lakehouse_work_pool
      work_queue_name: *transformation_work_queue
    processing: &processing_work_pool
      name: *lakehouse_work_pool
      work_queue_name: *processing_work_queue
    maintenance: &maintenance_work_pool
      name: *lakehouse_work_pool
      work_queue_name: *maintenance_work_queue

deployments:
  - name: el_github_archive
    description: Land one complete UTC GitHub Archive hour at minute 15 each hour.
    entrypoint: orchestration/flows/github/el_github_archive.py:el_github_archive
    parameters:
      archive_hour: null
    schedules:
      - cron: "15 * * * *"
        timezone: UTC
        active: true
    concurrency_limit: *singleton
    work_pool: *ingestion_work_pool

  - name: tl_github_analytics
    description: Curate the latest landed GitHub hour, then freshness-check and build all dbt resources.
    entrypoint: orchestration/flows/github/tl_github_analytics.py:tl_github_analytics
    parameters:
      archive_hour: null
    schedules:
      - cron: "30 * * * *"
        timezone: UTC
        active: true
    concurrency_limit: *singleton
    work_pool: *transformation_work_pool

  - name: etl_arxiv_metadata
    description: Harvest and curate the closed ArXiv OAI datestamp day.
    entrypoint: orchestration/flows/arxiv/etl_arxiv_metadata.py:etl_arxiv_metadata
    parameters:
      datestamp_date: null
      refresh: false
    schedules:
      - cron: "0 6 * * *"
        timezone: UTC
        active: true
    concurrency_limit: *singleton
    work_pool: *ingestion_work_pool

  - name: etl_arxiv_ocr
    description: Reconcile the exact Kaggle GLM-OCR run and submit the next bounded ArXiv batch.
    entrypoint: orchestration/flows/arxiv/etl_arxiv_ocr.py:etl_arxiv_ocr
    parameters:
      arxiv_ids: null
      batch_size: null
    schedules:
      - cron: "*/20 * * * *"
        timezone: UTC
        # Kaggle GPU time is quota-bound. Resume only after credentials and the
        # runner/runtime Datasets and private kernel have been validated.
        active: false
    concurrency_limit: *singleton
    work_pool: *processing_work_pool

  - name: gov_arxiv_ocr_resources
    description: Manually reconcile private, versioned Kaggle OCR runner, runtime, and models.
    entrypoint: orchestration/flows/arxiv/gov_arxiv_ocr_resources.py:gov_arxiv_ocr_resources
    schedules: []
    concurrency_limit: *singleton
    work_pool: *maintenance_work_pool

  - name: gov_iceberg_maintenance
    description: Apply inherited Polaris maintenance policies to discovered Iceberg tables.
    entrypoint: orchestration/flows/platform/gov_iceberg_maintenance.py:gov_iceberg_maintenance
    parameters:
      max_concurrency: 4
    schedules:
      - cron: "0 3 * * 0"
        timezone: UTC
        active: true
    concurrency_limit: *singleton
    work_pool: *maintenance_work_pool
