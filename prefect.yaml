name: mini-lakehouse
prefect-version: 3.7.8

build: null
push: null
pull: null

definitions:
  concurrency_limits:
    singleton: &singleton
      limit: 1
      collision_strategy: ENQUEUE

  work_pools:
    ingestion: &ingestion_work_pool
      name: lakehouse-process
      work_queue_name: ingestion
    transformation: &transformation_work_pool
      name: lakehouse-process
      work_queue_name: transformation
    maintenance: &maintenance_work_pool
      name: lakehouse-process
      work_queue_name: maintenance

deployments:
  - name: el_github_archive
    description: Land one complete UTC GitHub Archive hour at minute 15 each hour.
    entrypoint: orchestration/flows/github/el_github_archive.py:el_github_archive
    parameters:
      archive_hour: null
    schedules:
      - cron: "15 * * * *"
        timezone: UTC
        active: true
    concurrency_limit: *singleton
    work_pool: *ingestion_work_pool

  - name: tl_github_analytics
    description: Curate the latest landed GitHub hour, then freshness-check and build all dbt resources.
    entrypoint: orchestration/flows/github/tl_github_analytics.py:tl_github_analytics
    parameters:
      archive_hour: null
    schedules:
      - cron: "30 * * * *"
        timezone: UTC
        active: true
    concurrency_limit: *singleton
    work_pool: *transformation_work_pool

  - name: gov_iceberg_maintenance
    description: Apply inherited Polaris maintenance policies to discovered Iceberg tables.
    entrypoint: orchestration/flows/platform/gov_iceberg_maintenance.py:gov_iceberg_maintenance
    parameters:
      max_concurrency: 4
    schedules:
      - cron: "0 3 * * 0"
        timezone: UTC
        active: true
    concurrency_limit: *singleton
    work_pool: *maintenance_work_pool
