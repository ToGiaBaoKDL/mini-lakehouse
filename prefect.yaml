name: mini-lakehouse
prefect-version: 3.7.8

build: null
push: null
pull: null

deployments:
  - name: etl_github_archive_hourly
    description: Ingest the previous complete UTC hour, then build tested dbt marts.
    entrypoint: orchestration/etl_github_archive_hourly.py:etl_github_archive_hourly
    parameters: {}
    schedules:
      - cron: "15 * * * *"
        timezone: UTC
        active: true
    concurrency_limit:
      limit: 1
      collision_strategy: ENQUEUE
    work_pool:
      name: lakehouse-process
      work_queue_name: default

  - name: etl_github_archive_backfill
    description: Manually backfill an inclusive range of UTC archive hours.
    entrypoint: orchestration/etl_github_archive_backfill.py:etl_github_archive_backfill
    parameters:
      start: "2025-01-01T00:00:00Z"
      end: "2025-01-01T00:00:00Z"
    schedules: []
    concurrency_limit:
      limit: 1
      collision_strategy: ENQUEUE
    work_pool:
      name: lakehouse-process
      work_queue_name: default

  - name: gov_iceberg_maintenance
    description: Apply inherited Polaris maintenance policies to discovered Iceberg tables.
    entrypoint: orchestration/gov_iceberg_maintenance.py:gov_iceberg_maintenance
    parameters: {}
    schedules:
      - cron: "0 3 * * 0"
        timezone: UTC
        active: true
    concurrency_limit:
      limit: 1
      collision_strategy: ENQUEUE
    work_pool:
      name: lakehouse-process
      work_queue_name: maintenance
