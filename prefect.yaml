name: mini-lakehouse
prefect-version: 3.7.8

build: null
push: null
pull: null

definitions:
  concurrency_limits:
    singleton: &singleton
      limit: 1
      collision_strategy: ENQUEUE

  work_pools:
    default: &default_work_pool
      name: lakehouse-process
      work_queue_name: default
    maintenance: &maintenance_work_pool
      name: lakehouse-process
      work_queue_name: maintenance

deployments:
  - name: etl_github_archive
    description: >-
      Ingest the previous complete UTC hour by default. Set start_hour for a one-hour custom run,
      or start_hour and end_hour for an inclusive backfill, then build tested dbt marts.
    entrypoint: orchestration/flows/etl_github_archive.py:etl_github_archive
    parameters:
      start_hour: null
      end_hour: null
    schedules:
      - cron: "15 * * * *"
        timezone: UTC
        active: true
    concurrency_limit: *singleton
    work_pool: *default_work_pool

  - name: gov_iceberg_maintenance
    description: Apply inherited Polaris maintenance policies to discovered Iceberg tables.
    entrypoint: orchestration/flows/gov_iceberg_maintenance.py:gov_iceberg_maintenance
    parameters:
      max_concurrency: 4
    schedules:
      - cron: "0 3 * * 0"
        timezone: UTC
        active: true
    concurrency_limit: *singleton
    work_pool: *maintenance_work_pool
